// 雲端服務網址（同 ../index.html，結尾不要加斜線）。留空字串＝測試模式：不連網，按「送出」只在 console 印出要送的資料。
// 本機練習：測試資料/網頁測試伺服器.py 會複製一份、把這一行換成本機雲端；正本一律保持正式網址
var SERVICE_URL = 'https://gov-subsidy-450277428146.asia-east1.run.app';
// LINE 官方帳號「重返職場課程小幫手」(@448zgoco) 的 LIFF（LINE Login channel 2012611129，Full 大小）

<!--
  台中 LINE 報名：第一階段報名資料（2026-11-14，場「台中｜LINE 進來就填表」；規格 docs/規格_現場報名雲端版.md 第 15 節）
  - 學員從 LINE 官方帳號的歡迎訊息按鈕或圖文選單打開（LIFF），全程在 LINE 裡；不在 LINE 裡（電腦瀏覽器）也能填（練習畫面）
  - 一題一畫面、大字（DESIGN.md「學員手機表單」）；前面都用點的，姓名、手機、Email 放最後；只有姓名、手機必填
  - 中途關掉再打開接著填（存在她手機的 localStorage）；送出後替她在聊天室傳一則「我填好報名資料了」（失敗略過、不擋）
  - 外部資源只有 LINE 官方 LIFF SDK（https://static.line-scdn.net/liff/edge/2/sdk.js）：DESIGN.md「不載任何外部資源」的必要例外
    （拿 LINE 帳號、傳訊息、關視窗都要它）。本機練習（localhost）不載；載不到照樣能填、能送，只是沒有 LINE 帳號連結
  - 題目、選項集中在下面 QS（第 ③④ 題是草稿，Tomi 看練習畫面後會改）；沿用的題目字、選項、out 照 ../index.html 同 id 那題
-->
<style>
:root{
  --ink:#111111;--ink2:#2b2b2b;--line:#595959;--bg:#ffffff;--soft:#efefec;
  --pri:#0b4f9c;--pri-dk:#083b75;--pri-bg:#e3edfa;
  --err:#a00000;--err-bg:#fff0f0;--warn:#7a4a00;--warn-bg:#fff4d8;--ok:#1b6a2e;--ok-bg:#ecf7ee;
  color-scheme:light
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Heiti TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:22px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
button,input,textarea{font:inherit;color:inherit;margin:0}
button{-webkit-appearance:none;appearance:none;cursor:pointer;touch-action:manipulation}
h1{font-size:32px;line-height:1.35;font-weight:800;margin:32px 0 20px}
.lead{font-size:24px;margin:0 0 14px}
.hint{font-size:22px;color:var(--ink2);margin:0 0 8px}
.tm{margin:12px 0 0;padding:8px 12px;border:3px dashed var(--ink2);border-radius:12px;background:var(--warn-bg);font-size:20px;font-weight:800;text-align:center}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 0 8px}
.back{min-height:64px;padding:8px 18px 8px 12px;border:3px solid var(--ink2);border-radius:14px;background:#fff;color:var(--ink);font-size:22px;font-weight:700}
.back:active{background:var(--soft)}
.count{font-size:22px;font-weight:800;padding:6px 0 6px 12px}
.bar{height:14px;border:2px solid var(--ink2);border-radius:8px;background:#fff;overflow:hidden}
.bar span{display:block;height:100%;background:var(--pri)}
.qt{font-size:30px;line-height:1.35;font-weight:800;margin:24px 0 10px}
.qt:focus{outline:none}
.opts{margin:6px 0 0}
.opt{display:flex;align-items:center;width:100%;min-height:72px;margin:0 0 14px;padding:12px 16px;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:24px;font-weight:600;line-height:1.35;text-align:left}
.opt:active{background:var(--soft)}
.mark{flex:none;display:flex;align-items:center;justify-content:center;width:38px;height:38px;margin-right:14px;border:3px solid var(--ink2);border-radius:50%;background:#fff}
.multi .mark{border-radius:8px}
.mark svg{width:26px;height:26px;visibility:hidden}
.opt[aria-checked="true"]{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri);background:var(--pri-bg)}
.opt[aria-checked="true"] .mark{background:var(--pri);border-color:var(--pri)}
.opt[aria-checked="true"] .mark svg{visibility:visible}
.opt .t{flex:1;min-width:0}
.note{display:inline-block;font-size:22px;font-weight:400;color:var(--ink2)}
.flabel{display:block;font-size:22px;font-weight:800;margin:8px 0}
.field{display:block;width:100%;min-height:72px;padding:14px 16px;border:3px solid var(--ink2);border-radius:14px;background:#fff;color:var(--ink);font-size:26px;line-height:1.4;-webkit-appearance:none;appearance:none}
textarea.field{min-height:150px;resize:vertical}
.field:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri)}
.follow{margin:0 0 6px}
.box{margin:14px 0;padding:14px 16px;border:3px solid;border-radius:14px;font-size:22px;font-weight:700;line-height:1.5}
.box p{margin:0}
.box p+p{margin-top:8px}
.err{border-color:var(--err);background:var(--err-bg);color:var(--err)}
.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
.btn{display:block;width:100%;min-height:72px;margin:20px 0 0;padding:14px 18px;border:3px solid var(--pri);border-radius:14px;background:var(--pri);color:#fff;font-size:26px;font-weight:800;line-height:1.3;text-align:center}
.btn:active{background:var(--pri-dk)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn2{background:#fff;color:var(--pri-dk)}
.btn2:active{background:var(--pri-bg)}
.btn[aria-disabled="true"]{background:#e6e6e6;border-color:#7a7a7a;border-style:dashed;color:#333}
.linkbtn{display:block;width:100%;min-height:56px;margin:12px 0 0;padding:8px 16px;border:0;background:none;color:var(--ink2);font-size:22px;text-decoration:underline}
.center{text-align:center}
.big{font-size:30px;font-weight:800;margin:40px 0 12px}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<script>
(function () {
  'use strict';
  var STORE_KEY = 'gov_subsidy.taichung_line_form.v1';
  var HEADER = '【台中 LINE 第一階段報名資料】';   // 資料表第一行（雲端 台中LINE.表頭 一樣）
  var EMPTY = '（未填）';
  var GUARD_MS = 400;    // 換畫面後這段時間內的點擊不算（防連點點到下一題）
  var WAIT_MS = 30000;   // 送出最多等多久
  var API = typeof SERVICE_URL === 'string' ? SERVICE_URL.trim().replace(/\/+$/, '') : '';
  var LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  var CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 12.5l5 5L19.5 7" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // ---------- 題目（要改題目、選項改這裡） ----------
  // out＝資料表的標籤（沿用的照 ../index.html 同 id 那題，不改字）；選項 t＝畫面上的字、n＝括號補充（不輸出）、o＝輸出用字（沒寫用 t）、
  // ex＝選了就清掉其他選項、f＝選了要接著寫；max＝最多選幾個；req＝必填（只有姓名、手機）
  function other() { return { t: '其他', f: true }; }
  var QS = [
    { id: 'edu', type: 'single', out: '最高學歷',
      title: '你讀到哪裡畢業？', opts: ['國小', '國中', '高中職', '專科', '大學', '碩士以上'] },
    { id: 'skill', type: 'multi', out: '專長',
      title: '你有哪些專長？', opts: ['電腦文書', { t: '煮菜', o: '烹飪' }, '照顧小孩或長輩', '銷售服務', '手工藝', '記帳會計', '美容美髮', '開車', '外語', other()] },
    // ③ 新題（調理課版，草稿）：out 跟報名網頁「想上課的原因」一樣，之後才能放進同一種資料表
    { id: 'why', type: 'multi', out: '想上課的原因',
      title: '為什麼想上這堂課？', opts: ['照顧自己和家人的健康', '學一技之長', { t: '準備回去工作', o: '準備再就業' },
        { t: '精進原本的技能', n: '美容、按摩、照顧', o: '精進原有技能' }, '對保健調理有興趣', other()] },
    // ④ 新題（草稿）：out 用報名網頁「想做的工作」，最多選 2 個
    { id: 'wantJob', type: 'multi', max: 2, out: '想做的工作',
      title: '學完想怎麼用這個技能？', hint: '最多選 2 個', opts: [{ t: '到店裡做調理工作', o: '保健調理人員' },
        { t: '自己接案或開工作室', o: '自行接案' }, { t: '加進原本的工作', n: '美容、美髮、照顧', o: '結合原有工作' }, other()] },
    { id: 'startWhen', type: 'single', out: '多久開始上班',
      title: '上完課，希望多久開始上班？', opts: ['1 個月內', '3 個月內', '6 個月內'] },
    { id: 'hours', type: 'multi', out: '上班時間',
      title: '可以接受哪種上班時間？', opts: ['白天', '週休二日', '排班', '輪班', '兼職', { t: '時間彈性', o: '彈性' }] },
    { id: 'commute', type: 'single', out: '通勤時間',
      title: '去上班，路上最多能花多久？', opts: ['30 分鐘內', '1 小時內', other()] },
    { id: 'transport', type: 'multi', out: '交通方式',
      title: '平常出門用什麼交通工具？', opts: ['機車', '汽車', '公車或捷運', '家人接送', '走路', other()] },
    { id: 'classDay', type: 'multi', out: '上課那天家裡',
      title: '上課那天，家裡怎麼安排？', opts: ['家人支持', '時間可以自己安排', '有人幫忙照顧'] },
    { id: 'care', type: 'multi', out: '上班後家裡',
      title: '開始上班後，家裡誰照顧？', opts: [{ t: '不需要照顧家人', ex: true }, '家人可以幫忙', '安親班或日照中心', '上班時間可以配合'] },
    { id: 'study', type: 'multi', out: '最近上課自學',
      title: '最近有上課或自學嗎？', opts: [{ t: '沒有', ex: true }, '社區大學', '就業中心的課', '線上課程', '看 YouTube 自學', '看書', other()] },
    { id: 'jobSearch', type: 'single', out: '最近找工作',
      title: '最近有在找工作嗎？', opts: ['沒有', '有看職缺', '有投履歷', '有請親友幫忙問'] },
    { id: 'channel', type: 'multi', out: '找工作管道',
      title: '打算怎麼找工作？', opts: ['就業服務站', { t: '人力銀行', n: '104、1111' }, '親友介紹', '社群或 LINE', other()] },
    { id: 'hardest', type: 'multi', out: '最大困難',
      title: '回去上班，最大的困難是？', opts: ['年齡', '太久沒工作', '手機電腦不熟', '缺乏新技能', '要照顧家人', '交通不方便', '不知道自己適合什麼工作', other()] },
    // 下面三題 11/14 Tomi 加（省打電話的時間）：照 ../index.html 原題；best 的提示把給現場人員的「請她」拿掉（這裡是她自己填）
    { id: 'best', type: 'text', lines: true, out: '最拿手的事',
      title: '以前工作，最拿手、最常被稱讚的一件事？', hint: '用自己的話說一句，例如：記得熟客愛吃什麼' },
    { id: 'place', type: 'text', out: '希望上班地點', title: '希望在哪裡上班？', hint: '例如：北屯區、住家附近' },
    { id: 'note', type: 'text', lines: true, out: '其他補充', title: '還有什麼想補充的嗎？', hint: '沒有的話可以不填' },
    { id: 'name', type: 'text', req: true, out: '姓名', title: '你的全名' },   // 11/14 Tomi：不寫「跟身分證上的名字一樣」（像在蒐集個資）
    { id: 'phone', type: 'text', req: true, tel: true, out: '手機', title: '你的手機號碼', hint: '10 個數字，09 開頭' },
    // Email（11/14 Tomi 加）：原題的字和提示，這裡不必填
    { id: 'email', type: 'text', req: true, email: true, out: 'Email', title: '你的 Email 信箱', hint: '申請表必填。看手機上登入的 Email；真的沒有，填家人的。' }
    // 「方便接電話的時段」11/14 Tomi 拿掉：他直接打電話確認，不看時段（雲端照收空的時段）
  ];
  QS.forEach(function (q) { if (q.opts) q.opts = q.opts.map(function (o) { return typeof o === 'string' ? { t: o } : o; }); });
  var TOTAL = QS.length;

  // ---------- 狀態（存在這支手機） ----------
  // pos：'start'、題號（0 起算）、'done'；a：答案（單選 t、多選 [t…]、打字）；f：「其他」寫的字
  var state = load();
  var err = '', sending = false, shownAt = 0;
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (s && typeof s === 'object' && s.a && s.f) return s;
    } catch (e) { /* 壞掉、不給用：重新開始 */ }
    return { pos: 'start', a: {}, f: {} };
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* 私密模式：照樣能填完 */ } }

  // ---------- LIFF（只在正式網址載；載不到照樣能填） ----------
  var liffReady = new Promise(function (resolve) {
    if (LOCAL || !API || !LIFF_ID) { resolve(false); return; }
    var timer = setTimeout(function () { resolve(false); }, 10000);
    var s = document.createElement('script');
    s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
    s.charset = 'utf-8';
    s.onload = function () {
      try {
        window.liff.init({ liffId: LIFF_ID }).then(function () { clearTimeout(timer); resolve(true); },
          function () { clearTimeout(timer); resolve(false); });
      } catch (e) { clearTimeout(timer); resolve(false); }
    };
    s.onerror = function () { clearTimeout(timer); resolve(false); };
    document.head.appendChild(s);
  });
  function inLine() { try { return !!(window.liff && window.liff.isInClient()); } catch (e) { return false; } }
  function idToken(ok) {   // 第一次的「許可」畫面按取消、在外面的瀏覽器沒登入 → 沒有，照樣送
    try { return ok && window.liff.isLoggedIn() ? window.liff.getIDToken() || '' : ''; } catch (e) { return ''; }
  }

  // ---------- 小工具 ----------
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function outT(o) { return o.o || o.t; }
  function sel(q) { var v = state.a[q.id]; return q.type === 'multi' ? (Array.isArray(v) ? v : []) : (v || ''); }
  function isSel(q, o) { var v = sel(q); return q.type === 'multi' ? v.indexOf(o.t) >= 0 : v === o.t; }
  function hasOther(q) { return q.opts && q.opts.some(function (o) { return o.f && isSel(q, o); }); }
  function phoneDigits(s) { return String(s || '').replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/\D/g, ''); }
  // 打字題寫進資料表的樣子（同 ../index.html 的 textOf：換行、連續空白變一個空白；手機只留數字；Email 拿掉空白）
  function textVal(q) {
    var v = String(state.a[q.id] || '');
    if (q.tel) return phoneDigits(v);
    if (q.email) return v.replace(/[\s\u3000]+/g, '');
    return v.replace(/[\r\n\u2028\u2029]+/g, ' ').replace(/[ \t\u3000]+/g, ' ').trim();
  }
  function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function outValue(q) {
    if (q.type === 'text') return textVal(q) || EMPTY;
    var parts = [];
    q.opts.forEach(function (o) {
      if (!isSel(q, o)) return;
      // 多選用「、」分隔，所以「其他」說明裡的「、」換成「，」（同 ../index.html）
      parts.push(o.f ? outT(o) + '（' + (String(state.f[q.id] || '').trim().replace(/、/g, '，') || '未填') + '）' : outT(o));
    });
    return parts.length ? parts.join('、') : EMPTY;
  }
  function buildText() {
    var lines = [HEADER, '填寫日期：' + today()];
    QS.forEach(function (q) { lines.push(q.out + '：' + outValue(q)); });
    return lines.join('\n');
  }
  function rawAnswers() {   // 原始答案（後台、之後轉正式報名用）：題目 id → 選的字；「其他」寫的字放 <id>Other
    var r = {};
    QS.forEach(function (q) {
      var v = sel(q);
      if (q.type === 'text') { v = textVal(q).slice(0, 400); if (v) r[q.id] = v; return; }
      if (v.length) r[q.id] = v;
      if (hasOther(q) && String(state.f[q.id] || '').trim()) r[q.id + 'Other'] = String(state.f[q.id]).trim().slice(0, 200);
    });
    return r;
  }

  // ---------- 畫面 ----------
  var app = document.getElementById('app');
  function banner() {
    if (!API) return '<p class="tm">測試模式：資料不會送出</p>';
    return LOCAL ? '<p class="tm">練習畫面：資料只送到這台電腦的練習後台</p>' : '';
  }
  function render(focus) {
    shownAt = Date.now();
    var p = state.pos, h;
    if (p === 'start') h = startHTML();
    else if (p === 'done') h = doneHTML();
    else h = questionHTML(QS[p]);
    app.innerHTML = banner() + h;
    if (focus !== false) {
      var t = app.querySelector('.qt, h1, .big');
      if (t) { t.setAttribute('tabindex', '-1'); t.focus({ preventScroll: true }); }
      window.scrollTo(0, 0);
    }
  }
  function startHTML() {
    var started = Object.keys(state.a).length > 0;
    return '<h1>報名資料</h1>' +
      '<p class="lead">麻煩填寫這份表單，填完之後我們會跟你聯繫、確認補助資格，大約 5 分鐘。</p>' +
      '<button type="button" class="btn" data-act="go">' + (started ? '接著填' : '開始填寫') + '</button>';
  }
  function questionHTML(q) {
    var i = QS.indexOf(q), last = i === TOTAL - 1;
    var h = '<div class="top"><button type="button" class="back" data-act="back">‹ 上一題</button>' +
      '<span class="count">第 ' + (i + 1) + ' 題／共 ' + TOTAL + ' 題</span></div>' +
      '<div class="bar" aria-hidden="true"><span style="width:' + Math.round(i / TOTAL * 100) + '%"></span></div>' +
      '<h2 class="qt">' + esc(q.title) + '</h2>' + (q.hint ? '<p class="hint">' + esc(q.hint) + '</p>' : '');
    if (q.type === 'text') {
      h += '<label class="flabel sr" for="txt">' + esc(q.title) + '</label>' + (q.lines
        ? '<textarea class="field" id="txt" rows="4" maxlength="400">' + esc(state.a[q.id] || '') + '</textarea>'
        : '<input class="field" id="txt" ' + (q.tel ? 'type="tel" inputmode="tel" autocomplete="tel" maxlength="20"'
          : q.email ? 'type="email" inputmode="email" autocomplete="email" autocapitalize="off" maxlength="100"'
          : q.id === 'name' ? 'type="text" autocomplete="name" maxlength="50"' : 'type="text" maxlength="100"') +
        ' value="' + esc(state.a[q.id] || '') + '">');
    } else {
      h += '<div class="opts ' + q.type + '" role="' + (q.type === 'single' ? 'radiogroup' : 'group') + '" aria-label="' + esc(q.title) + '">';
      q.opts.forEach(function (o, k) {
        h += '<button type="button" class="opt" role="' + (q.type === 'single' ? 'radio' : 'checkbox') + '" aria-checked="' + isSel(q, o) + '" data-opt="' + k + '">' +
          '<span class="mark">' + CHECK + '</span><span class="t">' + esc(o.t) + (o.n ? ' <span class="note">（' + esc(o.n) + '）</span>' : '') + '</span></button>';
      });
      h += '</div>';
      if (hasOther(q)) h += '<div class="follow"><label class="flabel" for="oth">請寫一下是什麼</label><input class="field" id="oth" type="text" maxlength="100" value="' + esc(state.f[q.id] || '') + '"></div>';
    }
    if (err) h += '<div class="box err" role="alert"><p>' + esc(err) + '</p></div>';
    var answered = q.type === 'text' ? !!String(state.a[q.id] || '').trim() : sel(q).length > 0;
    if (last) h += '<button type="button" class="btn" data-act="send"' + (sending ? ' aria-disabled="true"' : '') + '>' + (sending ? '正在送出，請稍等…' : '送出') + '</button>';
    else if (q.type === 'text') h += '<button type="button" class="btn' + (q.req || answered ? '' : ' btn2') + '" data-act="next" id="nextBtn">' + (q.req || answered ? '下一題' : '跳過') + '</button>';   // 打字題：必填寫「下一題」；不必填的空著寫「跳過」，打了字由 input 事件改成「下一題」（11/14 Tomi）
    else if (q.type !== 'single' || answered) h += '<button type="button" class="btn' + (answered ? '' : ' btn2') + '" data-act="next">' + (answered ? '下一題' : '跳過這題') + '</button>';
    else h += '<button type="button" class="linkbtn" data-act="next">跳過這題</button>';
    return h;
  }
  function doneHTML() {
    return '<div class="center"><p class="big">收到了！</p>' +
      '<p class="lead">謝謝你，' + esc(String(state.a.name || '').trim()) + '。<br>我們會打電話跟你聯繫，確認補助資格。</p></div>' +
      (inLine() ? '<button type="button" class="btn" data-act="close">回到聊天室</button>' : '<p class="hint center">可以關掉這個畫面了。</p>') +
      '<button type="button" class="linkbtn" data-act="redo">重新填一次</button>';
  }

  // ---------- 動作 ----------
  function go(pos) { err = ''; state.pos = pos; save(); render(); }
  function keepTyping() {   // 打字題、「其他」的字：每打一個字就存
    var t = document.getElementById('txt'), o = document.getElementById('oth'), q = QS[state.pos];
    if (t && q) state.a[q.id] = t.value;
    if (o && q) state.f[q.id] = o.value;
  }
  function checkText(q) {
    var v = String(state.a[q.id] || '').trim();
    if (q.id === 'name') return v ? '' : '請寫你的姓名';
    if (q.id === 'phone') return /^09\d{8}$/.test(phoneDigits(v)) ? '' : '手機號碼要 09 開頭、10 個數字，請再看一下';
    if (q.id === 'email') return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? '' : (v ? 'Email 好像少了什麼，請再看一下（要有 @）' : '請寫 Email（申請書一定要有）');   // 11/14 Tomi：Email 必填
    return '';
  }
  function next() {
    var q = QS[state.pos];
    keepTyping();
    if (q.type === 'text' && q.req) { err = checkText(q); if (err) { render(false); focusField(); return; } }
    go(state.pos + 1);
  }
  function focusField() { var f = document.getElementById('txt'); if (f) f.focus(); }
  function pick(q, k) {
    var o = q.opts[k];
    err = '';
    if (q.type === 'single') {
      state.a[q.id] = o.t; save();
      if (o.f) { render(false); var oth = document.getElementById('oth'); if (oth) oth.focus(); return; }   // 其他：寫完按下一題
      render(false);
      setTimeout(function () { if (QS[state.pos] === q) go(state.pos + 1); }, 250);   // 點了自動下一題（先讓她看到勾起來）
      return;
    }
    var v = sel(q).slice(), at = v.indexOf(o.t);
    if (at >= 0) v.splice(at, 1);
    else if (o.ex) v = [o.t];
    else {
      v = v.filter(function (t) { return !q.opts.some(function (x) { return x.ex && x.t === t; }); });
      if (q.max && v.length >= q.max) { err = '最多選 ' + q.max + ' 個，先把一個取消再選'; render(false); return; }
      v.push(o.t);
    }
    state.a[q.id] = v; save(); render(false);
  }
  function send() {
    if (sending) return;
    keepTyping();
    var miss = ['name', 'phone', 'email'].map(function (id) { return QS.filter(function (q) { return q.id === id; })[0]; })
      .filter(function (q) { return checkText(q); })[0];
    if (miss) { state.pos = QS.indexOf(miss); err = checkText(miss); save(); render(); focusField(); return; }
    sending = true; err = ''; render(false);
    var body = { '姓名': String(state.a.name).trim(), '手機': phoneDigits(state.a.phone), '時段': [],
      '資料表': buildText(), '答案': rawAnswers() };
    liffReady.then(function (ok) {
      var token = idToken(ok);
      if (token) body.idToken = token;
      if (!API) { console.log('測試模式：要送的資料', body); return { ok: true }; }   // eslint-disable-line no-console
      var ctl = typeof AbortController === 'function' ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctl) ctl.abort(); }, WAIT_MS);
      return fetch(API + '/api/line/lead', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
        signal: ctl ? ctl.signal : undefined })
        .then(function (r) { return r.json().catch(function () { return { ok: false }; }); })
        .finally(function () { clearTimeout(timer); });
    }).then(function (res) {
      sending = false;
      if (!res || !res.ok) { err = (res && res['錯誤']) || '現在送不出去，請再按一次「送出」'; render(false); return; }
      tellChat(body['姓名'], body['手機']);
      state.pos = 'done'; save(); render();
    }, function () {
      sending = false; err = '網路好像斷了，請再按一次「送出」'; render(false);
    });
  }
  function tellChat(name, phone) {   // 替她在聊天室傳一則：沒權限、不在 LINE 裡、失敗都略過
    try {
      if (inLine()) window.liff.sendMessages([{ type: 'text', text: '我填好報名資料了' }, { type: 'text', text: name + ' ' + phone }]).catch(function () {});
    } catch (e) { /* 略過 */ }
  }

  app.addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b || Date.now() - shownAt < GUARD_MS) return;
    var act = b.getAttribute('data-act'), k = b.getAttribute('data-opt');
    if (k !== null && typeof state.pos === 'number') { keepTyping(); pick(QS[state.pos], +k); return; }
    if (act === 'go') go(0);
    else if (act === 'back') { keepTyping(); go(state.pos === 0 ? 'start' : state.pos - 1); }
    else if (act === 'next') next();
    else if (act === 'send') send();
    else if (act === 'redo') { state.a = {}; state.f = {}; go('start'); }   // 11/14 Tomi：重新填一次＝從頭開始、答案清空（雲端照舊更新同一筆）
    else if (act === 'close') { try { window.liff.closeWindow(); } catch (e) { /* 略過 */ } }
  });
  app.addEventListener('input', function () {
    keepTyping(); save();
    var q = QS[state.pos], b = document.getElementById('nextBtn');   // 不必填的打字題：空著＝「跳過」、打了字＝「下一題」（不重畫，免得打字中斷）
    if (b && q && q.type === 'text' && !q.req) { var has = !!String(state.a[q.id] || '').trim(); b.textContent = has ? '下一題' : '跳過'; b.classList.toggle('btn2', !has); }
  });
  app.addEventListener('keydown', function (ev) {   // 打字題按 Enter＝下一題（最後一題沒有打字題）
    if (ev.key === 'Enter' && ev.target.id === 'txt' && ev.target.tagName === 'INPUT') { ev.preventDefault(); if (state.pos === TOTAL - 1) send(); else next(); }
  });
  if (typeof state.pos === 'number' && !(state.pos >= 0 && state.pos < TOTAL)) state.pos = 'start';
  render();
  // 完成頁一打開就畫了，那時 LINE 還沒準備好（認不出在 LINE 裡）→ 準備好再畫一次，才會出現「回到聊天室」（11/14 Tomi 手機截圖）
  liffReady.then(function (ok) { if (ok && state.pos === 'done') render(); });
  // 先叫醒雲端（11/14 Tomi 實測送出等了十幾秒：雲端閒置會睡著，第一個請求要等它開機約 10 秒）。打開表單就先敲一下，
  // 她填題目的這幾分鐘雲端就醒了，送出時不用再等開機。no-cors：只要請求到得了雲端就好，不讀回應。
  if (API && !LOCAL) { try { fetch(API + '/health', { mode: 'no-cors', cache: 'no-store' }).catch(function () {}); } catch (e) { /* 略過 */ } }
})();
</script>
</body>
</html>
