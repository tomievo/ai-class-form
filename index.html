<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no, email=no, address=no">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="重返職場 AI 入門班｜報名資料表">
<meta property="og:description" content="現場報名：拍身分證、填資料、上傳勞保，當場產出申請文件。">
<link rel="icon" href="data:,">
<title>重返職場 AI 入門班｜報名資料表</title>
<script>
// 雲端服務網址（Google Cloud Run 部署後拿到的網址，例 https://gov-subsidy-xxxxxxxxxx.asia-east1.run.app，結尾不要加斜線）。
// 留空字串＝測試模式：不連網、資料不會送出（梯次用範例；按「送出，讀取資料」只在 console 印出要送的資料）。
// 本機測試：開 測試資料/假雲端服務.py，複製一份這個檔到暫存區、把複本的網址改成 'http://127.0.0.1:8767'；正本一律保持下面的正式網址
var SERVICE_URL = 'https://gov-subsidy-450277428146.asia-east1.run.app';
// 現場通關碼：true＝第一次在這台電腦打開要輸入一次（記在這台電腦），每個請求帶 X-Store-Code 標頭；
// false＝不問、不帶（雲端服務那邊的檢查也要一起拿掉）
var 需要通關碼 = true;
</script>
<!--
  現場報名網頁 v4（店裡的電腦接印表機；現場人員帶學員從頭做到尾。平板、手機也能用）
  - 不載任何外部資源：只用系統字型，CSS／JS 全部在這個檔案裡
  - 流程＝docs/規格_現場報名雲端版.md 第 0 節；API＝第 2 節；資料格式＝第 3 節
  - 資料表文字＝docs/規格_小幫手資料格式.md 第 1 節（v3 原樣）；改題目或標籤要同步改規格
  - 答案、讀取結果、核對時改的地方存在這台電腦（localStorage）；身分證照片、勞保檔、申請文件 PDF 存在 IndexedDB。
    重新整理可以接著做；按「下一位學員」「今天印不了，先換下一位」或「重新填寫」才清掉（現場通關碼留著）
  - 列印站（網址加 #列印站，店裡接印表機的電腦設成書籤）：學員在自己手機上產好文件，現場人員在這裡點她的名字列印。
    手機、平板的列印頁會叫她去列印站；列印站拿到的 PDF 只放在記憶體，不存進這台電腦
-->
<style>
:root{
  --ink:#111111;--ink2:#2b2b2b;--line:#595959;--bg:#ffffff;--soft:#efefec;
  --pri:#0b4f9c;--pri-dk:#083b75;--pri-bg:#e3edfa;
  --err:#a00000;--err-bg:#fff0f0;--warn:#7a4a00;--warn-bg:#fff4d8;--ok:#1b6a2e;--ok-bg:#ecf7ee;
  color-scheme:light
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Heiti TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:22px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
.wrap.wide{max-width:820px}
button,input,textarea{font:inherit;color:inherit;margin:0}
button{-webkit-appearance:none;appearance:none;cursor:pointer;touch-action:manipulation}
h1{font-size:32px;line-height:1.35;font-weight:800;margin:32px 0 20px}
.nw{white-space:nowrap}
.lead{font-size:24px;margin:0 0 14px}
.hint{font-size:22px;color:var(--ink2);margin:0 0 8px}
.how{font-size:22px;font-weight:700;color:var(--pri-dk);margin:0 0 14px}
.tm{margin:12px 0 0;padding:8px 12px;border:3px dashed var(--ink2);border-radius:12px;background:var(--warn-bg);font-size:20px;font-weight:800;text-align:center}

/* 上方：上一題＋第幾題 */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 0 8px}
.back{min-height:64px;padding:8px 18px 8px 12px;border:3px solid var(--ink2);border-radius:14px;background:#fff;color:var(--ink);font-size:22px;font-weight:700}
.back:active{background:var(--soft)}
.count{font-size:22px;font-weight:800;padding:6px 0 6px 12px}
.bar{height:14px;border:2px solid var(--ink2);border-radius:8px;background:#fff;overflow:hidden}
.bar span{display:block;height:100%;background:var(--pri)}

/* 題目與選項 */
.qt{font-size:30px;line-height:1.35;font-weight:800;margin:24px 0 10px}
.qt:focus{outline:none}
.opts{margin:6px 0 0}
.opt{display:flex;align-items:center;width:100%;min-height:72px;margin:0 0 14px;padding:12px 16px;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:24px;font-weight:600;line-height:1.35;text-align:left}
.opt:active{background:var(--soft)}
.mark{flex:none;display:flex;align-items:center;justify-content:center;width:38px;height:38px;margin-right:14px;border:3px solid var(--ink2);border-radius:50%;background:#fff}
.multi .mark,.chk .mark{border-radius:8px}
.mark svg{width:26px;height:26px;visibility:hidden}
.opt[aria-checked="true"]{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri);background:var(--pri-bg)}
.opt[aria-checked="true"] .mark{background:var(--pri);border-color:var(--pri)}
.opt[aria-checked="true"] .mark svg{visibility:visible}
.opt .t{flex:1;min-width:0}
.note{display:inline-block;font-size:22px;font-weight:400;color:var(--ink2)}
.sub2{display:block;margin-top:4px;font-size:20px;font-weight:600;color:var(--ink2)}

/* 梯次：一梯一個大按鈕；不能選的（已寄出、額滿、已截止）灰底虛線框＋寫原因 */
.bt .t{display:block}
.b1{display:block;font-size:26px;font-weight:800}
.b2{display:block;font-size:22px;font-weight:600}
.b3{display:block;margin-top:4px;font-size:22px;font-weight:800}
.opt:disabled{border-style:dashed;border-color:#7a7a7a;background:#e6e6e6;color:#333;-webkit-text-fill-color:#333;opacity:1;cursor:not-allowed}
.opt:disabled .mark{border-color:#7a7a7a;background:#e6e6e6}
/* 梯次照開課日排、同一個月一段：段落上面一行月份（大字、粗底線，跟核對頁的段落標題同一種） */
.mon{font-size:26px;font-weight:800;margin:30px 0 12px;padding-bottom:6px;border-bottom:3px solid var(--ink2)}
.mon:first-child{margin-top:8px}
/* 梯次名稱、上課時間各自一塊：放不下就整塊換到下一行，不在「115/11/24」「（二）」或「09:00–」後面拆開（一塊比一行還長才在塊裡面換行，不會超出按鈕） */
.b1>span{display:inline-block}
@media (max-width:340px){.b1{font-size:24px}}   /* 320 寬：26px 的「115/11/24（二）」差 1px 放不下一行 */

/* 輸入框 */
.flabel{display:block;font-size:22px;font-weight:800;margin:8px 0}
.field{display:block;width:100%;min-height:72px;padding:14px 16px;border:3px solid var(--ink2);border-radius:14px;background:#fff;color:var(--ink);font-size:26px;line-height:1.4;-webkit-appearance:none;appearance:none}
textarea.field{min-height:150px;resize:vertical}
.field:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri)}
.follow{margin:0 0 6px}
.code{font-size:36px;letter-spacing:.3em}

/* 提醒框（有粗框和文字，不只靠顏色） */
.box{margin:14px 0;padding:14px 16px;border:3px solid;border-radius:14px;font-size:22px;font-weight:700;line-height:1.5}
.box p{margin:0}
.box p+p,.box ul+p,.box p+ul{margin-top:8px}
.box ul{margin:0;padding-left:1.3em}
.box li{margin:4px 0}
.err{border-color:var(--err);background:var(--err-bg);color:var(--err)}
.warn{border-color:var(--warn);background:var(--warn-bg);color:var(--ink)}
.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}

/* 按鈕 */
.btn{display:block;width:100%;min-height:72px;margin:20px 0 0;padding:14px 18px;border:3px solid var(--pri);border-radius:14px;background:var(--pri);color:#fff;font-size:26px;font-weight:800;line-height:1.3;text-align:center;text-decoration:none}
.btn:active{background:var(--pri-dk)}
.btn2{background:#fff;color:var(--pri-dk)}
.btn2:active{background:var(--pri-bg)}
.btn-danger{background:#fff;border-color:var(--err);color:var(--err)}
.btn-danger:active{background:var(--err-bg)}
.btn[aria-disabled="true"]{background:#e6e6e6;border-color:#7a7a7a;border-style:dashed;color:#333}
/* 錯誤框裡有「再試一次」時，下面同一個動作的大按鈕先藏起來，畫面只留一顆 */
#msg:has([data-act="retry"]) ~ #send,#msg:has([data-act="retry"]) ~ [data-act="gen"]{display:none}
.foot{margin:40px 0 0;text-align:center}
.linkbtn{min-height:56px;padding:8px 16px;border:0;background:none;color:var(--ink2);font-size:22px;text-decoration:underline}

/* 拍照、上傳：input 藏起來，按大按鈕樣式的 label 打開相機或選檔 */
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
label.btn,.alt{cursor:pointer;-webkit-user-select:none;user-select:none}
.vh:focus-visible+label{outline:4px solid var(--pri-dk);outline-offset:3px}
.alt{display:block;width:100%;min-height:56px;margin:12px 0 0;padding:12px 8px;border:0;background:none;color:var(--pri-dk);font-size:22px;font-weight:700;text-align:center;text-decoration:underline}
.thumb{display:block;max-width:100%;max-height:45vh;margin:14px auto;border:3px solid var(--ink2);border-radius:14px}
.flist{list-style:none;margin:8px 0 0;padding:0}
.fitem{display:flex;align-items:center;gap:12px;min-height:76px;margin:0 0 12px;padding:6px 8px 6px 10px;border:3px solid var(--line);border-radius:14px}
.fthumb,.fpdf{flex:none;width:64px;height:64px;border:2px solid var(--ink2);border-radius:8px}
.fthumb{object-fit:cover}
.fpdf{display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.fname{flex:1;min-width:0;font-size:22px;font-weight:600;overflow-wrap:anywhere}

/* 確認頁：一題一列，旁邊「改」 */
.list{list-style:none;margin:8px 0 0;padding:0;border-top:2px solid #b5b5b5}
.item{display:flex;align-items:flex-start;padding:14px 0;border-bottom:2px solid #b5b5b5}
.item .txt{flex:1;min-width:0}
.k{font-size:20px;font-weight:700;color:var(--ink2)}
.v{font-size:24px;font-weight:600;overflow-wrap:anywhere}
.edit{flex:none;min-width:80px;min-height:64px;margin-left:12px;padding:0 12px;border:3px solid var(--pri);border-radius:12px;background:#fff;color:var(--pri-dk);font-size:24px;font-weight:800}
.edit:active{background:var(--pri-bg)}
.del{border-color:var(--err);color:var(--err)}
.del:active{background:var(--err-bg)}
.mini{display:inline-block;max-width:46%;max-height:120px;margin:6px 8px 0 0;border:2px solid var(--ink2);border-radius:8px;vertical-align:top}
.chk{margin-top:24px}

/* 等候 */
.spin{width:72px;height:72px;margin:24px auto;border:8px solid var(--pri-bg);border-top-color:var(--pri);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:4s}}

/* 核對頁（現場人員用：比學員畫面密一點，字還是大） */
.st{font-size:26px;font-weight:800;margin:36px 0 10px;padding-bottom:6px;border-bottom:3px solid var(--ink2)}
.st2{font-size:22px;font-weight:800;margin:18px 0 4px}
.vt{font-size:28px;font-weight:800}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:12px 0;font-size:22px}
.facts dt{font-weight:800}
.facts dd{margin:0}
.card{margin:12px 0;padding:10px 14px;border:3px solid var(--line);border-radius:14px}
.card.bad{border-color:var(--err);box-shadow:0 0 0 2px var(--err)}
.ch{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:22px;font-weight:700}
.cn{font-size:24px;font-weight:800}
.tag{display:inline-block;padding:0 8px;border:2px solid;border-radius:8px;font-size:19px;font-weight:800;line-height:1.5;white-space:nowrap}
.tbad{color:var(--err);border-color:var(--err);background:var(--err-bg)}
.tok{color:var(--ok);border-color:var(--ok)}
.tuc{color:var(--warn);border-color:var(--warn);border-style:dashed;background:var(--warn-bg)}
.tchg{color:var(--pri-dk);border-color:var(--pri-dk)}
.tneed{color:var(--err);border-color:var(--err)}
.tchg,.tneed{display:none}
.chg .tchg,.need .tneed{display:inline-block}
.fl{display:grid;grid-template-columns:4.6em minmax(0,1fr);align-items:center;gap:4px 10px;margin:10px 0}
.fk{font-size:20px;font-weight:800}
.fv{font-size:22px;font-weight:600;overflow-wrap:anywhere}
.inp{display:block;width:100%;min-height:56px;padding:8px 12px;border:3px solid var(--ink2);border-radius:12px;background:#fff;color:var(--ink);font-size:22px;line-height:1.4;-webkit-appearance:none;appearance:none}
textarea.inp{resize:vertical}
.inp:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri)}
.uc .inp{border-style:dashed;border-color:var(--warn);background:var(--warn-bg)}
.need .inp{border-color:var(--err)}
.ferr .inp{border-color:var(--err);box-shadow:0 0 0 3px var(--err)}
.tags,.ftxt{grid-column:2}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.ftxt{margin:0;font-size:20px;font-weight:800;color:var(--err)}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:0 18px}
@media (min-width:600px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.idth{display:flex;gap:12px;margin:8px 0}
.idth figure{flex:1;min-width:0;margin:0}
.idth img{display:block;max-width:100%;max-height:170px;border:2px solid var(--ink2);border-radius:8px}
.idth figcaption{font-size:20px;font-weight:700}
.chain{margin:6px 0;padding-left:1.3em;font-size:22px}
.chain li{margin:6px 0}
.say{border-color:var(--pri);background:var(--pri-bg);color:var(--ink)}
.said{font-size:24px;line-height:1.6}
/* 核對頁 10/15：基本資料（不一樣的點一下）、最後一份工作、她的話、切結書會這樣勾、她看過都對 */
.brow{padding:12px 0;border-top:2px solid #b5b5b5}
.bk{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:22px;font-weight:800}
.bl{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px}
.bv{font-size:28px;font-weight:800;letter-spacing:.5px;overflow-wrap:anywhere}
.bv.ba{font-size:24px}
.qa{margin:8px 0 0;padding:10px 12px;border:3px solid var(--warn);border-radius:12px;background:var(--warn-bg);font-size:20px;font-weight:700}
.qa p{margin:0 0 8px}
.picks,.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips{margin:6px 0 10px}
.pk{min-height:56px;padding:6px 14px;border:3px solid var(--ink2);border-radius:12px;background:#fff;color:var(--ink);font-size:22px;font-weight:800;line-height:1.3;text-align:left}
.pk:active{background:var(--soft)}
.pk[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:#fff}
.pk[aria-pressed="true"]::before{content:"✓ "}
.pk .src{display:block;font-size:18px;font-weight:600}
.tq{color:var(--ink);border-color:var(--warn);background:var(--warn-bg)}
.tsys{color:var(--pri-dk);border-color:var(--pri-dk);background:var(--pri-bg)}
.jo .t{display:block}
.jn{font-size:24px;font-weight:800;overflow-wrap:anywhere}
.jd{display:block;font-size:21px;font-weight:600}
.jw{display:inline-block;margin-top:6px;padding:0 8px;border:2px solid var(--warn);border-radius:8px;background:var(--warn-bg);font-size:19px;font-weight:700}
.ins{margin:0 0 14px;padding:8px 14px;border:3px dashed var(--line);border-radius:14px;font-size:21px}
.ins ul{margin:4px 0 0;padding-left:1.3em}
.ck{list-style:none;margin:6px 0;padding:0;font-size:22px}
.ck li{position:relative;padding:6px 0 6px 42px}
.ck li::before{content:"";position:absolute;left:0;top:9px;width:28px;height:28px;border:3px solid var(--ink);border-radius:4px;background:#fff}
.ck li.y{font-weight:800}
.ck li.y::after{content:"✓";position:absolute;left:6px;top:4px;font-size:24px;font-weight:900;line-height:1.3}
.ck li.n{color:var(--ink2)}
/* 10/22 切結書照印出來的樣子：一行一行大字，下面小字寫從哪裡來 */
.ck.pv{font-size:24px;line-height:1.5}
.ck.pv li{padding:8px 0 8px 42px;border-bottom:2px solid #d6d6d6}
.ck .src{display:block;margin-top:2px;font-size:19px;font-weight:600;color:var(--ink2)}
.more{margin:16px 0;padding:0 14px;border:3px solid var(--line);border-radius:14px}
.more[open]{padding-bottom:12px}
.more>summary{display:flex;align-items:center;min-height:64px;font-size:22px;font-weight:800;cursor:pointer;list-style:none}
.more>summary::-webkit-details-marker{display:none}
.more>summary::before{content:"▸";margin-right:10px}
.more[open]>summary::before{content:"▾"}
.fw{margin:14px 0}
p.cn{margin:6px 0 2px}
.card>.st:first-child{margin-top:8px}
.seen{margin:28px 0 0;padding:14px 16px;border:5px solid var(--pri);border-radius:14px;background:#fff}
.sv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:10px 0;font-size:26px}
.sv dt{font-size:22px;font-weight:700;align-self:center}
.sv dd{margin:0;font-weight:800;overflow-wrap:anywhere}
.seen .opt{font-size:26px;font-weight:800}
.seen .vt{margin:0 0 6px}
/* 預覽沒拿到（/api/judge 失敗）：唸給她聽、切結書會這樣勾灰掉，上面寫「還沒更新，先不要唸」 */
.stale .ck,.stale .facts,.stale .say{opacity:.35;filter:grayscale(1)}
.stale #pvst,.stw{padding:6px 12px;border:3px solid var(--warn);border-radius:12px;background:var(--warn-bg);color:var(--ink);font-size:22px;font-weight:800}
.stw{margin:14px 0 0}

/* 列印頁 */
.plist{margin:6px 0;padding-left:1.4em;font-size:22px;font-weight:600}
.plist li{margin:6px 0}
.pframe{position:fixed;right:0;bottom:0;width:2px;height:2px;border:0;opacity:0;pointer-events:none}
.go{border-width:5px;border-color:var(--pri);background:var(--pri-bg);color:var(--ink);font-size:28px;font-weight:800;line-height:1.45}
.btn.sm{min-height:64px;font-size:22px}

/* 列印站（店裡的電腦）：一位一列，時間、姓名、梯次＋兩個大按鈕 */
.sbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.sbar .hint{margin:0}
.sbar .btn{width:auto;margin:0;padding:8px 28px}
.slist{list-style:none;margin:16px 0 0;padding:0}
.srow{margin:0 0 20px;padding:12px 16px 20px;border:3px solid var(--line);border-radius:14px}
.shead{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 16px;margin:0}
.stime{font-size:24px;font-weight:800}
.sname{font-size:34px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.smeta{font-size:22px;font-weight:700}
.sbtns{display:grid;grid-template-columns:minmax(0,1fr);gap:0 20px;align-items:end}
@media (min-width:700px){.sbtns{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.snote{margin:16px 0 0;font-size:20px;font-weight:800}

  function outValue(q) {

    if (q.type === 'single') {
      var o = optByT(q, state.a[q.id]);
      if (!o) return EMPTY;
      if (o.f && o.f.type === 'text') {
        var t = followText(q);
        if (o.f.raw) return t || EMPTY;                  // 通訊地址：直接寫地址
        return outT(o) + '（' + (t || '未填') + '）';    // 其他（說明）
      }
      return outT(o);
    }
    var parts = [];
    q.opts.forEach(function (o) {
      if (!isSel(q, o)) return;
      // 多選用「、」分隔，所以「其他」說明裡的「、」換成「，」
      if (o.f) parts.push(outT(o) + '（' + (followText(q).replace(/、/g, '，') || '未填') + '）');
      else parts.push(outT(o));
    });
    return parts.length ? parts.join('、') : EMPTY;
  }
  function buildText() {
    var lines = [HEADER, '填寫日期：' + today()];
    QS.forEach(function (q) {
      if (!q.out || !shown(q)) return;   // 條件題沒問的不輸出
      if (q.type === 'range') {
        var r = rangeOf(q);
        lines.push(q.out + '：' + (r[0] || EMPTY), q.out2 + '：' + (r[1] || EMPTY));
      } else lines.push(q.out + '：' + outValue(q));
    });
    if (state.noId) {   // 她不想拍身分證（10/28）：雲端看到這行就不要身分證照片，身分證照下面三行（現場照卡片打的）
      lines.push(NO_ID_LINE);
      [['身分證字號', 'idNum'], ['出生日期', 'idBirth'], ['戶籍地址', 'idAddr']].forEach(function (x) { lines.push(x[0] + '：' + (textOf(qById(x[1])) || EMPTY)); });
    }
    if (state.noLabor) lines.push(NO_LABOR_LINE);   // 最後一題之後、本人確認之前（雲端看到這行就不要勞保檔）
    lines.push('本人確認：以上都是真實狀況');
    return lines.join('\n');
  }

  // 確認頁上顯示的答案（用畫面上的白話）
  function showHTML(q) {
    if (q.type === 'photo') {
      var f = files[q.id];
      return f && f.url ? '<img class="mini" src="' + esc(f.url) + '" alt="' + esc(q.fileKind) + '的照片">' : '（還沒拍）';
    }
    if (q.type === 'docs') {
      if (state.noLabor) return esc(NO_LABOR + '（現場點選）');
      return state.docs.length ? state.docs.map(function (x, i) { return esc((i + 1) + '. ' + x.label); }).join('<br>') : '（還沒上傳）';
    }
    if (q.type === 'batch') return state.batch ? batchLines(state.batch) : '（還沒選）';
    if (q.type === 'range') { var r = rangeOf(q); return esc('從 ' + (r[0] || EMPTY) + ' 到 ' + (r[1] || EMPTY)); }
    if (q.type === 'text') return esc(textOf(q) || EMPTY);
    if (q.type === 'single') {
      var o = optByT(q, state.a[q.id]);
      if (!o) return esc(EMPTY);
      if (o.f && o.f.type === 'text') {
        var t = followText(q);
        return esc(o.f.raw ? t || EMPTY : showT(o) + '（' + (t || '未填') + '）');
      }
      return esc(o.show || showT(o));
    }
    var parts = [];
    q.opts.forEach(function (o) { if (isSel(q, o)) parts.push(o.f ? showT(o) + '（' + (followText(q) || '未填') + '）' : showT(o)); });
    return esc(parts.length ? parts.join('、') : EMPTY);
  }
  function batchLines(b) {
    return '<b>' + esc(str(b['梯次']) + ' ' + str(b['上課時間'])) + '</b><br>地點：' + esc(b['上課地點'] || '（未定）') +
      '<br>辦訓單位：' + esc(b['辦訓單位'] || '（未定）');
  }

  // 回傳錯誤訊息；沒問題回傳空字串
  function check(q) {
    if (q.type === 'photo') {
      if (working === q.id) return '照片還在處理，請等一下。';
      if (!files[q.id]) return '請按「' + (TOUCH ? '打開相機拍照' : '選擇照片檔') + '」，拍' + q.fileKind + '。';
      return '';
    }
    if (q.type === 'docs') {
      if (working === q.id) return '檔案還在處理，請等一下。';
      if (state.noLabor) return '';
      if (!state.docs.length) return '勞保資料一定要上傳。\n從來沒保過勞保、農保的，按「' + NO_LABOR + '」。';
      var total = 0;
      state.docs.forEach(function (x) { total += x.size; });
      if (total > MAX_TOTAL) return '檔案加起來太大（超過 20MB）。\n請刪掉幾個，或改用 PDF。';
      return '';
    }
    if (q.type === 'batch') {
      if (state.batch) return '';
      return batches && !openCount() ? '目前沒有開放報名的梯次。' : '請點一個梯次。';
    }
    if (q.type === 'range') {   // 兩格都要寫；日期寫法只提醒、不擋（onNext 的 rangeOdd）
      if (!clean(state.a[q.id + '_from']) || !clean(state.a[q.id + '_to'])) return '「從」「到」兩格都要寫。\n記不清楚的，寫大概的就好。';
      return '';
    }
    if (q.type === 'text') {
      var v = textOf(q);
      if (q.kind === 'tel') {
        if (!v) return '請寫你的手機號碼。';
        if (!/^09\d{8}$/.test(v)) return '號碼好像不對，請再看一下。手機號碼是 09 開頭、10 個數字。';
      } else if (q.kind === 'email') {
        if (!v) return '申請表的 Email 是必填。\n看手機上登入的 Email；真的沒有，填家人的。';
        if (!EMAIL_RE.test(v)) return 'Email 好像不完整，請再看一下。';
      } else if (q.req && !v) {
        return '這題要填喔。';
      }
      return '';
    }
    if (q.type === 'single') {
      var o = optByT(q, state.a[q.id]);
      if (!o) return '請點一個答案。';
      if (fOf(o) && o.f.req && !followText(q)) return o.f.label + '。';
    }
    return '';
  }

  // ---------- 畫面狀態 ----------
  var app = document.getElementById('app');
  var state = fresh();
  var view = 'screen';          // screen＝一般；welcome＝回來時的歡迎畫面；code＝現場通關碼；wait＝等雲端服務；station＝列印站
  var shownAt = 0, busy = false, followKey = null;
  var confirmChecked = false;
  var files = {};               // 照片、勞保檔、申請文件（記憶體一份、IndexedDB 一份）：{ blob, mime, name, url, label }
  var working = '';             // 正在處理檔案的題目 id
  var notice = '';              // 開場頁的一次性提示
  var flash = '';               // 核對頁上方的一次性提示
  var softOk = '';              // 從、到寫法看不懂時已經提醒過的那組字（同樣的字再按一次就照寫）
  var docsLost = 0, pdfLost = false, docSeq = 0;   // 重新打開時沒拿回來的勞保檔個數、申請文件
  var batches = null, batchErr = null, batchLoading = false, batchGone = '', batchSeq = 0;   // 梯次（batchErr＝沒讀到時雲端的回應）
  var waitKind = '';

  function curQ() { return view === 'screen' && state.pos >= 1 && state.pos <= N ? QS[state.pos - 1] : null; }

  // ---------- 現場通關碼（全部集中在這一段；最上面 需要通關碼 = false 就整個不用） ----------
  var CODE_ON = typeof 需要通關碼 === 'undefined' ? true : 需要通關碼 !== false;
  var CODE_KEY = 'gov_subsidy.store_code';   // 記在這台電腦；換學員不清
  var storeCode = '', codeWhy = 'first', codeBack = 'screen';   // codeWhy：first 第一次／bad 雲端服務說不對／change 自己要換

  function loadCode() { try { storeCode = str(window.localStorage.getItem(CODE_KEY)); } catch (e) { storeCode = ''; } }
  function saveCode(c) {
    storeCode = c;
    gListErr = ''; gListOff = false; gListAt = 0;   // 多人一起報名的名單：換了通關碼就重新問（之前被 401 停掉的也恢復）
    try { if (c) window.localStorage.setItem(CODE_KEY, c); else window.localStorage.removeItem(CODE_KEY); } catch (e) { /* 存不了：這次開著還是有用 */ }
  }
  function codeMissing() { return CODE_ON && !G_TOKEN && !storeCode; }   // 手機一起報名：不用通關碼（帶 QR 的代碼）
  function codeHeaders(h) { if (CODE_ON && !G_TOKEN) h['X-Store-Code'] = storeCode; return h; }
  // 雲端服務回 401：通關碼不對（可能換了）→ 到通關碼畫面重新輸入；回傳 true＝處理好了
  function codeRejected(r) {
    if (!CODE_ON || r.code !== 'store_code') return false;
    askCode('bad');
    return true;
  }
  function askCode(why) {
    if (why === 'bad') saveCode('');
    codeWhy = why;
    if (view !== 'code') codeBack = view === 'welcome' || view === 'station' ? view : 'screen';
    view = 'code';
    busy = false;
    render();
    try { window.scrollTo(0, 0); } catch (e) { /* 舊瀏覽器 */ }
    var f = document.getElementById('f_code');
    if (f) { try { f.focus(); } catch (e) { /* 略過 */ } }
  }
  function codeHTML() {
    var h = '<h1>現場通關碼</h1>';
    if (codeWhy === 'bad') h += '<div class="box err"><p>現場通關碼不對（可能換了），請重新輸入。' + (codeBack === 'station' ? '' : '<br>剛剛填的資料都還在。') + '</p></div>';
    else if (codeWhy === 'change') h += '<p class="lead">請輸入新的現場通關碼。</p>';
    else h += '<p class="lead">第一次在這台電腦使用，<span class="nw">請輸入現場通關碼。</span></p>' +
      '<p class="hint">輸入一次就會記在這台電腦，<span class="nw">之後不用再輸入。</span></p>';
    h += '<label class="flabel" for="f_code">現場通關碼（6 位數字）</label>' +
      '<input type="text" id="f_code" class="field code" inputmode="numeric" maxlength="6" autocomplete="off" enterkeyhint="done">' +
      '<div id="msg" role="alert"></div>' +
      '<button type="button" class="btn" id="codeOk" data-act="codeOk">確定</button>';
    if (codeWhy === 'change' && storeCode) h += '<button type="button" class="btn btn2" data-act="codeCancel">不換了，回去</button>';
    return h;
  }
  // 按「確定」：有接雲端服務就先讀一次梯次，確認通關碼對不對（連不上就先記下來，選梯次時會再確認）
  function onCodeOk() {
    var f = document.getElementById('f_code'), v = half(f ? f.value : '').replace(/\s+/g, '');
    if (!/^\d{6}$/.test(v)) { showMsg('通關碼是 6 位數字，請再看一下。'); return; }
    if (!API) { codeDone(v, ''); return; }
    var old = storeCode, b = document.getElementById('codeOk');
    busy = true;
    hideMsg();
    if (b) b.textContent = '確認中，請稍等…';
    storeCode = v;
    api('GET', '/api/batches', null, WAIT_MS.batches, function (r) {
      busy = false;
      if (r.code === 'store_code') {
        storeCode = old;
        if (b) b.textContent = '確定';
        showMsg('通關碼不對，請再看一下。');
        return;
      }
      codeDone(v, r.ok ? '' : '還沒辦法確認通關碼對不對（連不上雲端服務），先記下來了。');
    });
  }
  function codeDone(v, warn) {
    var why = codeWhy, m = why === 'change' ? '通關碼換好了。' : why === 'bad' ? '通關碼更新好了。' : '';
    var byJudge = jdOff;   // 是核對頁的預覽（/api/judge）被擋下來的：現場沒按按鈕，不叫她「再按一次」；換好了預覽再打
    saveCode(v);
    jdOff = false;
    if (codeBack === 'station') { openStation(); if (warn) showMsg(warn, 'warn'); return; }
    if (why === 'bad' && !byJudge && (state.pos === SUBMIT || state.pos === REVIEW)) m += '\n請再按一次下面的按鈕。';
    if (warn) m += (m ? '\n' : '') + warn;
    view = codeBack;
    if (view !== 'screen' || state.pos === 0) { notice = m; render(); return; }
    if (state.pos === SUBMIT || state.pos === REVIEW) render();   // 不重設「本人確認」、不捲回最上面
    else go(state.pos);                                          // 選梯次那一題會重新讀梯次
    if (state.pos === REVIEW) judgeSoon();
    if (m) showMsg(m, warn ? 'warn' : 'ok');
  }

  // ---------- 呼叫雲端服務 ----------
  // cb(r)：r.ok＝成功、r.data＝回的 JSON；失敗 r.code＝store_code／bad_input／ai_failed／…（服務的代碼）或 net／timeout／bad_json，
  //        r.msg＝服務寫的白話、r.status＝HTTP 狀態碼
  function api(method, path, body, ms, cb) {
    var ended = false, ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); end({ code: 'timeout' }); }, ms);
    function end(r) { if (!ended) { ended = true; clearTimeout(timer); cb(r); } }
    var opt = { method: method, headers: codeHeaders({}), cache: 'no-store', signal: ctrl ? ctrl.signal : undefined };
    if (body != null) { opt.headers['Content-Type'] = 'application/json'; opt.body = body; }
    try {
      fetch(API + path, opt).then(function (res) {
        return res.text().then(function (t) {
          var j = null;
          try { j = JSON.parse(t); } catch (e) { /* 不是 JSON */ }
          if (res.status === 401) end({ code: 'store_code', status: 401, msg: j ? str(j['錯誤']) : '', data: j });
          else if (!j || typeof j !== 'object') end({ code: 'bad_json', status: res.status });
          else if (res.ok && j.ok === true) end({ ok: true, status: res.status, data: j });
          else end({ code: str(j['代碼']) || 'internal', status: res.status, msg: str(j['錯誤']), data: j });
        });
      }).catch(function (e) { end({ code: 'net', msg: String(e) }); });
    } catch (e) { end({ code: 'net', msg: String(e) }); }
  }

  // 錯誤 → 紅框：一句白話原因。斷線、逾時、雲端暫時出錯 → 加「再試一次」（重跑同一個呼叫，資料都還在）；
  // 重試也沒用的（資料不對、額滿、梯次設定不完整…）只寫雲端回的原因
  var RETRY = { net: 1, timeout: 1, bad_json: 1, ai_failed: 1, sheet_failed: 1, internal: 1 };
  var STEPS = { batches: '讀取梯次', read: '讀取資料', gen: '產生申請文件', recent: '更新名單', packet: '拿文件' };
  // step＝哪一步（也是「再試一次」要重跑的）；attrs＝按鈕多帶的屬性（列印站拿文件：編號、種類）
  function errHTML(step, r, attrs) {
    var again = !!RETRY[r.code], t;
    if (r.code === 'net') t = '網路斷線了，請看 Wi-Fi 有沒有通。';
    else if (r.code === 'timeout') t = '雲端太久沒有回應。';
    else if (again) t = '沒有成功：' + (r.msg || '雲端服務出錯（HTTP ' + r.status + '）。');
    else t = STEPS[step] + '沒有成功：' + (r.msg || '雲端服務出錯（' + r.code + '）。');
    if (again && (step === 'read' || step === 'gen')) t += '\n資料都還在。';
    if (step === 'recent') t += '\n會自動再試。';
    return '<div class="box err"><p>！ ' + escBr(t) + '</p>' +
      (again ? '<button type="button" class="btn" data-act="retry" data-k="' + step + '"' + (attrs || '') + '>再試一次</button>' : '') + '</div>';
  }
  // 「再試一次」：送出時答案、檔案都沒改就照舊帶上次存好的編號（state.pend，不會多一列）；產生用同一份核對後的資料
  function retry(el) {
    var k = el.getAttribute('data-k');
    if (k === 'read') onSubmit();
    else if (k === 'gen') onGen();
    else if (k === 'batches') { loadBatches(); render(); }
    else if (k === 'recent') stWake(true);
    else if (k === 'packet') stPrint(Number(el.getAttribute('data-no')), el.getAttribute('data-kind'));
  }

  // ---------- 畫面 ----------
  function topHTML(n) {
    var fill = state.fill && !G_TOKEN;   // 店裡電腦上幫手機填好的人補資料（10/23）
    var back = n <= N && state.back >= SUBMIT ? (state.back === REVIEW ? '‹ 回核對頁' : '‹ 回確認頁')
      : fill && n >= 1 && n <= SUBMIT && !prevFill(n) ? '‹ 回名單' : '‹ 上一題';
    var fc = fill ? fillCount(n) : null;
    var all = fill ? Math.max(fc.all, 1) : shownCount(N), at = fill ? fc.at : Math.min(shownCount(n), all);   // 只算要問的（條件題沒問的不算）
    var h = '<div class="top"><button type="button" class="back" data-act="back">' + back + '</button>' +
      '<span class="count">' + (n <= N ? (fill ? '要補第 ' : '第 ') + at + ' 題／共 ' + all + ' 題' : '最後一步') + '</span></div>';
    var pct = Math.round((n <= N ? at : all) / all * 100);
    return h + '<div class="bar" aria-hidden="true"><span style="width:' + pct + '%"></span></div>' +

  }

  function introHTML() {
    return '<h1>重返職場 AI 入門班｜<span class="nw">報名資料表</span></h1>' +
      (notice ? '<div class="box ok" role="status"><p>' + escBr(notice) + '</p></div>' : '') +
      '<p class="lead">大約 10 分鐘，<span class="nw">大多用點的。</span></p>' +
      '<p class="lead">請先準備好身分證，<span class="nw">一開始要拍照。</span></p>' +
      '<p class="lead">也要準備勞保資料<span class="nw">（下載的 PDF）。</span></p>' +
      '<p class="hint">從來沒保過勞保、農保<span class="nw">（勞保局查無資料）</span>的，<span class="nw">不用下載，</span>' +
      '<span class="nw">上傳那一步按</span><span class="nw">「沒有任何勞保、</span><span class="nw">農保紀錄」。</span></p>' +
      '<p class="lead">資料只用在這次補助申請，<span class="nw">申請完就刪除。</span></p>' +
      '<p class="hint">中途離開沒關係，<span class="nw">下次打開可以接著填。</span></p>' +
      '<button type="button" class="btn" data-act="start">我同意，開始填寫</button>' +
      (TOUCH ? '' : gHomeHTML()) +   // 多人一起報名（10/22）：今天在手機上填好的人、產生 QR（店裡電腦才有）
      // 列印站只給店裡的電腦：學員自己的手機上不放這顆（點進去會看到別人的名字）；手機、平板要用就開 #列印站 網址
      (TOUCH ? '' : '<div class="foot"><button type="button" class="btn btn2" data-act="station">列印站（店裡電腦用）</button></div>') +
      (CODE_ON ? '<div class="foot"><button type="button" class="linkbtn" data-act="code">更換通關碼</button></div>' : '');
  }

  // 拍過、選過，但檔案沒有留在這台電腦的題號（from ≤ 題號 < to）；沒有就回傳 0
  // 勞保檔只有要回確認頁（還沒讀取）時才要補；讀取過以後只需要身分證照片（產生申請文件要再送一次）；
  // 按了「沒有任何勞保、農保紀錄」的沒有檔可以弄丟
  function lostAt(from, to) {
    for (var p = from; p < to && p <= N; p++) {
      var q = QS[p - 1];

      if (q.type === 'docs' && docsLost && !state.noLabor && to <= SUBMIT) return p;

  function welcomeHTML() {
    var p = state.pos, lost = p === PRINT ? 0 : lostAt(1, p), nm = nameOf(), msg, btn;
    if (lost && QS[lost - 1].type === 'photo') {

  // 拍照題：還沒拍→「打開相機拍照」（電腦：「選擇照片檔」）；拍好→縮圖＋問清不清楚；沒存住→提醒重拍

  // 勞保資料：選好的檔一個一列（可刪），最多 5 個；下面一顆「沒有任何勞保、農保紀錄」（跟選檔二選一：選了檔就不能按，按了就收起選檔）

  function docsHTML(q) {

  // 梯次：一梯一個大按鈕；只有「開放報名」能點。照開課日早到晚、同一個月一段（gotBatches 排好了）
  function openCount() {

  function batchHTML() {

    h += '<div class="opts" role="radiogroup" aria-labelledby="qt">';

      if (d.slice(0, 6) !== month) {   // 換月份：上面一行月份（今年的只寫月；別年的寫民國年，跟梯次名稱一樣用民國）
        month = d.slice(0, 6);

      var say = str(b['梯次']) + ' ' + str(b['上課時間']) + '，' + (ok ? left : (b['狀態'] || '不能報名') + '，不能選');
      h += '<button type="button" class="opt bt" data-act="batch" data-i="' + i + '" role="radio" aria-label="' + esc(say) + '" aria-checked="' + (on ? 'true' : 'false') + '"' + (ok ? '' : ' disabled') + '>' +
        '<span class="mark">' + CHECK + '</span><span class="t">' +
        '<span class="b1"><span>' + esc(str(b['梯次'])) + '</span> <span>' + esc(str(b['上課時間'])) + '</span></span>' +

    });
    return h + '</div><button type="button" class="alt" data-act="reloadBatches">重新整理梯次</button>';
  }

  function submitHTML() {
    var h = topHTML(SUBMIT);

    h += '<p class="hint">請和學員一起看一遍。<span class="nw">要改的話，按旁邊的「改」。</span></p>';
    h += '<ol class="list">';

    h += '<button type="button" class="opt chk" id="chk" data-act="chk" role="checkbox" aria-label="本人確認：以上都是真的。這些資料只用在這次補助申請，由 AI 協助整理成申請文件。" aria-checked="' + (confirmChecked ? 'true' : 'false') + '">' +
      '<span class="mark">' + CHECK + '</span><span class="t">本人確認：以上都是真的' +

  // ---------- 核對頁（現場人員拿學員的身分證、勞保資料對照；規格 0-8、3-1～3-4） ----------
  // 10/15（docs/交接_表單改造_1014.md 第 10 節契約）：目標是每個人一次到位。由上到下：提醒 → 基本資料（三個來源比過，不一樣的點一下）
  // → 她的最後一份工作（系統推薦一筆、點別筆、＋新增；10/22 起卡片上對著選定那份問職稱、主要做什麼、為什麼離開，換選別筆就清空重問）
  // → 她想做的工作、她的話 → 最後一關：唸給她聽＋基本資料、切結書照印出來的樣子（/api/judge 預覽）→ 按「基本資料、切結書都唸給她聽過，
  // 她說都對」（沒按不能產生）→ 產生
  function R() { return obj(state.read); }
  function J0() { return obj(R()['判讀']); }                  // 讀取時的判讀：基本資料的三個來源、「改過」比的原值
  function J() { return state.jd ? obj(state.jd) : J0(); }    // 最新的判讀（/api/judge、產生時 409 換上的）：提醒、候選工作、預覽、唸給她聽
  function IDC() { return obj(R()['身分證']); }
  function LB() { return obj(R()['勞保']); }
  // 最後一家公司（寫計畫書、唸給她聽要用）；沒有公司勞保的人是 null（工作經歷那一列是零工，不是公司）
  function lastCo(j) { return obj(j['最後公司']); }
  // 沒保勞保的最後一份工作四格（規格 3-3 判讀.未投保工作、3-4 核對後.未投保工作）：10/15 起是「＋新增」那一份
  var NG_KEYS = ['職稱', '機構', '起', '迄'];
  function ngOf(v) { var o = {}; v = obj(v); NG_KEYS.forEach(function (k) { o[k] = str(v[k]); }); return o; }
  function ngBlank(v) { return !NG_KEYS.some(function (k) { return clean(v[k]); }); }
  // 送出的資料表裡某一題的答案（「（未填）」＝空）：核對頁直接改的那幾題比「改過」用
  function sheetAns(label) {
    var ls = str(state.sheet || buildText()).split('\n'), v;
    for (var i = 0; i < ls.length; i++) if (ls[i].indexOf(label + '：') === 0) { v = ls[i].slice(label.length + 1).trim(); return v === EMPTY ? '' : v; }
    return '';
  }
  // 「＋新增」四格的預填：讀取時判讀有未投保工作就用它（10/22 起表單不問零工那幾題，多半是空的）
  function ngPre() { return ngOf(J0()['未投保工作']); }
  var WORDS = ['平常做什麼', '為什麼想做', '怎麼有辦法回去', '想做哪一行'];   // 她的話（契約的鍵）
  var STORE_AFTER = [['歇業', '已經歇業'], ['換負責人', '換別人當負責人'], ['還是她的名字', '還是她的名字']];   // [送出的值, 按鈕的字]
  // 基本資料：改了就要請她再看一次（Email 10/22 起也在核對頁直接改、也給她看）
  var BASIC = ['姓名', '身分證字號', '出生日期', '戶籍地址', '通訊地址', '郵遞區號', 'ans.email'];
  // 核對頁直接改的表單答案（10/22：不用回確認頁重新讀取）：路徑 ans.<題目 id> → state.a；送核對後.表單回答（雲端蓋過資料表那一題）
  var ANS = { email: 'Email', place: '希望上班地點' };
  var opened = {}, lbOpen = null, jobNote = '', seenNote = '', shownCands = '';   // 畫面用（不存）：打開的「改」、勞保每一列有沒有展開…
  var titleOther = false, wantWarn = '', seenPv = '';   // 職稱點了「其他」（還沒打字）；想做的工作超過 2 個；按她看過那時的切結書
  function fixShape(f) {
    f['勞保'] = obj(f['勞保']);
    f['勞保']['表頭'] = obj(f['勞保']['表頭']);
    f['勞保']['明細'] = arr(f['勞保']['明細']).map(obj);
    f['勞保']['農保明細'] = arr(f['勞保']['農保明細']).map(obj);
    f['最後公司職稱'] = str(f['最後公司職稱']);
    f['未投保工作'] = ngOf(f['未投保工作']);
    // 10/15 的欄位（舊存檔沒有就給預設）；最後工作、離開原因 null＝還沒選：用到時照判讀預填
    f['基本資料'] = { '她看過都對': obj(f['基本資料'])['她看過都對'] === true };
    var w = obj(f['她的話']), j = obj(f['最後工作']), own = j['自己開的店'], gov = j['公保軍保'];
    f['她的話'] = {};
    WORDS.forEach(function (k) { f['她的話'][k] = str(w[k]); });
    if (typeof f['離開原因'] !== 'string') f['離開原因'] = null;
    // 選定那一份＋卡片上對著它問的（10/22）：職稱、工作內容（那份工作主要做什麼，資料表那行的寫法）、公保軍保（＋新增那份才問）
    f['最後工作'] = (j['來源'] === '勞保' && str(j['鍵'])) || j['來源'] === '新增' ? { '來源': j['來源'], '鍵': str(j['鍵']), '單位': str(j['單位']),
      '自己開的店': own === true || own === false ? own : null, '店後來': afterOk(j['店後來']) ? j['店後來'] : '',
      '職稱': str(j['職稱']), '工作內容': str(j['工作內容']), '公保軍保': gov === true || gov === false ? gov : null } : null;
    return f;
  }
  function afterOk(v) { return STORE_AFTER.some(function (a) { return a[0] === v; }); }
  // 選了一份（勞保上那筆 c，或 ＋新增＝c 是 null）：卡片上的答案都從頭問（換選別筆時清空，KNOWN 75 的根）；她開的店（行號）職稱先寫負責人
  function newJob(c) {

  // ---------- 切結書（整份第 5 頁）會這樣印（判讀的 切結預覽；選的、改的有變 0.5 秒後打 /api/judge 重算） ----------

  // 錯了要她本人再跑一趟（台南用立可帶改還要蓋章）：在這裡唸給她聽、她說都對才產生

    h += '<ul class="ck pv">' +

  // ---------- 她看過，都對（Tomi 10/15 定：一定要按才能產生；10/22 起連切結書一起確認。基本資料、切結書改了就自動取消，要再按一次） ----------
  function seenOk() { return state.fix['基本資料']['她看過都對'] === true; }
  // 取消「她看過，都對」；why＝框裡說為什麼要再按一次（只有原本按過才說）
  function unsee(why) { var b = state.fix['基本資料']; if (b['她看過都對']) { b['她看過都對'] = false; seenNote = why || '基本資料改過了，要請她再看一次。'; } }
  // 給她看的基本資料（申請表、切結書都印這些）
  function seenHTML() {
    var f = state.fix, rows = [['名字', f['姓名']], ['身分證字號', normId(f['身分證字號'])],
      ['生日', twDate(f['出生日期']) ? '民國 ' + twDate(f['出生日期']) : f['出生日期']], ['戶籍地址', f['戶籍地址']]];

    rows.push(['手機', textOf(qById('phone'))], ['Email', textOf(qById('email'))]);
    return '<p class="vt">請把畫面轉給她看：基本資料（申請表、切結書都印這些）都對嗎？</p><dl class="sv">' +
      rows.map(function (r) { return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(clean(r[1]) || '（空白）') + '</dd>'; }).join('') + '</dl>';
  }
  function seenBtnHTML() {

      '<button type="button" class="opt chk" data-act="seen" role="checkbox" aria-checked="' + on + '"><span class="mark">' + CHECK + '</span>' +

  function reviewHTML() {
    syncJob();
    var j = J(), cs = cands(), any = (cs || []).some(function (c) { return c['可選'] !== false; });
    var h = '<h1>核對資料</h1><p class="lead">學員：' + esc(nameOf()) + '<span class="nw">（編號 ' + state.rid + '）</span></p>';

    if (cs && arr(j['缺必填']).indexOf('勞保明細') >= 0) {
      h += '<div class="box err"><p>勞保一筆都沒讀到：請把勞保那幾頁重拍清楚，按<span class="nw">「回去換檔案或改答案」</span>再讀一次。</p></div>';
    } else if (cs) {
      if (jobNote) h += '<div class="box warn" role="status"><p>' + esc(jobNote) + '</p></div>';
      h += '<p class="hint">' + (any ? '系統先選好推薦的那一筆。問她對不對，不對就點別筆；勞保上沒有的，按<span class="nw">「＋ 新增一筆」</span>。'
        : '勞保上沒有可以選的工作。問她最後一份工作，填在下面。') + '</p>' +
        '<div id="joblist">' + jobListHTML() + '</div>' +
        '<div class="box say"><p>問她：「離開這一家之後，還有做過別的工作嗎？沒保勞保的也算。」<br>有 → 按<span class="nw">「＋ 新增一筆」</span></p></div>' +
        '<div id="jobdet">' + jobDetHTML() + '</div>';

    h += wordsHTML() + rowsHTML();   // 她想做的工作、她的話緊接在最後一份工作下面；勞保每一列（AI 讀錯才改）收在後面
    // 最後一關（10/22）：唸給她聽 → 基本資料、切結書照印出來的樣子轉給她看 → 她說都對才按（不多一顆一定要按的按鈕）
    h += '<h2 class="st">最後一關：唸給她聽、轉給她看</h2>';

    h += '<div class="seen" id="seen"><div id="seenbasic">' + seenHTML() + '</div>' +
      '<div class="card' + (jdFail ? ' stale' : '') + '" id="preview">' + previewHTML() + '</div><div id="seenbtn">' + seenBtnHTML() + '</div></div>';
    h += '<div id="msg" role="alert"></div>';
    // 只有一顆主要按鈕：缺姓名、字號、生日、地址，或還沒按「基本資料、切結書都唸給她聽過，她說都對」時是不能按的樣式（按了會說缺什麼）；
    // 退路永遠是下面兩個小字連結，按了確認框（#ask）出現在連結下面。不放「重新填寫」
    return h + '<button type="button" class="btn" id="gen" data-act="gen" aria-disabled="' + (genOff() ? 'true' : 'false') + '">資料都對，產生申請文件</button>' +
      '<div class="foot"><button type="button" class="linkbtn" data-act="reeditAsk">回去換檔案或改答案</button>' +
      '<button type="button" class="linkbtn" data-act="endAsk">今天印不了，先換下一位</button></div><div id="ask"></div>';
  }

  // ---------- 預覽（/api/judge：純判讀、不存、不花錢；不擋產生——產生時雲端會用核對後重新判讀） ----------
  // 沒拿到：唸給她聽、切結書會這樣勾灰掉、寫「還沒更新，先不要唸」（舊的跟畫面上選的可能對不上），2 秒後自動再試 1 次，拿到就恢復；
  // 之後現場再改、再點也會再打（jdAgain＝這一輪已經自動再試過）。
  // 通關碼不對（401）：跟其他呼叫一樣叫出通關碼畫面，換好之前不再打（jdOff；錯的碼一直送，雲端打錯 30 次會把整家店鎖 15 分鐘）
  var jdTimer = 0, jdSeq = 0, jdPend = false, jdFail = false, jdTried = false, jdAgain = false, jdOff = false;
  function pvText() {
    if (jdFail) return '！ 還沒更新，先不要唸' + (jdPend ? '（再試一次…）' : '（暫時連不上雲端，不影響產生）');
    return jdPend ? '更新中…' : '';
  }
  function pvStat() {
    var t = pvText(), el = document.getElementById('pvst'), sw = document.getElementById('saywarn');
    if (el) el.textContent = t;
    if (sw) { sw.textContent = t; sw.hidden = !jdFail; }
    ['preview', 'saybox'].forEach(function (id) { var x = document.getElementById(id); if (x) x.classList.toggle('stale', jdFail); });
  }
  function judgeSoon() {
    if (!API || !state.read || !state.fix || jdOff) return;
    clearTimeout(jdTimer);
    jdTimer = setTimeout(judgeNow, 500);
    jdPend = true;
    jdAgain = false;
    pvStat();
  }
  function judgeNow() {
    var my = ++jdSeq;
    jdTimer = 0;
    var body = { '資料表': state.sheet || buildText(), '身分證': IDC(), '勞保': LB(), '核對後': fixOut() };
    api('POST', '/api/judge', JSON.stringify(body), WAIT_MS.judge, function (r) {
      if (my !== jdSeq || view !== 'screen' || state.pos !== REVIEW || !state.fix) return;   // 有更新的一次、或已經離開核對頁
      var j = r.ok && r.data ? r.data['判讀'] : null;
      if (!jdTimer) jdPend = false;
      if (r.code === 'store_code') {
        clearTimeout(jdTimer); jdTimer = 0; jdPend = false; jdFail = true; jdOff = true;
        pvStat();
        codeRejected(r);
        return;
      }
      if (!j || typeof j !== 'object' || isArr(j)) {
        jdFail = true;
        if (!jdAgain && !jdTimer) { jdAgain = true; jdPend = true; jdTimer = setTimeout(judgeNow, 2000); }   // 2 秒後自動再試 1 次
        pvStat();
        return;
      }
      jdFail = false;
      state.jd = j;
      var moved = syncJob();
      // 她看過之後切結書變了（例：改了勞保的日期、換了離開原因）：要請她再看一次（10/22 起她看過連切結書一起確認）
      if (seenOk() && seenPv && pvSig() !== seenPv) unsee('切結書變了，要請她再看一次、再唸一次。');
      save();
      if (moved) render(); else paintJudge();
    });
  }
  function setHTML(id, h) { var el = document.getElementById(id); if (el) el.innerHTML = h; }
  // 新的判讀回來：只換提醒、預覽、唸給她聽、候選工作（有變才換；選定那份的卡片游標不在裡面才換），不動正在打字的格子
  function paintJudge() {
    setHTML('vbox', verdictHTML(J()));
    setHTML('preview', previewHTML());
    setHTML('say', sayHTML(J()));
    if (JSON.stringify(cands() || []) !== shownCands) {
      setHTML('joblist', jobListHTML());
      var d = document.getElementById('jobdet');
      if (d && !d.contains(document.activeElement)) d.innerHTML = jobDetHTML();
    }
    setHTML('leaveage', ageHTML());
    paintSeen();
    paintGen();
    pvStat();
  }
  function resetReview() {
    opened = {}; lbOpen = null; jobNote = ''; seenNote = ''; shownCands = ''; titleOther = false; wantWarn = ''; seenPv = '';
    clearTimeout(jdTimer); jdTimer = 0; jdSeq++; jdPend = false; jdFail = false; jdTried = false; jdAgain = false; jdOff = false;
  }

  // ---------- 核對頁的點選（點了：存檔、整頁重畫〔不捲動〕、0.5 秒後重算預覽） ----------
  function fixed() { save(); render(); judgeSoon(); }
  function focusFix(path) {

  // 基本資料點了其中一個值
  function onPick(k, i) {

    setFix(k, c.v);

    hideMsg();
    fixed();
  }
  // 「改」「都不對，改」：打開格子（值留著，改一兩個字就好）
  function onOpen(k) {

  // 換選一份（勞保上別筆／＋新增）：職稱、主要做什麼、為什麼離開都清空重問（10/22，KNOWN 75 的根：答案是上一筆的）；切結書會跟著變
  function chose(job) {
    state.fix['最後工作'] = job;
    state.fix['離開原因'] = '';

  function onJob(k) {
    var c = candBy(k), w = selJob();

  function onJobNew() {
    var w = selJob();

    chose(newJob(null));

  // 這是她自己開的店嗎？v＝'1' 是／'0' 不是。是 → 職稱空著就寫負責人；原本是、改成不是 → 負責人拿掉（再問她職稱）
  function onOwn(v) {

  function printUrl(url) {

  // ---------- 列印站（店裡的電腦：學員在手機上產好的申請文件，點她的名字列印；規格 2-4、2-5） ----------

    try { window.scrollTo(0, 0); } catch (e) { /* 舊瀏覽器 */ }
    var h = document.getElementById('qt');
    if (h) { try { h.focus({ preventScroll: true }); } catch (e) { /* 舊瀏覽器 */ } }
  }

  // 只有看不到的時候才捲，而且只捲到剛好看得到（畫面在手指下亂動容易點錯）
  function scrollToEl(el) {
    if (!el || !el.getBoundingClientRect) return;
    var r = el.getBoundingClientRect();
    var vh = window.innerHeight || document.documentElement.clientHeight;
    var d = r.bottom > vh ? r.bottom - vh + 16 : r.top < 0 ? r.top - 16 : 0;
    if (!d) return;
    if ('scrollBehavior' in document.documentElement.style) window.scrollBy({ top: d, behavior: 'smooth' });
    else window.scrollBy(0, d);
  }

  function showMsg(text, cls) {
    putMsg('<div class="box ' + (cls || 'err') + '"><p>' + (cls === 'ok' ? '' : '！ ') + escBr(text) + '</p></div>');   // \n＝一句一行
  }
  function putMsg(h) {
    var m = document.getElementById('msg');
    if (!m) return;
    m.innerHTML = h;
    scrollToEl(m);
  }
  function hideMsg() { var m = document.getElementById('msg'); if (m) m.innerHTML = ''; }

  // 多行輸入框跟著字變高，整段地址一眼看得完（不用在框裡面捲）
  function autoGrow(el) {
    if (!el || el.tagName !== 'TEXTAREA' || !(el.getAttribute('data-field') || el.getAttribute('data-fix'))) return;
    el.style.height = 'auto';
    el.style.height = (el.scrollHeight + 6) + 'px';
  }
  function growAll() {
    var els = app.querySelectorAll('textarea');
    for (var i = 0; i < els.length; i++) autoGrow(els[i]);
  }

  // ---------- 題目畫面的即時更新 ----------
  function paintOpts(q) {
    var els = app.querySelectorAll('.opt[data-act="opt"]');
    for (var i = 0; i < els.length; i++) els[i].setAttribute('aria-checked', isSel(q, q.opts[i]) ? 'true' : 'false');
  }

  function activeFollow(q) {
    if (q.type === 'single') { var o = optByT(q, state.a[q.id]); return fOf(o); }
    if (q.type === 'multi') {
      for (var i = 0; i < q.opts.length; i++) if (q.opts[i].f && isSel(q, q.opts[i])) return q.opts[i].f;
    }
    return null;
  }

  // 顯示「選了要接著填」的框；有變動才重畫（避免打字中被清掉）
  function updateFollow(q) {
    var box = document.getElementById('follow');
    if (!box) return false;
    var f = activeFollow(q);
    var key = f ? f.type + '|' + f.label : '';
    if (key === followKey) return false;
    followKey = key;
    if (!f) { box.innerHTML = ''; return false; }
    box.innerHTML = '<label class="flabel" for="f_' + q.id + '_t">' + esc(f.label) + '</label>' +
      (f.hint ? '<p class="hint">' + esc(f.hint) + '</p>' : '') + fieldHTML(q.id + '_t', f, '');
    growAll();
    return true;
  }

  function nextLabel(q) {
    if (state.back >= SUBMIT) return (q.type === 'photo' ? '清楚，' : '改好了，') + (state.back === REVIEW ? '回核對頁' : '回確認頁');
    if (q.type === 'photo') return '清楚，下一步';
    if (q.type === 'batch') return '下一步：確認資料';
    if (q.type === 'multi') return selOf(q).length ? '選好了，下一題' : '跳過這題';
    if (q.type === 'text' && !q.req) return textOf(q) ? '下一題' : '跳過這題';
    return '下一題';
  }

  function updateNext(q, initial) {
    var b = document.getElementById('next');
    if (!b) return;
    if (q.type === 'single') {
      var o = optByT(q, state.a[q.id]);
      b.hidden = !(o && (fOf(o) || initial));   // 單選第一次點會自動跳題，不用按鈕
    }
    if (q.type === 'batch') b.hidden = !state.batch;   // 點梯次會自動往下；沒得選就不能往下
    if (q.type === 'docs') b.className = 'btn' + (state.docs.length || state.noLabor ? '' : ' btn2');   // 還沒選檔、也沒按「沒有任何紀錄」：選檔才是主要按鈕
    b.textContent = nextLabel(q);
  }

  function removeMax() { var m = document.getElementById('maxmsg'); if (m && m.parentNode) m.parentNode.removeChild(m); }
  function showMax(i, max) {
    removeMax();
    var els = app.querySelectorAll('.opt[data-act="opt"]');
    var m = document.createElement('div');
    m.id = 'maxmsg';
    m.className = 'box warn';
    m.setAttribute('role', 'alert');
    m.innerHTML = '<p>最多選 ' + max + ' 個。想換的話，先點掉一個已經選的。</p>';
    els[i].parentNode.insertBefore(m, els[i].nextSibling);
  }

  // 下一題（條件題沒問的跳過）；從確認頁、核對頁來改的，或回去補拍、補選的，補完直接回到原本的位置——
  // 只有改了職稱、多出還沒答的條件題（沒在公司上過班的三題）時，先接著問完再回去
  function advance() {
    var p = step(state.pos + 1, 1);
    if (state.fill && !state.back) p = nextGap(p);   // 手機填好、載進這台電腦的（一起報名）：答過的題跳過
    if (state.back) {
      var pq = QS[p - 1];   // 還沒拍的身分證（她不拍又改回來拍，10/28）也先接著問
      if (!(p < state.back && p <= N && (pq.when || pq.type === 'photo') && !answered(pq))) p = lostAt(p, state.back) || state.back;
      if (p === state.back) state.back = 0;
    }
    go(p);
  }

  // 「歡迎回來」：有照片、檔案沒存到，先回去補，補完回到上次的位置
  function resume() {
    var lost = state.pos === PRINT ? 0 : lostAt(1, state.pos);
    view = 'screen';
    state.wait = '';
    if (lost && !(state.back > state.pos)) state.back = state.pos;
    go(lost || state.pos);
  }

  function onOpt(i) {
    var q = curQ();
    if (!q || !q.opts[i]) return;
    var o = q.opts[i];
    hideMsg();
    if (q.type === 'single') {
      state.a[q.id] = o.t;
      save();
      paintOpts(q);
      if (fOf(o)) {
        var changed = updateFollow(q);
        updateNext(q, false);
        if (changed) scrollToEl(document.getElementById('next'));   // 接著填的框和「下一題」都要看得到
        return;
      }
      updateFollow(q);
      busy = true;   // 讓她看到勾勾再跳題
      setTimeout(function () { busy = false; advance(); }, 350);
      return;
    }
    var sel = selOf(q).slice();
    var k = sel.indexOf(o.t);
    removeMax();
    if (k >= 0) {
      sel.splice(k, 1);
    } else {
      if (o.ex) sel = [];
      else sel = sel.filter(function (t) { var x = optByT(q, t); return !(x && x.ex); });
      if (q.max && sel.length >= q.max) { showMax(i, q.max); return; }
      sel.push(o.t);
    }
    state.a[q.id] = sel;
    save();
    paintOpts(q);
    var shown = updateFollow(q) && activeFollow(q);
    updateNext(q, false);
    if (shown) scrollToEl(document.getElementById('next'));
  }

  function onNext() {
    var q = curQ();
    if (!q) return;
    var err = check(q);
    if (err) {
      showMsg(err);
      var f = document.getElementById('f_' + q.id) || document.getElementById('f_' + q.id + '_t') ||
        document.getElementById('f_' + q.id + (clean(state.a[q.id + '_from']) ? '_to' : '_from'));
      if (f && q.type !== 'multi') { try { f.focus(); } catch (e) { /* 略過 */ } }
      return;
    }
    if (q.type === 'range') {   // 日期寫法看不懂：提醒一次，同樣的字再按一次就照寫（不擋）
      var odd = rangeOdd(q), key = state.a[q.id + '_from'] + '|' + state.a[q.id + '_to'];
      if (odd && softOk !== key) { softOk = key; showMsg(odd, 'warn'); return; }
    }
    if (q.soft) {   // 她不拍身分證時打的字號、生日（10/28）：同上
      var warn = q.soft(), sk = q.id + '|' + state.a[q.id];
      if (warn && softOk !== sk) { softOk = sk; showMsg(warn, 'warn'); return; }
    }
    if (q.type === 'docs') docsLost = 0;
    if (q.when && q.type === 'text' && typeof state.a[q.id] !== 'string') { state.a[q.id] = ''; save(); }   // 跳過也算答過（answered）
    if (G_TOKEN && q.type === 'multi' && !isArr(state.a[q.id])) { state.a[q.id] = []; save(); }   // 手機一起報名：跳過也記下來，電腦上不再問
    advance();
  }
  // 從、到寫的字看不懂成民國日期 → 回傳提醒的話；都看得懂回傳空字串
  function rangeOdd(q) {
    var bad = [['從', '_from'], ['到', '_to']].filter(function (x) { var v = state.a[q.id + x[1]]; return clean(v) && !normDate(v); })
      .map(function (x) { return '「' + x[0] + '」寫的「' + clean(state.a[q.id + x[1]]) + '」'; });
    return bad.length ? bad.join('、') + '，\n看不出是哪一天。\n請寫成像 100/03/01 這樣。\n只記得大概的，照這樣也行，\n再按一次「' + nextLabel(q) + '」。' : '';
  }

  // 從確認頁、核對頁來改的：「回確認頁」先檢查這題再回去
  function onBack() {
    if (state.pos <= N && state.back >= SUBMIT) { onNext(); return; }
    if (state.fill && state.pos >= 1 && state.pos <= SUBMIT) { go(prevFill(state.pos)); return; }   // 載進來的：只退回電腦上要補的題，第一題再退＝回名單
    go(step(state.pos - 1, -1));   // 條件題沒問的跳過
  }
  // 載進來的（一起報名）：p 之前、電腦上要補的那一題；沒有＝0（開場頁的名單）。她手機上答過的不退回去，要改到確認頁按「改」（Tomi 10/23）
  function prevFill(p) {
    for (var i = Math.min(p - 1, N); i >= 1; i--) if (state.fillQs.indexOf(QS[i - 1].id) >= 0 && shown(QS[i - 1])) return i;
    return 0;
  }
  function fillCount(n) {   // 電腦上要補的題：到第 n 題為止補了幾題、一共幾題
    var at = 0, all = 0;
    QS.forEach(function (q, i) { if (state.fillQs.indexOf(q.id) >= 0 && shown(q)) { all++; if (i + 1 <= n) at++; } });
    return { at: at, all: all };
  }

  function onChk(el) {
    confirmChecked = !confirmChecked;
    el.setAttribute('aria-checked', confirmChecked ? 'true' : 'false');
    var s = document.getElementById('send');
    if (s) s.setAttribute('aria-disabled', confirmChecked ? 'false' : 'true');
    hideMsg();
  }

  // ---------- 拍照、上傳 ----------
  // 照片縮到長邊 edge px 轉成 JPEG；瀏覽器把照片畫進 canvas 時會照 EXIF 自動轉正（iPhone 的 HEIC 在 Safari 也是這樣轉成 JPEG）
  function shrink(file, edge, quality, done) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      try {
        var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, edge / Math.max(w, h, 1));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(w * k));
        c.height = Math.max(1, Math.round(h * k));
        var g = c.getContext('2d');
        g.fillStyle = '#fff';   // 透明的地方變白底
        g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { done(b); }, 'image/jpeg', quality);
      } catch (e) { URL.revokeObjectURL(url); done(null); }
    };
    img.onerror = function () { URL.revokeObjectURL(url); done(null); };
    img.src = url;
  }

  // 身分證照片：縮到長邊 1600px
  function takeFile(q, file) {
    if (file.type && !/^image\//i.test(file.type)) { showMsg('請選一張照片。'); return; }
    working = q.id;
    refresh(q);
    shrink(file, MAX_EDGE, JPEG_Q, function (blob) {
      working = '';
      if (!blob) { refresh(q); if (curQ() === q) showMsg('這張照片打不開，請重拍或換一張。'); return; }
      keepFile(q, { blob: blob, mime: 'image/jpeg', name: q.fileKind + '.jpg', url: URL.createObjectURL(blob), label: '照片' });
    });
  }
  function keepFile(q, f) {
    dropFile(q.id);
    files[q.id] = f;
    state.had[q.id] = true;
    save();
    idbPut(q.id, f);   // 存進這台電腦：網頁重新打開不用重拍
    refresh(q);
    if (curQ() === q) scrollToEl(document.getElementById('retake') || document.getElementById('next'));   // 兩個大按鈕都要看得到
  }
  function dropFile(id) {
    if (files[id] && files[id].url) URL.revokeObjectURL(files[id].url);
    delete files[id];
  }

  // 勞保資料：可以一次選好幾個；PDF 原檔（10MB 內）、照片截圖縮到長邊 2400px
  function takeDocs(q, list) {
    var todo = Array.prototype.slice.call(list), room = MAX_DOCS - state.docs.length, errs = [];
    if (todo.length > room) { todo = todo.slice(0, Math.max(0, room)); errs.push('最多 ' + MAX_DOCS + ' 個檔案，多的沒有加進來。'); }
    working = q.id;
    refresh(q);
    (function step() {
      if (!todo.length) {
        working = '';
        refresh(q);
        if (curQ() === q) { if (errs.length) showMsg(errs.join('\n')); else scrollToEl(document.getElementById('next')); }
        return;
      }
      var file = todo.shift(), nm = file.name || '';
      if (/pdf/i.test(file.type) || /\.pdf$/i.test(nm)) {
        if (file.size > MAX_BYTES) errs.push('「' + nm + '」超過 10MB，太大了。');
        else addDoc({ blob: file, mime: 'application/pdf', name: nm, label: (nm || 'PDF 檔') + '（' + kb(file.size) + '）' });
        step();
        return;
      }
      if (file.type && !/^image\//i.test(file.type)) { errs.push('「' + nm + '」不是 PDF 或照片，不能上傳。'); step(); return; }
      shrink(file, DOC_EDGE, DOC_Q, function (blob) {
        if (!blob) errs.push('「' + (nm || '照片') + '」打不開，請改選下載的 PDF。');
        else addDoc({ blob: blob, mime: 'image/jpeg', name: nm, url: URL.createObjectURL(blob), label: (nm || '照片') + '（' + kb(blob.size) + '）' });
        step();
      });
    })();
  }
  function addDoc(f) {
    var k = 'doc_' + Date.now().toString(36) + '_' + (++docSeq);
    files[k] = f;
    state.docs.push({ k: k, label: f.label, mime: f.mime, size: f.blob.size });
    state.noLabor = false;   // 二選一
    docsLost = 0;
    save();
    idbPut(k, f);
  }
  // 「沒有任何勞保、農保紀錄」：按一次選、再按一次取消；已經選了檔案不能按（按鈕是 disabled）
  function onNoLabor() {
    var q = curQ();
    if (!q || q.type !== 'docs' || state.docs.length || working === q.id) return;
    state.noLabor = !state.noLabor;
    docsLost = 0;
    save();
    render();
    if (state.noLabor) scrollToEl(document.getElementById('next'));
  }
  // 她不想拍身分證（10/28）：拍過的照片刪掉（不留在這台電腦），改問字號、生日、戶籍地址；「改成拍身分證」回第 1 題，打的字清掉
  function onNoId() {
    var q = curQ();
    if (!q || q.id !== 'idFront' || !noIdOk() || state.fill || working) return;
    ['idFront', 'idBack'].forEach(function (k) { dropFile(k); idbDel(k); delete state.had[k]; });
    state.noId = true;
    advance();
  }
  function onUseId() {
    var q = curQ();
    if (!q || q.when !== noIdOn) return;
    state.noId = false;
    ['idNum', 'idBirth', 'idAddr'].forEach(function (k) { delete state.a[k]; });
    go(1);
  }
  function undoc(k) {
    state.docs = state.docs.filter(function (x) { return x.k !== k; });
    dropFile(k);
    idbDel(k);
    save();
    render();
  }
  // 還停在這題才重畫（處理照片時她可能已經按了上一題）
  function refresh(q) { if (curQ() === q) render(); }

  // ---------- 梯次（規格 2-1） ----------
  function loadBatches() {
    var my = ++batchSeq;
    batchLoading = true;
    batchErr = null;
    if (!API) { setTimeout(function () { if (my === batchSeq) { batchLoading = false; gotBatches(sampleBatches()); } }, 200); return; }
    api('GET', '/api/batches', null, WAIT_MS.batches, function (r) {
      if (my !== batchSeq) return;
      batchLoading = false;
      if (r.ok) { gotBatches(arr(r.data['梯次'])); return; }
      var q = curQ();
      if (q && q.type === 'batch' && codeRejected(r)) return;
      batches = null;
      batchErr = r;
      refreshBatch();
    });
  }
  // 只列開課日 ≥ 今天（台灣時間）的；照開課日早到晚排，同一天照雲端給的順序；不能選的也照日期排在原本的位置（10/20）
  function gotBatches(list) {
    var today = todayTW(), keep = [];
    list.forEach(function (b, i) {
      b = obj(b);
      var d = normDate(b['開課日']);
      if (b['梯次'] && d && d >= today) keep.push({ b: b, d: d, i: i });
    });
    keep.sort(function (x, y) { return x.d < y.d ? -1 : x.d > y.d ? 1 : x.i - y.i; });
    batches = keep.map(function (x) { return x.b; });
    if (state.batch) {
      var now = null;
      batches.forEach(function (b) { if (b['梯次'] === state.batch['梯次']) now = b; });
      if (now && now['狀態'] === '開放報名') state.batch = snap(now);   // 更新剩幾位
      else { batchGone = state.batch['梯次'] + '（' + (now ? now['狀態'] : '已經沒有這一梯') + '）'; state.batch = null; }
      save();
    }
    refreshBatch();
  }
  function snap(b) {
    var s = {};
    ['梯次', '開課日', '星期', '上課時間', '上課地點', '辦訓單位', '課程名稱', '剩餘', '寄件截止'].forEach(function (k) { if (b[k] != null) s[k] = b[k]; });
    return s;
  }
  function refreshBatch() { var q = curQ(); if (q && q.type === 'batch') render(); }
  function onBatch(i) {
    var b = arr(batches)[i];
    if (!b || b['狀態'] !== '開放報名') return;
    state.batch = snap(b);
    batchGone = '';
    save();
    var els = app.querySelectorAll('.opt[data-act="batch"]');
    for (var k = 0; k < els.length; k++) els[k].setAttribute('aria-checked', k === i ? 'true' : 'false');
    hideMsg();
    busy = true;   // 讓她看到勾勾再往下
    setTimeout(function () { busy = false; advance(); }, 350);
  }

  // ---------- 送出，讀取資料（規格 2-2） ----------
  function onSubmit() {
    if (!confirmChecked) {
      showMsg('請先勾「本人確認」，\n再按「送出，讀取資料」。');
      return;
    }
    for (var i = 0; i < N; i++) {
      var err = shown(QS[i]) ? check(QS[i]) : '';   // 條件題沒問的不檢查
      if (err) { state.back = SUBMIT; go(i + 1); showMsg('這題還沒填好：' + err); return; }
    }
    // 按了「沒有任何勞保、農保紀錄」：只送身分證兩張（資料表多一行 NO_LABOR_LINE）；她不拍身分證（10/28）：不送身分證
    var list = (state.noId ? [] : [{ k: 'idFront', kind: '身分證正面' }, { k: 'idBack', kind: '身分證反面' }])
      .concat(state.noLabor ? [] : state.docs.map(function (x) { return { k: x.k, kind: '勞保資料' }; }));
    busy = true;
    makeFiles(list, function (out, gone) {
      busy = false;
      if (!out) { fileGone(gone.k); return; }
      var data = { '送出時間': nowTW(), '姓名': nameOf(), '手機': textOf(qById('phone')), '梯次': state.batch['梯次'],
        '資料表': buildText(), '檔案': out };
      // 上次讀取失敗、資料已經存了：這次送的跟存進去的一模一樣才帶編號（不會多存一列）。改過答案、梯次、照片、勞保檔就不帶、
      // 存成新的一列：帶編號雲端就不再存，試算表那一列會停在舊的答案（舊的那列之後她產出文件時標重複；KNOWN 135）
      if (state.pend && sigOf(data) === state.pendSig) data['編號'] = state.pend;
      if (!API) {
        console.log('測試模式：沒有連雲端服務。要送出的資料（檔案內容省略）：\n' + JSON.stringify(preview(data), null, 2));

    if (q) {
      h += '<p class="lead">請大家用手機的相機（或 LINE）<span class="nw">掃這個 QR code：</span></p>' +
        '<img class="gqr" src="data:image/png;base64,' + esc(str(q.png)) + '" alt="報名用的 QR code">' +
        '<p class="lead"><b>' + esc(str(q['梯次'])) + '</b> 這一梯<span class="nw">｜今天（' + esc(str(q['日期']).slice(4)) + '）整天有效</span></p>' +
        '<div id="gcount">' + gCountHTML() + '</div>' +
        '<details class="more"><summary>掃不到的話：用 LINE 傳連結</summary><p class="hint">複製下面的連結，貼到 LINE 群組，請她們點開。</p>' +
        '<input class="gurl" id="gurl" readonly value="' + esc(str(q['網址'])) + '" aria-label="報名連結">' +
        '<button type="button" class="btn btn2 sm" data-act="gCopy">複製連結</button></details>' +
        '<div id="msg" role="alert"></div><button type="button" class="btn btn2" data-act="gQr">換一梯</button>';
    } else {
      h += '<p class="lead">選要報名的梯次，<span class="nw">會出現一個 QR code，</span><span class="nw">大家用自己的手機掃。</span></p>';
      if (gq.qrErr) h += gErrBox(gWhy(gq.qrErr, '產生 QR code') + (RETRY[gq.qrErr.code] ? '\n請再點一次梯次。' : ''), '');
      if (gq.err) h += gErrBox(gWhy(gq.err, '讀取梯次'), RETRY[gq.err.code] ? 'gQrBatches' : '');
      else if (!gq.batches) h += '<div class="box warn" role="status"><p>正在讀取梯次，請稍等…</p></div>';
      else if (!gq.batches.length) h += '<div class="box err"><p>目前沒有開放報名的梯次。</p></div>';
      else if (gq.busy) h += '<div class="box warn" role="status"><p>正在產生 QR code，請稍等…</p></div>';
      else h += '<div class="opts">' + gq.batches.map(function (b, i) {
        return '<button type="button" class="opt bt" data-act="gPick" data-i="' + i + '"><span class="t">' +
          '<span class="b1"><span>' + esc(str(b['梯次'])) + '</span> <span>' + esc(str(b['上課時間'])) + '</span></span>' +
          '<span class="b2">地點：' + esc(b['上課地點'] || '（未定）') + '</span></span></button>';
      }).join('') + '</div>';
    }
    return h + '<div class="foot"><button type="button" class="linkbtn" data-act="gExit">回報名畫面</button></div>';
  }
  function gCountHTML() {
    if (!gq.qr || !gList) return '';
    var n = arr(gList['人們']).filter(function (p) { p = obj(p); return p['今天'] && p['梯次'] === gq.qr['梯次']; }).length;
    return '<p class="hint">這一梯今天已經有 <b>' + n + '</b> 位在手機上送出了<span class="nw">（每 20 秒更新）</span>。</p>';
  }
  function gCopy() {
    var el = document.getElementById('gurl'), url = el ? el.value : '';
    if (!url) return;
    function ok() { showMsg('連結複製好了，可以貼到 LINE 群組。', 'ok'); }
    function manual() { try { el.focus(); el.select(); } catch (e) { /* 略過 */ } showMsg('請按鍵盤的 Ctrl＋C（Mac：⌘＋C）複製上面選起來的連結。', 'warn'); }
    try { navigator.clipboard.writeText(url).then(ok, manual); } catch (e) { manual(); }
  }

  // 多人一起報名的按鈕（click 的 switch 沒有的 data-act 都到這裡）
  function gAct(act, el) {
    if (G_GUARDED[act] && Date.now() - shownAt < GUARD_MS) return;
    if (act === 'gSend') gSend();
    else if (act === 'gNo') { var a = document.getElementById('ask'); if (a) a.innerHTML = ''; }
    else if (act === 'gLoad') gLoad(Number(el.getAttribute('data-no')));
    else if (act === 'gLoadYes') gLoad(Number(el.getAttribute('data-no')), true);
    else if (act === 'gLoadNo') { gLoadErr = ''; setHTML('glist', gListHTML()); }
    else if (act === 'gSwitch') { hideMsg(); go(0); }   // 換人：回名單，正在幫的那位先放著（10/23）
    else if (act === 'gBackTo') { gLoadErr = ''; go(nextGap(1)); }   // 繼續幫她：回到還沒補的那一題
    else if (act === 'gReload') { gLoadErr = ''; gListLoad(true); }
    else if (act === 'gQr') gQrOpen();
    else if (act === 'gQrBatches') { gQrBatches(); render(); }
    else if (act === 'gPick') gQrMake(Number(el.getAttribute('data-i')));
    else if (act === 'gCopy') gCopy();
    else if (act === 'gExit') { view = 'screen'; render(); try { window.scrollTo(0, 0); } catch (e) { /* 舊瀏覽器 */ } }
  }
  // 店裡電腦：開場頁、QR 畫面開著的時候，名單每 20 秒更新（切到別的分頁、30 分鐘沒人動滑鼠鍵盤就先停，同列印站；一動就照常）
  if (!TOUCH && !G_TOKEN && API) setInterval(function () { if (!document.hidden && Date.now() - stActive < ST_IDLE) gAfterRender(); }, G_EVERY);

  // ---------- 結束、下一位學員、回確認頁（都要再按一次確定） ----------
  function ask(kind) {
    var el = document.getElementById('ask');
    if (!el) return;
    // 試算表上的狀態：讀取時寫的（缺必填＝要確認，其他＝待核對）；之後產生被 409「要確認」退回過，雲端改寫成要確認
    // （預覽 /api/judge、其他 409 不寫試算表，所以不看最新的 J()）
    var st = str(J0()['結果']) === '要確認' || state.need ? '要確認' : '待核對', t;
    if (kind === 'next') t = ['文件都印好、學員都簽好名了嗎？\n按「確定」會清掉這台電腦上這位學員的資料（照片、勞保、申請文件）。', '確定，下一位學員', '還沒，回去'];
    else if (kind === 'end') t = ['確定先結束嗎？\n資料已經存起來了（編號 ' + state.rid + '，狀態「' + st + '」）。這一頁改的地方不會存。' +
      '\n按「確定」會清掉這台電腦上這位學員的資料。', '確定，換下一位學員', '不要，回去'];
    else t = ['回確認頁改的話，要重新讀取一次。\n這一頁改的地方不會留著。', '確定，回確認頁', '不要，留在這裡'];
    el.innerHTML = '<div class="box warn"><p>' + escBr(t[0]) + '</p>' +
      '<button type="button" class="btn" data-act="askNo">' + esc(t[2]) + '</button>' +
      '<button type="button" class="btn btn-danger" data-act="askYes" data-k="' + kind + '">' + esc(t[1]) + '</button></div>';
    scrollToEl(el);
  }
  function askYes(kind) {
    if (kind !== 'reedit') { doRestart('上一位學員的資料已經從這台電腦清掉了。'); return; }
    state.rid = 0; state.read = null; state.jd = null; state.fix = null; state.out = null; state.sheet = '';
    resetReview();
    go(SUBMIT);
  }

  // ---------- 重新填寫（要再按一次確定） ----------
  function askRestart() {
    var f = document.getElementById('foot');
    if (!f) return;
    f.innerHTML = '<div class="box warn"><p>確定要清掉全部答案和照片，從頭開始嗎？</p>' +
      '<button type="button" class="btn" data-act="restartNo">不要，回去繼續</button>' +
      '<button type="button" class="btn btn-danger" data-act="restartYes">確定清掉，重新填寫</button></div>';
    scrollToEl(f);
  }
  function cancelRestart() {
    var f = document.getElementById('foot');
    if (f) f.outerHTML = footHTML(f.getAttribute('data-big') === '1');
  }
  function doRestart(msg) {
    wipe();
    Object.keys(files).forEach(dropFile);
    state = fresh();
    view = 'screen';
    confirmChecked = false; working = ''; docsLost = 0; pdfLost = false;
    batches = null; batchErr = null; batchGone = '';
    resetReview();
    notice = msg || '';
    go(0);
  }

  // ---------- 事件 ----------
  function actEl(t) {
    while (t && t !== app) {
      if (t.getAttribute && t.getAttribute('data-act')) return t;
      t = t.parentNode;
    }
    return null;
  }
  var GUARDED = { start: 1, resume: 1, opt: 1, next: 1, back: 1, send: 1, edit: 1, batch: 1, gen: 1, codeOk: 1, endAsk: 1, nextAsk: 1, reeditAsk: 1,
    station: 1, stPrint: 1, retry: 1, noLabor: 1, noId: 1, useId: 1 };

  app.addEventListener('click', function (e) {
    var el = actEl(e.target);
    if (!el || busy) return;
    var act = el.getAttribute('data-act');
    if (GUARDED[act] && Date.now() - shownAt < GUARD_MS) return;
    switch (act) {
      case 'start': go(1); break;
      case 'resume': resume(); break;
      case 'opt': onOpt(Number(el.getAttribute('data-i'))); break;
      case 'next': onNext(); break;
      case 'back': onBack(); break;
      case 'chk': onChk(el); break;
      case 'send': onSubmit(); break;
      case 'edit': state.back = SUBMIT; go(Number(el.getAttribute('data-q'))); break;
      case 'undoc': undoc(el.getAttribute('data-k')); break;
      case 'noLabor': onNoLabor(); break;
      case 'noId': onNoId(); break;
      case 'useId': onUseId(); break;
      case 'batch': onBatch(Number(el.getAttribute('data-i'))); break;
      case 'reloadBatches': loadBatches(); render(); break;
      case 'code': askCode('change'); break;
      case 'codeOk': onCodeOk(); break;
      case 'codeCancel': view = codeBack; render(); break;
      case 'gen': onGen(); break;
      case 'pick': onPick(el.getAttribute('data-k'), Number(el.getAttribute('data-i'))); break;
      case 'open': onOpen(el.getAttribute('data-k')); break;
      case 'job': onJob(el.getAttribute('data-k')); break;
      case 'jobNew': onJobNew(); break;
      case 'own': onOwn(el.getAttribute('data-v')); break;
      case 'after': onAfter(el.getAttribute('data-v')); break;
      case 'leave': onLeave(Number(el.getAttribute('data-i'))); break;
      case 'title': onTitle(Number(el.getAttribute('data-i'))); break;
      case 'duty': onDuty(Number(el.getAttribute('data-i'))); break;
      case 'gov': onGov(el.getAttribute('data-v')); break;
      case 'want': onWant(Number(el.getAttribute('data-i'))); break;
      case 'seen': onSeen(); break;
      case 'retry': retry(el); break;
      case 'print': printPdf(el.getAttribute('data-k')); break;
      case 'toReview': go(REVIEW); break;
      case 'endAsk': ask('end'); break;
      case 'nextAsk': ask('next'); break;
      case 'reeditAsk': ask('reedit'); break;
      case 'askNo': document.getElementById('ask').innerHTML = ''; break;
      case 'askYes': askYes(el.getAttribute('data-k')); break;
      case 'restart': askRestart(); break;
      case 'restartNo': cancelRestart(); break;
      case 'restartYes': doRestart(); break;
      case 'station': openStation(); break;
      case 'stReload': stWake(true); break;
      case 'stPrint': stPrint(Number(el.getAttribute('data-no')), el.getAttribute('data-kind')); break;
      case 'stExit': closeStation(); break;
      default: gAct(act, el);   // 多人一起報名（10/22）的按鈕：g 開頭
    }
  });

  app.addEventListener('input', function (e) {
    var t = e.target, fp = t && t.getAttribute && t.getAttribute('data-fix');
    if (fp && state.fix) {   // 核對頁改欄位（不整頁重畫，游標才不會跑掉）
      setFix(fp, t.value);
      if (BASIC.indexOf(fp) >= 0) { unsee(); paintBasic(fp); paintSeen(); }   // 基本資料改了：要請她再看一次
      // 切結書的日期跟著變的格子（新增那份的起迄、勞保每一列）：切結書要請她再看一次（10/22 起她看過連切結書一起確認）
      else if (/^(ng\.(起|迄)|md\.|nb\.)/.test(fp)) { unsee('切結書的日期跟著變了，要請她再看一次、再唸一次。'); setHTML('seenbtn', seenBtnHTML()); }
      save();
      autoGrow(t);
      paintFix(fp);
      paintGen();
      clearErr();
      hideMsg();
      if (fp === '出生日期' || fp === 'ng.迄') setHTML('leaveage', ageHTML());
      judgeSoon();
      return;
    }
    var f = t && t.getAttribute && t.getAttribute('data-field');
    if (!f) return;
    state.a[f] = t.value;
    save();
    hideMsg();
    autoGrow(t);
    var q = curQ();
    var b = document.getElementById('next');
    if (q && b) b.textContent = nextLabel(q);
  });

  // 拍好照片、選好檔案；核對頁的日期、字號打完整理格式
  app.addEventListener('change', function (e) {
    var t = e.target, fp = t && t.getAttribute && t.getAttribute('data-fix');
    if (fp && state.fix) {
      var v = normFix(fp, t.value);
      if (v !== t.value) {
        t.value = v; setFix(fp, v); save(); paintFix(fp);
        if (BASIC.indexOf(fp) >= 0) { paintBasic(fp); paintSeen(); }
      }
      return;
    }
    var q = t && t.getAttribute && qById(t.getAttribute('data-file') || '');
    if (!q || !t.files || !t.files[0]) return;
    var list = Array.prototype.slice.call(t.files);
    try { t.value = ''; } catch (err) { /* 舊瀏覽器 */ }   // 清掉，同一個檔再選一次也會觸發
    hideMsg();
    if (q.type === 'docs') takeDocs(q, list);
    else takeFile(q, list[0]);
  });

  // 核對頁「勞保每一列（AI 讀錯才改）」展開、收起：記著，整頁重畫時照舊
  app.addEventListener('toggle', function (e) { if (e.target && e.target.id === 'lbmore') lbOpen = e.target.open; }, true);

  // 單行輸入框按 Enter＝下一題；通關碼按 Enter＝確定（打中文選字時不算）
  app.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.keyCode === 13) && !e.isComposing && e.keyCode !== 229) {
      var t = e.target;
      if (t && t.id === 'f_code') { e.preventDefault(); if (!busy) onCodeOk(); return; }
      if (t && t.tagName === 'INPUT' && t.getAttribute('data-field')) {
        e.preventDefault();
        var to = /_from$/.test(t.id) && document.getElementById(t.id.replace(/_from$/, '_to'));   // 「從」按 Enter 跳到「到」
        if (to) { try { to.focus(); } catch (err) { /* 略過 */ } return; }
        if (Date.now() - shownAt >= GUARD_MS) onNext();
      }
    }
  });

  // 等雲端服務的時候不小心按到重新整理、關掉：先問一下
  window.addEventListener('beforeunload', function (e) {
    if (view === 'wait' || view === 'gsend') { e.preventDefault(); e.returnValue = ''; }
  });

  // 列印站：有人在用就算醒著；切回這個分頁馬上更新；網址改成（或按上一頁離開）#列印站 就進出列印站
  ['mousemove', 'mousedown', 'keydown', 'touchstart', 'wheel'].forEach(function (t) { document.addEventListener(t, stWake, { passive: true }); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) stWake(true); });
  window.addEventListener('hashchange', function () {
    var inStation = view === 'station' || (view === 'code' && codeBack === 'station');
    if (atStation() && !inStation && view !== 'wait') openStation();
    else if (!atStation() && inStation) closeStation();
  });

  // ---------- 開始 ----------
  // 手機一起報名、LINE 裡打開（長輩常用 LINE 掃 QR）：網址加 openExternalBrowser=1 請 LINE 改用手機的瀏覽器開（拍照、關掉再打開
  // 接著填才可靠；同心得錄音，只試一次）
  if (G_TOKEN && /\bLine\//i.test(UA) && !/[?&]openExternalBrowser=1/.test(location.search)) {
    try { location.replace(location.pathname + (location.search ? location.search + '&' : '?') + 'openExternalBrowser=1' + location.hash); return; } catch (e) { /* 照常開 */ }
  }
  loadCode();
  var saved = load();
  OLD_KEYS.forEach(function (k) { try { window.localStorage.removeItem(k); } catch (e) { /* 略過 */ } });
  if (saved) state = saved;
  if (G_TOKEN) gInit();   // 手機一起報名：換了一張 QR、上次已經送出 → 新的一位；背景問雲端這張 QR 能不能用
  var going = state.pos >= 1 && !state.g;   // 手機上已經送出（state.g）：直接是「你是第 N 號」
  function start() {
    view = going ? 'welcome' : 'screen';
    if (codeMissing()) { codeWhy = 'first'; codeBack = view; view = 'code'; }
    render();
  }
  function begin() {
    begun = true;
    if (!going) { idbClear(); start(); }   // 沒有做到一半的：這台電腦裡如果還留著舊檔，清掉
    else restoreFiles(start);              // 做到一半的：先把照片、檔案拿回來再顯示
  }
  if (atStation()) openStation();          // 列印站的書籤：做到一半的報名等離開列印站再接
  else begin();
})();
</script>
</body>
</html>
