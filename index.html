  // 送出內容的指紋（姓名、手機、梯次、資料表、每個檔案；送出時間、填寫日期不算）：一樣的內容一定一樣，改了一個字、換了檔案就不一樣
  function sigOf(d) {
    var parts = [d['姓名'], d['手機'], d['梯次'], str(d['資料表']).replace(/^填寫日期：.*$/m, '')], h = 0, n = 0;
    arr(d['檔案']).forEach(function (f) { parts.push(f['種類'], f['mime'], f['base64']); });
    if (d['事先建檔']) parts.push('事先建檔', d['事先建檔']);   // 從名單點進來的（11/25）：沒帶的指紋跟以前一樣
    parts.forEach(function (s) {
      s = str(s);
      for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
      h = (h * 31 + 1) | 0;   // 欄跟欄隔開
      n += s.length + 1;

    return n + ':' + h;
  }
  function gotRead(d) {

  // 檔案轉成 base64（照片已經縮小過）；list：[{k, kind}]；讀不到的檔 → done(null, 那一個)
  function makeFiles(list, done) {

    (function step() {
      if (i === list.length) { done(out); return; }
      var it = list[i++], f = files[it.k], r = new FileReader();
      if (!f) { done(null, it); return; }
      r.onload = function () { out.push({ '種類': it.kind, 'mime': f.mime, 'base64': String(r.result).split(',')[1] || '' }); step(); };
      r.onerror = function () { done(null, it); };
      r.readAsDataURL(f.blob);
    })();
  }

  var MUST = [['姓名', '姓名（身分證）'], ['身分證字號', '身分證字號（身分證）'], ['出生日期', '出生日期（身分證）'], ['戶籍地址', '戶籍地址'], ['通訊地址', '通訊地址']];

  function fixOut() {

  // 舊雲端：改了勞保日期、備註，最後一家公司換了，職稱就用新判讀的；變成沒有公司、零工四格還空著，就用新判讀預填的
  function rejudged(j) {

  function preUse() { return !!(state && state.pre && !state.pre.own && state.pre.n > 0); }   // 用帶入的勞保（還沒改成自己重傳）

  function pRowHTML(p) {

  function pAskHTML(all) {   // 這台電腦上有人做到一半：先問（同 LINE 名單）
    var p = obj(all.filter(function (x) { return str(x.id) === pAsk; })[0]), to = str(p['姓名']) || '她', now = nameOf();

  function pPick(id, sure) {
    if (!P_ID.test(str(id)) || pLoading) return;
    if (state.pre && state.pre.id === id) { pAsk = ''; view = 'screen'; go(step(1, 1)); return; }   // 點的是正在做的那一位：接著做
    if (!sure && (Object.keys(state.a).length || Object.keys(files).length || state.docs.length || state.noLabor || state.rid)) {
      pAsk = id; pLoadErr = '';
      setHTML('plistbox', pRowsHTML());
      scrollToEl(document.getElementById('pask'));

    }
    pLoading = id; pAsk = ''; pLoadErr = '';
    setHTML('plistbox', pRowsHTML());
    api('GET', '/api/preload/load?id=' + encodeURIComponent(id), null, WAIT_MS.batches, function (r) {
      pLoading = '';

  function pTake(d) {

    wipe();
    state = fresh();
    state.a.name = nm;
    state.a.phone = str(d['手機']);
    state.pre = { id: str(d.id), n: n, nm: nm.slice(0, 100), own: n < 1 };
    var b = obj(d['梯次']);   // 名單上那一梯（11/26）：雲端只在那一梯能報時回（不能報的載入就擋了、講原因）
    if (str(b['梯次']) && b['狀態'] === '開放報名') { state.batch = snap(b); state.pre.cb = str(b['梯次']); }

    view = 'screen'; confirmChecked = false; working = ''; docsLost = 0; pdfLost = false;
    batches = null; batchErr = null; batchGone = ''; lateOpen = null;

    go(step(1, 1));

  function onPreOwn() {   // 勞保那一步「改成自己重傳」：照一般的上傳（選檔、或沒有任何紀錄）

  // ---- 店裡電腦：多人一起報名的 QR（選梯次 → 大大的 QR，今天有效）----
  function gQrOpen() {
    if (codeMissing()) { askCode('first'); return; }
    view = 'gqr';
    gq = { batches: null, err: null, qr: null, qrErr: null, busy: false };
    render();
    try { window.scrollTo(0, 0); } catch (e) { /* 舊瀏覽器 */ }
    gQrBatches();
  }
  function gQrBatches() {
    gq.err = null;
    gq.batches = null;
    api('GET', '/api/batches', null, WAIT_MS.batches, function (r) {
      if (r.ok) noteWriter(r);   // 寫手（KNOWN 182）：一樣記下是哪位寫手
      if (view !== 'gqr') return;
      if (!r.ok) { if (codeRejected(r)) return; gq.err = r; render(); return; }
      var t = todayTW();
      gq.batches = arr(r.data['梯次']).map(obj).filter(function (b) { var d = normDate(b['開課日']); return b['狀態'] === '開放報名' && d && d >= t; })
        .sort(function (x, y) { return normDate(x['開課日']) < normDate(y['開課日']) ? -1 : normDate(x['開課日']) > normDate(y['開課日']) ? 1 : 0; });
      render();
    });
  }
  function gQrMake(i) {
    var b = arr(gq.batches)[i];
    if (!b || gq.busy) return;
    gq.busy = true; gq.qr = null; gq.qrErr = null;
    render();
    api('GET', '/api/group/qr?' + encodeURIComponent('梯次') + '=' + encodeURIComponent(str(b['梯次'])) + '&' + encodeURIComponent('網址') + '=' +
      encodeURIComponent(location.origin + location.pathname), null, G_WAIT.qr, function (r) {
      gq.busy = false;
      if (view !== 'gqr') return;
      if (r.ok) { gq.qr = obj(r.data); gListAt = 0; }
      else { if (codeRejected(r)) return; gq.qrErr = r; }

      try { window.scrollTo(0, 0); } catch (e) { /* 舊瀏覽器 */ }

  function gQrHTML() {

      else {   // 分區（KNOWN 199）：這時還沒有學員、不知道住哪一區 → 先選全部，寫手按了才換（gq.rg）
        var tabs = BATCH_REGIONS === true ? regionTabs(gq.batches) : null;

  function gCopy() {

  // 多人一起報名的按鈕（click 的 switch 沒有的 data-act 都到這裡）
  function gAct(act, el) {
    if (G_GUARDED[act] && Date.now() - shownAt < GUARD_MS) return;
    if (act === 'gSend') gSend();
    else if (act === 'gNo') { var a = document.getElementById('ask'); if (a) a.innerHTML = ''; }
    else if (act === 'gLoad') gLoad(Number(el.getAttribute('data-no')));
    else if (act === 'gLoadYes') gLoad(Number(el.getAttribute('data-no')), true);
    else if (act === 'gLoadNo') { gLoadErr = ''; setHTML('glist', gListHTML()); }
    else if (act === 'gSwitch') { hideMsg(); go(0); }   // 換人：回名單，正在幫的那位先放著（10/23）
    else if (act === 'gBackTo') { gLoadErr = ''; go(nextGap(1)); }   // 繼續幫她：回到還沒補的那一題
    else if (act === 'gReload') { gLoadErr = ''; gListLoad(true); }
    else if (act === 'gLine') lLoad(el.getAttribute('data-id'));
    else if (act === 'gLineYes') lLoad(el.getAttribute('data-id'), true);
    else if (act === 'gLineNo') {   // #line= 打開時這台電腦上有人做到一半：回到她原本的畫面（「歡迎回來」）
      lErr = ''; lAsk = '';
      if (lineBack > 0) { state.pos = lineBack; lineBack = -1; view = 'welcome'; render(); } else lPaint();
    }
    else if (act === 'gLineReload') { lErr = ''; lErrList = false; lListLoad(true); }
    else if (act === 'lPage' || act === 'lHome') {   // LINE 報名名單（第二層）進出
      if (act === 'lHome') { lAsk = ''; if (!lErrList) lErr = ''; }
      view = act === 'lPage' ? 'lline' : 'screen';
      render();
      try { window.scrollTo(0, 0); } catch (e) { /* 舊瀏覽器 */ }
    }
    else if (act === 'pPage' || act === 'pHome') {   // 已有勞保資料的學員（第二層，11/25）進出
      pAsk = ''; pLoadErr = '';
      view = act === 'pPage' ? 'plist' : 'screen';
      render();
      try { window.scrollTo(0, 0); } catch (e) { /* 舊瀏覽器 */ }
    }
    else if (act === 'pPick') pPick(el.getAttribute('data-id'));
    else if (act === 'pYes' || act === 'pRetry') pPick(el.getAttribute('data-id'), true);
    else if (act === 'pNo') { pAsk = ''; setHTML('plistbox', pRowsHTML()); }
    else if (act === 'pReload') { pLoadErr = ''; pErr = null; pListLoad(true); setHTML('plistbox', pRowsHTML()); }
    else if (act === 'preOwn') onPreOwn();
    else if (act === 'preUse') onPreUse();
    else if (act === 'pNew' || act === 'pNewNo') { pNewAsk = act === 'pNew'; setHTML('pstart', pStartHTML()); }
    else if (act === 'pNewYes') { pNewAsk = false; doRestart(); go(step(1, 1)); }   // 清掉從名單點進來的那一位，全新報名從第 1 題開始
    else if (act === 'gQr') gQrOpen();
    else if (act === 'gQrBatches') { gQrBatches(); render(); }
    else if (act === 'gPick') gQrMake(Number(el.getAttribute('data-i')));
    else if (act === 'gRg') { gq.rg = el.getAttribute('data-r'); render(); }   // QR 梯次清單的區按鈕（KNOWN 199）
    else if (act === 'gCopy') gCopy();
    else if (act === 'gExit') { view = 'screen'; render(); try { window.scrollTo(0, 0); } catch (e) { /* 舊瀏覽器 */ } }

  // 店裡電腦：開場頁、QR 畫面開著的時候，名單每 20 秒更新（切到別的分頁、30 分鐘沒人動滑鼠鍵盤就先停，同列印站；一動就照常）
  if (!TOUCH && !G_TOKEN && API) setInterval(function () { if (!document.hidden && Date.now() - stActive < ST_IDLE) gAfterRender(); }, G_EVERY);

  // ---------- 結束、下一位學員、回確認頁（都要再按一次確定） ----------
  function ask(kind) {
    var el = document.getElementById('ask');
    if (!el) return;
    // 試算表上的狀態：讀取時寫的（缺必填＝要確認，其他＝待核對）；之後產生被 409「要確認」退回過，雲端改寫成要確認
    // （預覽 /api/judge、其他 409 不寫試算表，所以不看最新的 J()）
    var st = str(J0()['結果']) === '要確認' || state.need ? '要確認' : '待核對', t;
    if (kind === 'next') t = ['文件都印好、學員都簽好名了嗎？\n按「確定」會清掉這台電腦上這位學員的資料（照片、勞保、申請文件）。', '確定，下一位學員', '還沒，回去'];
    else if (kind === 'end') t = ['確定先結束嗎？\n資料已經存起來了（編號 ' + state.rid + '，狀態「' + st + '」）。這一頁改的地方不會存。' +
      '\n按「確定」會清掉這台電腦上這位學員的資料。', '確定，換下一位學員', '不要，回去'];
    else t = ['回確認頁改的話，要重新讀取一次。\n這一頁改的地方不會留著。', '確定，回確認頁', '不要，留在這裡'];
    el.innerHTML = '<div class="box warn"><p>' + escBr(t[0]) + '</p>' +
      '<button type="button" class="btn" data-act="askNo">' + esc(t[2]) + '</button>' +
      '<button type="button" class="btn btn-danger" data-act="askYes" data-k="' + kind + '">' + esc(t[1]) + '</button></div>';
    scrollToEl(el);
  }
  function askYes(kind) {
    if (kind !== 'reedit') { doRestart('上一位學員的資料已經從這台電腦清掉了。'); return; }
    state.rid = 0; state.read = null; state.jd = null; state.fix = null; state.out = null; state.sheet = ''; state.made = false;
    resetReview();
    go(SUBMIT);
  }

  // ---------- 重新填寫（要再按一次確定） ----------
  function askRestart() {
    var f = document.getElementById('foot');
    if (!f) return;
    f.innerHTML = '<div class="box warn"><p>確定要清掉全部答案和照片，從頭開始嗎？</p>' +
      '<button type="button" class="btn" data-act="restartNo">不要，回去繼續</button>' +
      '<button type="button" class="btn btn-danger" data-act="restartYes">確定清掉，重新填寫</button></div>';
    scrollToEl(f);
  }
  function cancelRestart() {
    var f = document.getElementById('foot');
    if (f) f.outerHTML = footHTML(f.getAttribute('data-big') === '1');
  }
  function doRestart(msg) {
    wipe();
    Object.keys(files).forEach(dropFile);
    state = fresh();
    view = 'screen';
    confirmChecked = false; working = ''; docsLost = 0; pdfLost = false;
    batches = null; batchErr = null; batchGone = ''; lateOpen = null;
    resetReview();
    notice = msg || '';
    go(0);
  }

  // ---------- 事件 ----------
  function actEl(t) {
    while (t && t !== app) {
      if (t.getAttribute && t.getAttribute('data-act')) return t;
      t = t.parentNode;
    }
    return null;
  }
  var GUARDED = { start: 1, resume: 1, opt: 1, next: 1, back: 1, send: 1, edit: 1, batch: 1, gen: 1, codeOk: 1, endAsk: 1, nextAsk: 1, reeditAsk: 1,
    station: 1, stPrint: 1, retry: 1, noLabor: 1, noId: 1, useId: 1, noAddr: 1, useAddr: 1, redo: 1, dl: 1 };

  app.addEventListener('click', function (e) {
    var el = actEl(e.target);
    if (!el || busy) return;
    var act = el.getAttribute('data-act');
    if (GUARDED[act] && Date.now() - shownAt < GUARD_MS) return;
    switch (act) {
      case 'start': go(1); break;
      case 'resume': resume(); break;
      case 'opt': onOpt(Number(el.getAttribute('data-i'))); break;
      case 'next': onNext(); break;
      case 'back': onBack(); break;
      case 'chk': onChk(el); break;
      case 'send': onSubmit(); break;
      case 'edit': state.back = SUBMIT; go(Number(el.getAttribute('data-q'))); break;
      case 'undoc': undoc(el.getAttribute('data-k')); break;
      case 'noLabor': onNoLabor(); break;
      case 'noId': onNoId(); break;
      case 'useId': onUseId(); break;
      case 'noAddr': onNoAddr(); break;
      case 'useAddr': onUseAddr(); break;
      case 'batch': onBatch(Number(el.getAttribute('data-i'))); break;
      case 'batchRg': state.rg = el.getAttribute('data-r'); keepRegion(state.rg); save(); render(); break;   // 選梯次的區按鈕（KNOWN 199）
      case 'reloadBatches': loadBatches(); render(); break;
      case 'code': askCode('change'); break;
      case 'codeOk': onCodeOk(); break;
      case 'codeCancel': view = codeBack; render(); break;
      case 'writerSwitch': switchWriter(); break;
      case 'gen': onGen(); break;
      case 'pick': onPick(el.getAttribute('data-k'), Number(el.getAttribute('data-i'))); break;
      case 'open': onOpen(el.getAttribute('data-k')); break;
      case 'job': onJob(el.getAttribute('data-k')); break;
      case 'jobNew': onJobNew(); break;
      case 'own': onOwn(el.getAttribute('data-v')); break;
      case 'after': onAfter(el.getAttribute('data-v')); break;
      case 'leave': onLeave(Number(el.getAttribute('data-i'))); break;
      case 'title': onTitle(Number(el.getAttribute('data-i'))); break;
      case 'duty': onDuty(Number(el.getAttribute('data-i'))); break;
      case 'gov': onGov(el.getAttribute('data-v')); break;
      case 'want': onWant(Number(el.getAttribute('data-i'))); break;
      case 'seen': onSeen(); break;
      case 'retry': retry(el); break;
      case 'print': printPdf(el.getAttribute('data-k')); break;
      case 'toReview': go(REVIEW); break;
      case 'redo': onRedo(); break;
      case 'pvOpen': onPvOpen(el.getAttribute('data-k')); break;
      case 'pvSet': onPvSet(el.getAttribute('data-k'), el.getAttribute('data-v')); break;
      case 'pvWhy': onPvWhy(el.getAttribute('data-v')); break;
      case 'pvKind': onPvKind(el.getAttribute('data-v')); break;
      case 'pvAuto': onPvAuto(el.getAttribute('data-k')); break;
      case 'pvTo': onPvTo(el.getAttribute('data-v')); break;
      case 'pvAllBlank': onPvAllBlank(); break;
      case 'pvAllAuto': onPvAllAuto(); break;
      case 'pvDone': onPvDone(); break;
      case 'endAsk': ask('end'); break;
      case 'secGo': secGo(Number(el.getAttribute('data-i'))); break;
      case 'nextAsk': ask('next'); break;
      case 'reeditAsk': ask('reedit'); break;
      case 'askNo': document.getElementById('ask').innerHTML = ''; break;
      case 'askYes': askYes(el.getAttribute('data-k')); break;
      case 'restart': askRestart(); break;
      case 'restartNo': cancelRestart(); break;
      case 'restartYes': doRestart(); break;
      case 'station': openStation(); break;
      case 'stReload': stWake(true); break;
      case 'stPrint': stPrint(Number(el.getAttribute('data-no')), el.getAttribute('data-kind')); break;
      case 'stExit': closeStation(); break;
      case 'dl': dlGo(el.getAttribute('data-s'), Number(el.getAttribute('data-no')), el.getAttribute('data-kind'), el.getAttribute('data-f')); break;   // 下載 PDF／Word
      default: gAct(act, el);   // 多人一起報名（10/22）的按鈕：g 開頭
    }
  });

  app.addEventListener('input', function (e) {
    var t = e.target, fp = t && t.getAttribute && t.getAttribute('data-fix');
    if (t && t.id === 'f_psearch') { pQuery = t.value; pAsk = ''; setHTML('plistbox', pRowsHTML()); return; }   // 已有勞保資料的學員：打姓名找（只換名單那一塊）
    if (fp && state.fix) {   // 核對頁改欄位（不整頁重畫，游標才不會跑掉）
      setFix(fp, t.value);
      if (fp === '通訊地址') {
        var postal = document.getElementById('x_郵遞區號');
        if (postal) postal.value = state.fix['郵遞區號'];
        paintFix('郵遞區號'); paintJudge();
      }
      if (BASIC.indexOf(fp) >= 0) { unsee(); paintBasic(fp); paintSeen(); }   // 基本資料改了：要請她再看一次
      // 切結書的日期跟著變的格子（新增那份的起迄、勞保每一列）：切結書要請她再看一次（10/22 起她看過連切結書一起確認）
      else if (/^(ng\.(起|迄)|md\.|nb\.)/.test(fp)) { unsee('切結書的日期跟著變了，要請她再看一次、再唸一次。'); setHTML('seenbtn', seenBtnHTML()); }
      else if (/^pv\./.test(fp)) {
        unsee(PV_NOTE); setHTML('seenbtn', seenBtnHTML()); secPaint();
        if (fp === 'pv.知悉親屬條款.名稱') { var kw = document.getElementById('pvkin'); if (kw) kw.innerHTML = pvKinHTML(); }
      }   // 切結書那一行打的日期、名稱（11/08）
      save();
      autoGrow(t);
      paintFix(fp);
      paintGen();
      clearErr();
      hideMsg();
      if (fp === '出生日期' || fp === 'ng.迄') setHTML('leaveage', ageHTML());
      judgeSoon();
      return;
    }
    var f = t && t.getAttribute && t.getAttribute('data-field');
    if (!f) return;
    state.a[f] = t.value;
    save();
    hideMsg();
    autoGrow(t);
    var q = curQ();
    var b = document.getElementById('next');
    if (q && b) b.textContent = nextLabel(q);
  });

  // 拍好照片、選好檔案；核對頁的日期、字號打完整理格式
  app.addEventListener('change', function (e) {
    var t = e.target, fp = t && t.getAttribute && t.getAttribute('data-fix');
    if (fp && state.fix) {
      var v = normFix(fp, t.value);
      if (v !== t.value) {
        t.value = v; setFix(fp, v); save(); paintFix(fp);
        if (BASIC.indexOf(fp) >= 0) { paintBasic(fp); paintSeen(); }
      }
      return;
    }
    var q = t && t.getAttribute && qById(t.getAttribute('data-file') || '');
    if (!q || !t.files || !t.files[0]) return;
    var list = Array.prototype.slice.call(t.files);
    try { t.value = ''; } catch (err) { /* 舊瀏覽器 */ }   // 清掉，同一個檔再選一次也會觸發
    hideMsg();
    if (q.type === 'docs') takeDocs(q, list);
    else takeFile(q, list[0]);
  });

  // 切結書「改」的格子打完、游標離開預覽那一塊：打字時晚到的預覽這時才畫（11/08）
  app.addEventListener('focusout', function (e) {
    var pv = document.getElementById('preview');
    if (!pvLate || !pv || !pv.contains(e.target) || (e.relatedTarget && pv.contains(e.relatedTarget))) return;
    pvLate = false;
    setTimeout(function () { if (!inPreview()) setHTML('preview', previewHTML()); else pvLate = true; }, 0);
  });

  // 核對頁「勞保每一列（AI 讀錯才改）」展開、收起：記著，整頁重畫時照舊
  app.addEventListener('toggle', function (e) {
    if (e.target && e.target.id === 'lbmore') lbOpen = e.target.open;
    // 截止後可補報那一塊：畫成打開時瀏覽器也會丟一次 toggle，跟畫的一樣就不算寫手按的（不然預設打開會被記成一直打開）
    else if (e.target && e.target.id === 'latemore' && e.target.open !== lateShown) lateOpen = lateShown = e.target.open;
  }, true);

  // 單行輸入框按 Enter＝下一題；通關碼按 Enter＝確定（打中文選字時不算）
  app.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.keyCode === 13) && !e.isComposing && e.keyCode !== 229) {
      var t = e.target;
      if (t && t.id === 'f_code') { e.preventDefault(); if (!busy) onCodeOk(); return; }
      if (t && t.tagName === 'INPUT' && t.getAttribute('data-field')) {
        e.preventDefault();
        var to = /_from$/.test(t.id) && document.getElementById(t.id.replace(/_from$/, '_to'));   // 「從」按 Enter 跳到「到」
        if (to) { try { to.focus(); } catch (err) { /* 略過 */ } return; }
        if (Date.now() - shownAt >= GUARD_MS) onNext();
      }
    }
  });

  // 等雲端服務的時候不小心按到重新整理、關掉：先問一下
  window.addEventListener('beforeunload', function (e) {
    if (view === 'wait' || view === 'gsend') { e.preventDefault(); e.returnValue = ''; }
  });

  // 列印站：有人在用就算醒著；切回這個分頁馬上更新；網址改成（或按上一頁離開）#列印站 就進出列印站
  ['mousemove', 'mousedown', 'keydown', 'touchstart', 'wheel'].forEach(function (t) { document.addEventListener(t, stWake, { passive: true }); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) stWake(true); });
  window.addEventListener('hashchange', function () {
    var inStation = view === 'station' || (view === 'code' && codeBack === 'station');
    if (atStation() && !inStation && view !== 'wait') openStation();
    else if (!atStation() && inStation) closeStation();
  });

  // ---------- 開始 ----------
  // 手機一起報名、LINE 裡打開（長輩常用 LINE 掃 QR）：網址加 openExternalBrowser=1 請 LINE 改用手機的瀏覽器開（拍照、關掉再打開
  // 接著填才可靠；同心得錄音，只試一次）
  if (G_TOKEN && /\bLine\//i.test(UA) && !/[?&]openExternalBrowser=1/.test(location.search)) {
    try { location.replace(location.pathname + (location.search ? location.search + '&' : '?') + 'openExternalBrowser=1' + location.hash); return; } catch (e) { /* 照常開 */ }
  }
  loadCode();
  loadWriter();
  var saved = load();
  OLD_KEYS.forEach(function (k) { try { window.localStorage.removeItem(k); } catch (e) { /* 略過 */ } });
  if (saved) state = saved;
  if (G_TOKEN) gInit();   // 手機一起報名：換了一張 QR、上次已經送出 → 新的一位；背景問雲端這張 QR 能不能用
  var going = state.pos >= 1 && !state.g;   // 手機上已經送出（state.g）：直接是「你是第 N 號」
  function start() {
    view = going ? 'welcome' : 'screen';
    if (LINE_WANT) lineOpen();
    if (codeMissing()) { codeWhy = 'first'; codeBack = view; view = 'code'; }
    render();
  }
  // 後台「開始做申請文件」打開的（#line=<id>，11/14）：網址的 #line= 拿掉（重新整理不會再載一次）；正在幫的就是她 → 照原本的接著做；
  // 不然到開場頁載入她（gAfterRender）。手機、平板不載（台中 LINE 報名只在店裡電腦做），說一句
  function lineOpen() {
    var id = LINE_WANT;
    LINE_WANT = '';
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* 網址沒改也照常 */ }
    if (!API) return;
    if (TOUCH) { if (view === 'screen' && state.pos === 0) notice = '「開始做申請文件」要用店裡的電腦打開（手機、平板不能載入保健課 LINE 報名的人）。'; return; }
    if (state.fill && state.lineId === id) return;
    lineWant = id;
    if (view === 'welcome') lineBack = state.pos;
    view = 'screen';
    state.pos = 0;
  }
  function begin() {
    begun = true;
    if (!going) { idbClear(); start(); }   // 沒有做到一半的：這台電腦裡如果還留著舊檔，清掉
    else restoreFiles(start);              // 做到一半的：先把照片、檔案拿回來再顯示
  }
  if (atStation()) openStation();          // 列印站的書籤：做到一半的報名等離開列印站再接
  else begin();
  refreshWriter();                         // 別家的網頁：背景問一次是哪位寫手（不給公司發布的那一份不問）
})();
</script>
</body>
</html>
