<script>
// 雲端服務網址（Google Cloud Run 部署後拿到的網址，例 https://gov-subsidy-xxxxxxxxxx.asia-east1.run.app，結尾不要加斜線）。
// 留空字串＝測試模式：不連網、資料不會送出（梯次用範例；按「送出，讀取資料」只在 console 印出要送的資料）。
// 本機測試：開 測試資料/假雲端服務.py，複製一份這個檔到暫存區、把複本的網址改成 'http://127.0.0.1:8767'；正本一律保持下面的正式網址
var SERVICE_URL = 'https://gov-subsidy-450277428146.asia-east1.run.app';
// 現場通關碼：true＝第一次在這台電腦打開要輸入一次（記在這台電腦），每個請求帶 X-Store-Code 標頭；
// false＝不問、不帶（雲端服務那邊的檢查也要一起拿掉）
var 需要通關碼 = true;

<!--
  現場報名網頁 v4（店裡的電腦接印表機；現場人員帶學員從頭做到尾。平板、手機也能用）
  - 不載任何外部資源：只用系統字型，CSS／JS 全部在這個檔案裡
  - 流程＝docs/規格_現場報名雲端版.md 第 0 節；API＝第 2 節；資料格式＝第 3 節
  - 資料表文字＝docs/規格_小幫手資料格式.md 第 1 節（v3 原樣）；改題目或標籤要同步改規格
  - 答案、讀取結果、核對時改的地方存在這台電腦（localStorage）；身分證照片、勞保檔、申請文件 PDF 存在 IndexedDB。
    重新整理可以接著做；按「下一位學員」「結束」「今天印不了，先換下一位」或「重新填寫」才清掉（現場通關碼留著）
  - 列印站（網址加 #列印站，店裡接印表機的電腦設成書籤）：學員在自己手機上產好文件，現場人員在這裡點她的名字列印。
    手機、平板的列印頁會叫她去列印站；列印站拿到的 PDF 只放在記憶體，不存進這台電腦
-->
<style>
:root{
  --ink:#111111;--ink2:#2b2b2b;--line:#595959;--bg:#ffffff;--soft:#efefec;
  --pri:#0b4f9c;--pri-dk:#083b75;--pri-bg:#e3edfa;
  --err:#a00000;--err-bg:#fff0f0;--warn:#7a4a00;--warn-bg:#fff4d8;--ok:#1b6a2e;--ok-bg:#ecf7ee;
  color-scheme:light
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Heiti TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:22px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
.wrap.wide{max-width:820px}
button,input,textarea{font:inherit;color:inherit;margin:0}
button{-webkit-appearance:none;appearance:none;cursor:pointer;touch-action:manipulation}
h1{font-size:32px;line-height:1.35;font-weight:800;margin:32px 0 20px}
.nw{white-space:nowrap}
.lead{font-size:24px;margin:0 0 14px}
.hint{font-size:22px;color:var(--ink2);margin:0 0 8px}
.how{font-size:22px;font-weight:700;color:var(--pri-dk);margin:0 0 14px}
.tm{margin:12px 0 0;padding:8px 12px;border:3px dashed var(--ink2);border-radius:12px;background:var(--warn-bg);font-size:20px;font-weight:800;text-align:center}

/* 上方：上一題＋第幾題 */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 0 8px}
.back{min-height:64px;padding:8px 18px 8px 12px;border:3px solid var(--ink2);border-radius:14px;background:#fff;color:var(--ink);font-size:22px;font-weight:700}
.back:active{background:var(--soft)}
.count{font-size:22px;font-weight:800;padding:6px 0 6px 12px}
.bar{height:14px;border:2px solid var(--ink2);border-radius:8px;background:#fff;overflow:hidden}
.bar span{display:block;height:100%;background:var(--pri)}

/* 題目與選項 */
.qt{font-size:30px;line-height:1.35;font-weight:800;margin:24px 0 10px}
.qt:focus{outline:none}
.opts{margin:6px 0 0}
.opt{display:flex;align-items:center;width:100%;min-height:72px;margin:0 0 14px;padding:12px 16px;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:24px;font-weight:600;line-height:1.35;text-align:left}
.opt:active{background:var(--soft)}
.mark{flex:none;display:flex;align-items:center;justify-content:center;width:38px;height:38px;margin-right:14px;border:3px solid var(--ink2);border-radius:50%;background:#fff}
.multi .mark,.chk .mark{border-radius:8px}
.mark svg{width:26px;height:26px;visibility:hidden}
.opt[aria-checked="true"]{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri);background:var(--pri-bg)}
.opt[aria-checked="true"] .mark{background:var(--pri);border-color:var(--pri)}
.opt[aria-checked="true"] .mark svg{visibility:visible}
.opt .t{flex:1;min-width:0}
.note{display:inline-block;font-size:22px;font-weight:400;color:var(--ink2)}
.sub2{display:block;margin-top:4px;font-size:20px;font-weight:600;color:var(--ink2)}

/* 梯次：一梯一個大按鈕；不能選的（額滿、已截止）灰底虛線框＋寫原因 */
.bt .t{display:block}
.b1{display:block;font-size:26px;font-weight:800}
.b2{display:block;font-size:22px;font-weight:600}
.b3{display:block;margin-top:4px;font-size:22px;font-weight:800}
.opt:disabled{border-style:dashed;border-color:#7a7a7a;background:#e6e6e6;color:#333;-webkit-text-fill-color:#333;opacity:1;cursor:not-allowed}
.opt:disabled .mark{border-color:#7a7a7a;background:#e6e6e6}

/* 輸入框 */
.flabel{display:block;font-size:22px;font-weight:800;margin:8px 0}
.field{display:block;width:100%;min-height:72px;padding:14px 16px;border:3px solid var(--ink2);border-radius:14px;background:#fff;color:var(--ink);font-size:26px;line-height:1.4;-webkit-appearance:none;appearance:none}
textarea.field{min-height:150px;resize:vertical}
.field:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri)}
.follow{margin:0 0 6px}
.code{font-size:36px;letter-spacing:.3em}

/* 提醒框（有粗框和文字，不只靠顏色） */
.box{margin:14px 0;padding:14px 16px;border:3px solid;border-radius:14px;font-size:22px;font-weight:700;line-height:1.5}
.box p{margin:0}
.box p+p,.box ul+p,.box p+ul{margin-top:8px}
.box ul{margin:0;padding-left:1.3em}
.box li{margin:4px 0}
.err{border-color:var(--err);background:var(--err-bg);color:var(--err)}
.warn{border-color:var(--warn);background:var(--warn-bg);color:var(--ink)}
.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}

/* 按鈕 */
.btn{display:block;width:100%;min-height:72px;margin:20px 0 0;padding:14px 18px;border:3px solid var(--pri);border-radius:14px;background:var(--pri);color:#fff;font-size:26px;font-weight:800;line-height:1.3;text-align:center;text-decoration:none}
.btn:active{background:var(--pri-dk)}
.btn2{background:#fff;color:var(--pri-dk)}
.btn2:active{background:var(--pri-bg)}
.btn-danger{background:#fff;border-color:var(--err);color:var(--err)}
.btn-danger:active{background:var(--err-bg)}
.btn[aria-disabled="true"]{background:#e6e6e6;border-color:#7a7a7a;border-style:dashed;color:#333}
/* 錯誤框裡有「再試一次」時，下面同一個動作的大按鈕先藏起來，畫面只留一顆 */
#msg:has([data-act="retry"]) ~ #send,#msg:has([data-act="retry"]) ~ [data-act="gen"]{display:none}
.foot{margin:40px 0 0;text-align:center}
.linkbtn{min-height:56px;padding:8px 16px;border:0;background:none;color:var(--ink2);font-size:22px;text-decoration:underline}

/* 拍照、上傳：input 藏起來，按大按鈕樣式的 label 打開相機或選檔 */
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
label.btn,.alt{cursor:pointer;-webkit-user-select:none;user-select:none}
.vh:focus-visible+label{outline:4px solid var(--pri-dk);outline-offset:3px}
.alt{display:block;width:100%;min-height:56px;margin:12px 0 0;padding:12px 8px;border:0;background:none;color:var(--pri-dk);font-size:22px;font-weight:700;text-align:center;text-decoration:underline}
.thumb{display:block;max-width:100%;max-height:45vh;margin:14px auto;border:3px solid var(--ink2);border-radius:14px}
.flist{list-style:none;margin:8px 0 0;padding:0}
.fitem{display:flex;align-items:center;gap:12px;min-height:76px;margin:0 0 12px;padding:6px 8px 6px 10px;border:3px solid var(--line);border-radius:14px}
.fthumb,.fpdf{flex:none;width:64px;height:64px;border:2px solid var(--ink2);border-radius:8px}
.fthumb{object-fit:cover}
.fpdf{display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.fname{flex:1;min-width:0;font-size:22px;font-weight:600;overflow-wrap:anywhere}

/* 確認頁：一題一列，旁邊「改」 */
.list{list-style:none;margin:8px 0 0;padding:0;border-top:2px solid #b5b5b5}
.item{display:flex;align-items:flex-start;padding:14px 0;border-bottom:2px solid #b5b5b5}
.item .txt{flex:1;min-width:0}
.k{font-size:20px;font-weight:700;color:var(--ink2)}
.v{font-size:24px;font-weight:600;overflow-wrap:anywhere}
.edit{flex:none;min-width:80px;min-height:64px;margin-left:12px;padding:0 12px;border:3px solid var(--pri);border-radius:12px;background:#fff;color:var(--pri-dk);font-size:24px;font-weight:800}
.edit:active{background:var(--pri-bg)}
.del{border-color:var(--err);color:var(--err)}
.del:active{background:var(--err-bg)}
.mini{display:inline-block;max-width:46%;max-height:120px;margin:6px 8px 0 0;border:2px solid var(--ink2);border-radius:8px;vertical-align:top}
.chk{margin-top:24px}

/* 等候 */
.spin{width:72px;height:72px;margin:24px auto;border:8px solid var(--pri-bg);border-top-color:var(--pri);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:4s}}

/* 核對頁（現場人員用：比學員畫面密一點，字還是大） */
.st{font-size:26px;font-weight:800;margin:36px 0 10px;padding-bottom:6px;border-bottom:3px solid var(--ink2)}
.st2{font-size:22px;font-weight:800;margin:18px 0 4px}
.vt{font-size:28px;font-weight:800}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:12px 0;font-size:22px}
.facts dt{font-weight:800}
.facts dd{margin:0}
.card{margin:12px 0;padding:10px 14px;border:3px solid var(--line);border-radius:14px}
.card.bad{border-color:var(--err);box-shadow:0 0 0 2px var(--err)}
.ch{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:22px;font-weight:700}
.cn{font-size:24px;font-weight:800}
.tag{display:inline-block;padding:0 8px;border:2px solid;border-radius:8px;font-size:19px;font-weight:800;line-height:1.5;white-space:nowrap}
.tbad{color:var(--err);border-color:var(--err);background:var(--err-bg)}
.tok{color:var(--ok);border-color:var(--ok)}
.tuc{color:var(--warn);border-color:var(--warn);border-style:dashed;background:var(--warn-bg)}
.tchg{color:var(--pri-dk);border-color:var(--pri-dk)}
.tneed{color:var(--err);border-color:var(--err)}
.tchg,.tneed{display:none}
.chg .tchg,.need .tneed{display:inline-block}
.fl{display:grid;grid-template-columns:4.6em minmax(0,1fr);align-items:center;gap:4px 10px;margin:10px 0}
.fk{font-size:20px;font-weight:800}
.fv{font-size:22px;font-weight:600;overflow-wrap:anywhere}
.inp{display:block;width:100%;min-height:56px;padding:8px 12px;border:3px solid var(--ink2);border-radius:12px;background:#fff;color:var(--ink);font-size:22px;line-height:1.4;-webkit-appearance:none;appearance:none}
textarea.inp{resize:vertical}
.inp:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri)}
.uc .inp{border-style:dashed;border-color:var(--warn);background:var(--warn-bg)}
.need .inp{border-color:var(--err)}
.ferr .inp{border-color:var(--err);box-shadow:0 0 0 3px var(--err)}
.tags,.ftxt{grid-column:2}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.ftxt{margin:0;font-size:20px;font-weight:800;color:var(--err)}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:0 18px}
@media (min-width:600px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.idth{display:flex;gap:12px;margin:8px 0}
.idth figure{flex:1;min-width:0;margin:0}
.idth img{display:block;max-width:100%;max-height:170px;border:2px solid var(--ink2);border-radius:8px}
.idth figcaption{font-size:20px;font-weight:700}
.chain{margin:6px 0;padding-left:1.3em;font-size:22px}
.chain li{margin:6px 0}

/* 列印頁 */
.plist{margin:6px 0;padding-left:1.4em;font-size:22px;font-weight:600}
.plist li{margin:6px 0}
.pframe{position:fixed;right:0;bottom:0;width:2px;height:2px;border:0;opacity:0;pointer-events:none}
.go{border-width:5px;border-color:var(--pri);background:var(--pri-bg);color:var(--ink);font-size:28px;font-weight:800;line-height:1.45}
.btn.sm{min-height:64px;font-size:22px}

/* 列印站（店裡的電腦）：一位一列，時間、姓名、梯次＋兩個大按鈕 */
.sbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.sbar .hint{margin:0}
.sbar .btn{width:auto;margin:0;padding:8px 28px}
.slist{list-style:none;margin:16px 0 0;padding:0}
.srow{margin:0 0 20px;padding:12px 16px 20px;border:3px solid var(--line);border-radius:14px}
.shead{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 16px;margin:0}
.stime{font-size:24px;font-weight:800}
.sname{font-size:34px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.smeta{font-size:22px;font-weight:700}
.sbtns{display:grid;grid-template-columns:minmax(0,1fr);gap:0 20px;align-items:end}
@media (min-width:700px){.sbtns{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.snote{margin:16px 0 0;font-size:20px;font-weight:800}
.sfall{margin:14px 0 0;font-size:22px;font-weight:700}
.sfall a{display:inline-block;min-height:44px;padding:6px 10px;color:var(--pri-dk)}
</style>
</head>
<body>
<main id="app" class="wrap"></main>
<noscript><p style="font-size:24px;padding:16px">這個表單需要開啟 JavaScript。請用 Chrome、Edge 或 Safari 打開。</p></noscript>
<script>
(function () {
  'use strict';

  var STORE_KEY = 'gov_subsidy.women_ai_form.v5';   // v5（10/7）：拿掉 6 題資格題，題目位置變了；v4＝現場版（勞保多檔、梯次、核對、列印）。舊版存的答案不接著用
  var OLD_KEYS = ['gov_subsidy.women_ai_form.v1', 'gov_subsidy.women_ai_form.v2', 'gov_subsidy.women_ai_form.v3',
    'gov_subsidy.women_ai_form.v4'];   // 打開就清掉
  var DB_NAME = 'gov_subsidy.women_ai_form', DB_STORE = 'files';   // IndexedDB：照片、勞保檔、申請文件
  var HEADER = '【自主訓練報名資料表 v3】';          // 資料表文字沿用 v3（規格第 1 節），不改
  var EMPTY = '（未填）';
  var API = typeof SERVICE_URL === 'string' ? SERVICE_URL.trim().replace(/\/+$/, '') : '';
  var GUARD_MS = 400;    // 換畫面後這段時間內的點擊不算（防連點點到下一題）
  var WAIT_MS = { batches: 45000, read: 120000, gen: 240000, recent: 45000, packet: 90000 };   // 讀梯次、讀取資料、產生申請文件、列印站的名單和文件最多等多久，超過當沒成功
  var MAX_EDGE = 1600, JPEG_Q = 0.8;    // 身分證照片：長邊 1600px、JPEG 0.8（v3 原樣）
  var DOC_EDGE = 2400, DOC_Q = 0.85;    // 勞保照片、截圖：長邊 2400px、JPEG 0.85（小字要看得清楚）
  var MAX_BYTES = 10 * 1024 * 1024;     // 每個檔最大 10MB
  var MAX_DOCS = 5;                     // 勞保資料最多 5 個
  var MAX_TOTAL = 20 * 1024 * 1024;     // 勞保加起來最多 20MB（整個請求要在約 30MB 內）
  var UA = navigator.userAgent || '';
  // 平板、手機（iPad 的 Safari 自稱 Mac，用觸控點數認）：拍照開相機；列印用新分頁打開 PDF。其他＝電腦
  var TOUCH = /iPad|iPhone|iPod|Android/i.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
  var CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 12.5l5 5L19.5 7" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // ---------- 題目 ----------
  // out＝輸出標籤（照規格第 1 節，不可改字；確認頁也用它當名稱）；沒有 out 的（拍照、勞保、梯次）不進資料表文字
  // 選項：t＝畫面上的字；n＝畫面上的括號補充（不輸出）；o＝輸出用字（沒寫就用 t）；show＝確認頁用字；
  //       ex＝選了就清掉其他選項；f＝選了要接著填（type text）
  function other() { return { t: '其他', f: { type: 'text', label: '請寫一下是什麼' } }; }

  var QS = [
    // 拍照：檔案存在這台電腦的 IndexedDB；fileKind＝送出時的「種類」
    { id: 'idFront', type: 'photo', fileKind: '身分證正面', title: '拍身分證正面', hint: '有大頭照的那一面' },
    { id: 'idBack', type: 'photo', fileKind: '身分證反面', title: '拍身分證反面', hint: '有地址的那一面' },
    { id: 'name', type: 'text', req: true, ac: 'name', out: '姓名',
      title: '你的姓名', hint: '跟身分證上的名字一樣' },
    { id: 'phone', type: 'text', req: true, kind: 'tel', out: '手機',
      title: '你的手機號碼', hint: '10 個數字，09 開頭' },
    { id: 'email', type: 'text', req: true, kind: 'email', out: 'Email',
      title: '你的 Email 信箱', hint: '申請表必填。看手機上登入的 Email；真的沒有，填家人的。' },
    // 戶籍地址不問：從身分證背面讀（規格 v3）
    { id: 'live', type: 'single', out: '通訊地址',
      title: '現在住的地址跟身分證上一樣嗎？', opts: [
        { t: '一樣', o: '同身分證地址', show: '跟身分證上一樣' },
        { t: '不一樣', f: { type: 'text', lines: true, req: true, raw: true, label: '請寫你現在住的地址', hint: '從縣市寫到幾號幾樓' } }
      ] },

    q.opts.forEach(function (o) {

      // 多選用「、」分隔，所以「其他」說明裡的「、」換成「，」
      if (o.f) parts.push(outT(o) + '（' + (followText(q).replace(/、/g, '，') || '未填') + '）');
      else parts.push(outT(o));
    });
    return parts.length ? parts.join('、') : EMPTY;
  }
  function buildText() {
    var lines = [HEADER, '填寫日期：' + today()];
    QS.forEach(function (q) { if (q.out) lines.push(q.out + '：' + outValue(q)); });
    lines.push('本人確認：以上都是真實狀況');
    return lines.join('\n');
  }

  // 確認頁上顯示的答案（用畫面上的白話）
  function showHTML(q) {
    if (q.type === 'photo') {
      var f = files[q.id];
      return f && f.url ? '<img class="mini" src="' + esc(f.url) + '" alt="' + esc(q.fileKind) + '的照片">' : '（還沒拍）';
    }
    if (q.type === 'docs') {
      return state.docs.length ? state.docs.map(function (x, i) { return esc((i + 1) + '. ' + x.label); }).join('<br>') : '（還沒上傳）';
    }
    if (q.type === 'batch') return state.batch ? batchLines(state.batch) : '（還沒選）';
    if (q.type === 'text') return esc(textOf(q) || EMPTY);
    if (q.type === 'single') {
      var o = optByT(q, state.a[q.id]);
      if (!o) return esc(EMPTY);
      if (o.f && o.f.type === 'text') {
        var t = followText(q);
        return esc(o.f.raw ? t || EMPTY : showT(o) + '（' + (t || '未填') + '）');
      }
      return esc(o.show || showT(o));
    }
    var parts = [];
    q.opts.forEach(function (o) { if (isSel(q, o)) parts.push(o.f ? showT(o) + '（' + (followText(q) || '未填') + '）' : showT(o)); });
    return esc(parts.length ? parts.join('、') : EMPTY);
  }
  function batchLines(b) {
    return '<b>' + esc(str(b['梯次']) + ' ' + str(b['上課時間'])) + '</b><br>地點：' + esc(b['上課地點'] || '（未定）') +
      '<br>辦訓單位：' + esc(b['辦訓單位'] || '（未定）');
  }

  // 回傳錯誤訊息；沒問題回傳空字串
  function check(q) {
    if (q.type === 'photo') {
      if (working === q.id) return '照片還在處理，請等一下。';
      if (!files[q.id]) return '請按「' + (TOUCH ? '打開相機拍照' : '選擇照片檔') + '」，拍' + q.fileKind + '。';
      return '';
    }
    if (q.type === 'docs') {
      if (working === q.id) return '檔案還在處理，請等一下。';
      if (!state.docs.length) return '勞保資料一定要上傳。\n請按「選擇檔案」。';
      var total = 0;
      state.docs.forEach(function (x) { total += x.size; });
      if (total > MAX_TOTAL) return '檔案加起來太大（超過 20MB）。\n請刪掉幾個，或改用 PDF。';
      return '';
    }
    if (q.type === 'batch') {
      if (state.batch) return '';
      return batches && !openCount() ? '目前沒有開放報名的梯次。' : '請點一個梯次。';
    }
    if (q.type === 'text') {
      var v = textOf(q);
      if (q.kind === 'tel') {
        if (!v) return '請寫你的手機號碼。';
        if (!/^09\d{8}$/.test(v)) return '號碼好像不對，請再看一下。手機號碼是 09 開頭、10 個數字。';
      } else if (q.kind === 'email') {
        if (!v) return '申請表的 Email 是必填。\n看手機上登入的 Email；真的沒有，填家人的。';
        if (!EMAIL_RE.test(v)) return 'Email 好像不完整，請再看一下。';
      } else if (q.req && !v) {
        return '這題要填喔。';
      }
      return '';
    }
    if (q.type === 'single') {
      var o = optByT(q, state.a[q.id]);
      if (!o) return '請點一個答案。';
      if (o.f && o.f.req && !followText(q)) return o.f.label + '。';
    }
    return '';
  }

  // ---------- 畫面狀態 ----------
  var app = document.getElementById('app');
  var state = fresh();
  var view = 'screen';          // screen＝一般；welcome＝回來時的歡迎畫面；code＝現場通關碼；wait＝等雲端服務；station＝列印站
  var shownAt = 0, busy = false, followKey = null;
  var confirmChecked = false;
  var files = {};               // 照片、勞保檔、申請文件（記憶體一份、IndexedDB 一份）：{ blob, mime, name, url, label }
  var working = '';             // 正在處理檔案的題目 id
  var notice = '';              // 開場頁的一次性提示
  var flash = '';               // 核對頁上方的一次性提示
  var docsLost = 0, pdfLost = false, docSeq = 0;   // 重新打開時沒拿回來的勞保檔個數、申請文件
  var batches = null, batchErr = null, batchLoading = false, batchGone = '', batchSeq = 0;   // 梯次（batchErr＝沒讀到時雲端的回應）
  var waitKind = '';

  function curQ() { return view === 'screen' && state.pos >= 1 && state.pos <= N ? QS[state.pos - 1] : null; }

  // ---------- 現場通關碼（全部集中在這一段；最上面 需要通關碼 = false 就整個不用） ----------
  var CODE_ON = typeof 需要通關碼 === 'undefined' ? true : 需要通關碼 !== false;
  var CODE_KEY = 'gov_subsidy.store_code';   // 記在這台電腦；換學員不清
  var storeCode = '', codeWhy = 'first', codeBack = 'screen';   // codeWhy：first 第一次／bad 雲端服務說不對／change 自己要換

  function loadCode() { try { storeCode = str(window.localStorage.getItem(CODE_KEY)); } catch (e) { storeCode = ''; } }
  function saveCode(c) {
    storeCode = c;
    try { if (c) window.localStorage.setItem(CODE_KEY, c); else window.localStorage.removeItem(CODE_KEY); } catch (e) { /* 存不了：這次開著還是有用 */ }
  }
  function codeMissing() { return CODE_ON && !storeCode; }
  function codeHeaders(h) { if (CODE_ON) h['X-Store-Code'] = storeCode; return h; }
  // 雲端服務回 401：通關碼不對（可能換了）→ 到通關碼畫面重新輸入；回傳 true＝處理好了
  function codeRejected(r) {
    if (!CODE_ON || r.code !== 'store_code') return false;
    askCode('bad');
    return true;
  }
  function askCode(why) {
    if (why === 'bad') saveCode('');
    codeWhy = why;
    if (view !== 'code') codeBack = view === 'welcome' || view === 'station' ? view : 'screen';
    view = 'code';
    busy = false;
    render();
    try { window.scrollTo(0, 0); } catch (e) { /* 舊瀏覽器 */ }
    var f = document.getElementById('f_code');
    if (f) { try { f.focus(); } catch (e) { /* 略過 */ } }
  }
  function codeHTML() {
    var h = '<h1>現場通關碼</h1>';
    if (codeWhy === 'bad') h += '<div class="box err"><p>現場通關碼不對（可能換了），請重新輸入。' + (codeBack === 'station' ? '' : '<br>剛剛填的資料都還在。') + '</p></div>';
    else if (codeWhy === 'change') h += '<p class="lead">請輸入新的現場通關碼。</p>';
    else h += '<p class="lead">第一次在這台電腦使用，<span class="nw">請輸入現場通關碼。</span></p>' +
      '<p class="hint">輸入一次就會記在這台電腦，<span class="nw">之後不用再輸入。</span></p>';
    h += '<label class="flabel" for="f_code">現場通關碼（6 位數字）</label>' +
      '<input type="text" id="f_code" class="field code" inputmode="numeric" maxlength="6" autocomplete="off" enterkeyhint="done">' +
      '<div id="msg" role="alert"></div>' +
      '<button type="button" class="btn" id="codeOk" data-act="codeOk">確定</button>';
    if (codeWhy === 'change' && storeCode) h += '<button type="button" class="btn btn2" data-act="codeCancel">不換了，回去</button>';
    return h;
  }
  // 按「確定」：有接雲端服務就先讀一次梯次，確認通關碼對不對（連不上就先記下來，選梯次時會再確認）
  function onCodeOk() {
    var f = document.getElementById('f_code'), v = half(f ? f.value : '').replace(/\s+/g, '');
    if (!/^\d{6}$/.test(v)) { showMsg('通關碼是 6 位數字，請再看一下。'); return; }
    if (!API) { codeDone(v, ''); return; }
    var old = storeCode, b = document.getElementById('codeOk');
    busy = true;
    hideMsg();
    if (b) b.textContent = '確認中，請稍等…';
    storeCode = v;
    api('GET', '/api/batches', null, WAIT_MS.batches, function (r) {
      busy = false;
      if (r.code === 'store_code') {
        storeCode = old;
        if (b) b.textContent = '確定';
        showMsg('通關碼不對，請再看一下。');
        return;
      }
      codeDone(v, r.ok ? '' : '還沒辦法確認通關碼對不對（連不上雲端服務），先記下來了。');
    });
  }
  function codeDone(v, warn) {
    var why = codeWhy, m = why === 'change' ? '通關碼換好了。' : why === 'bad' ? '通關碼更新好了。' : '';
    saveCode(v);
    if (codeBack === 'station') { openStation(); if (warn) showMsg(warn, 'warn'); return; }
    if (why === 'bad' && (state.pos === SUBMIT || state.pos === REVIEW)) m += '\n請再按一次下面的按鈕。';
    if (warn) m += (m ? '\n' : '') + warn;
    view = codeBack;
    if (view !== 'screen' || state.pos === 0) { notice = m; render(); return; }
    if (state.pos === SUBMIT || state.pos === REVIEW) render();   // 不重設「本人確認」、不捲回最上面
    else go(state.pos);                                          // 選梯次那一題會重新讀梯次
    if (m) showMsg(m, warn ? 'warn' : 'ok');
  }

  // ---------- 呼叫雲端服務 ----------
  // cb(r)：r.ok＝成功、r.data＝回的 JSON；失敗 r.code＝store_code／bad_input／ai_failed／…（服務的代碼）或 net／timeout／bad_json，
  //        r.msg＝服務寫的白話、r.status＝HTTP 狀態碼
  function api(method, path, body, ms, cb) {
    var ended = false, ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); end({ code: 'timeout' }); }, ms);
    function end(r) { if (!ended) { ended = true; clearTimeout(timer); cb(r); } }
    var opt = { method: method, headers: codeHeaders({}), cache: 'no-store', signal: ctrl ? ctrl.signal : undefined };
    if (body != null) { opt.headers['Content-Type'] = 'application/json'; opt.body = body; }
    try {
      fetch(API + path, opt).then(function (res) {
        return res.text().then(function (t) {
          var j = null;
          try { j = JSON.parse(t); } catch (e) { /* 不是 JSON */ }
          if (res.status === 401) end({ code: 'store_code', status: 401, msg: j ? str(j['錯誤']) : '', data: j });
          else if (!j || typeof j !== 'object') end({ code: 'bad_json', status: res.status });
          else if (res.ok && j.ok === true) end({ ok: true, status: res.status, data: j });
          else end({ code: str(j['代碼']) || 'internal', status: res.status, msg: str(j['錯誤']), data: j });
        });
      }).catch(function (e) { end({ code: 'net', msg: String(e) }); });
    } catch (e) { end({ code: 'net', msg: String(e) }); }
  }

  // 錯誤 → 紅框：一句白話原因。斷線、逾時、雲端暫時出錯 → 加「再試一次」（重跑同一個呼叫，資料都還在）；
  // 重試也沒用的（資料不對、額滿、梯次設定不完整…）只寫雲端回的原因
  var RETRY = { net: 1, timeout: 1, bad_json: 1, ai_failed: 1, sheet_failed: 1, internal: 1 };
  var STEPS = { batches: '讀取梯次', read: '讀取資料', gen: '產生申請文件', recent: '更新名單', packet: '拿文件' };
  // step＝哪一步（也是「再試一次」要重跑的）；attrs＝按鈕多帶的屬性（列印站拿文件：編號、種類）
  function errHTML(step, r, attrs) {
    var again = !!RETRY[r.code], t;
    if (r.code === 'net') t = '網路斷線了，請看 Wi-Fi 有沒有通。';
    else if (r.code === 'timeout') t = '雲端太久沒有回應。';
    else if (again) t = '沒有成功：' + (r.msg || '雲端服務出錯（HTTP ' + r.status + '）。');
    else t = STEPS[step] + '沒有成功：' + (r.msg || '雲端服務出錯（' + r.code + '）。');
    if (again && (step === 'read' || step === 'gen')) t += '\n資料都還在。';
    if (step === 'recent') t += '\n會自動再試。';
    return '<div class="box err"><p>！ ' + escBr(t) + '</p>' +
      (again ? '<button type="button" class="btn" data-act="retry" data-k="' + step + '"' + (attrs || '') + '>再試一次</button>' : '') + '</div>';
  }
  // 「再試一次」：送出會照舊帶上次存好的編號（state.pend，不會多一列）；產生用同一份核對後的資料
  function retry(el) {
    var k = el.getAttribute('data-k');
    if (k === 'read') onSubmit();
    else if (k === 'gen') onGen();
    else if (k === 'batches') { loadBatches(); render(); }
    else if (k === 'recent') stWake(true);
    else if (k === 'packet') stPrint(Number(el.getAttribute('data-no')), el.getAttribute('data-kind'));
  }

  // ---------- 畫面 ----------
  function topHTML(n) {
    var back = n <= N && state.back >= SUBMIT ? (state.back === REVIEW ? '‹ 回核對頁' : '‹ 回確認頁') : '‹ 上一題';
    var h = '<div class="top"><button type="button" class="back" data-act="back">' + back + '</button>' +
      '<span class="count">' + (n <= N ? '第 ' + n + ' 題／共 ' + N + ' 題' : '最後一步') + '</span></div>';
    var pct = Math.round(Math.min(n, N) / N * 100);
    return h + '<div class="bar" aria-hidden="true"><span style="width:' + pct + '%"></span></div>';
  }

  function footHTML(big) {
    return '<div class="foot" id="foot" data-big="' + (big ? '1' : '0') + '">' +
      (big ? '<button type="button" class="btn btn2" data-act="restart">重新填寫</button>'
           : '<button type="button" class="linkbtn" data-act="restart">重新填寫</button>') + '</div>';
  }

  function fieldHTML(name, cfg, labelledBy) {
    var val = str(state.a[name]);
    var attrs = ' id="f_' + name + '" class="field" data-field="' + name + '"' +
      (labelledBy ? ' aria-labelledby="' + labelledBy + '"' : '');
    if (cfg.lines) return '<textarea' + attrs + ' rows="3" autocomplete="off">' + esc(val) + '</textarea>';
    var type = 'text', extra = ' autocomplete="' + (cfg.ac || 'off') + '"';
    if (cfg.kind === 'tel') { type = 'tel'; extra = ' inputmode="tel" autocomplete="tel"'; }
    if (cfg.kind === 'email') { type = 'email'; extra = ' inputmode="email" autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false"'; }
    return '<input type="' + type + '"' + attrs + extra + ' enterkeyhint="next" value="' + esc(val) + '">';
  }

  function introHTML() {
    return '<h1>重返職場 AI 入門班｜<span class="nw">報名資料表</span></h1>' +
      (notice ? '<div class="box ok" role="status"><p>' + escBr(notice) + '</p></div>' : '') +
      '<p class="lead">大約 10 分鐘，<span class="nw">大多用點的。</span></p>' +
      '<p class="lead">請先準備好身分證，<span class="nw">一開始要拍照。</span></p>' +
      '<p class="lead">也要準備勞保資料<span class="nw">（PDF 或截圖）。</span></p>' +
      '<p class="lead">資料只用在這次補助申請，<span class="nw">申請完就刪除。</span></p>' +
      '<p class="hint">中途離開沒關係，<span class="nw">下次打開可以接著填。</span></p>' +
      '<button type="button" class="btn" data-act="start">我同意，開始填寫</button>' +
      // 列印站只給店裡的電腦：學員自己的手機上不放這顆（點進去會看到別人的名字）；手機、平板要用就開 #列印站 網址
      (TOUCH ? '' : '<div class="foot"><button type="button" class="btn btn2" data-act="station">列印站（店裡電腦用）</button></div>') +
      (CODE_ON ? '<div class="foot"><button type="button" class="linkbtn" data-act="code">更換通關碼</button></div>' : '');
  }

  // 拍過、選過，但檔案沒有留在這台電腦的題號（from ≤ 題號 < to）；沒有就回傳 0
  // 勞保檔只有要回確認頁（還沒讀取）時才要補；讀取過以後只需要身分證照片（產生申請文件要再送一次）
  function lostAt(from, to) {
    for (var p = from; p < to && p <= N; p++) {
      var q = QS[p - 1];
      if (q.type === 'photo' && state.had[q.id] && !files[q.id]) return p;
      if (q.type === 'docs' && docsLost && to <= SUBMIT) return p;
    }
    return 0;
  }

  function welcomeHTML() {
    var p = state.pos, lost = p === PRINT ? 0 : lostAt(1, p), nm = nameOf(), msg, btn;
    if (lost && QS[lost - 1].type === 'photo') {
      msg = ['你填的答案都還在。', '不過照片沒有存到，', '要請你再拍一次。'];
      btn = '重拍身分證';
    } else if (lost) {
      msg = ['你填的答案都還在。', '不過勞保資料有 ' + docsLost + ' 個檔沒有存到，', '要請你再選一次。'];
      btn = '重選勞保資料';
    } else if (p === PRINT) {
      msg = ['申請文件已經做好了。'];
      btn = '回到列印頁';
    } else if (p === REVIEW) {
      msg = [pdfLost ? '申請文件沒有存到，要再產生一次。' : state.wait === 'gen' ? '剛剛「產生申請文件」還沒做完就關掉了，要再按一次。' : '資料已經讀好，還沒產生申請文件。'];
      btn = '回到核對頁';
    } else if (p === SUBMIT) {
      msg = [state.wait === 'read' ? '剛剛「送出，讀取資料」還沒做完就關掉了，要再按一次。' : '你上次填到最後一步了。'];
      btn = '接著填';
    } else {
      msg = ['你上次填到第 ' + p + ' 題。'];
      btn = '接著填（第 ' + p + ' 題）';
    }
    // 一小句不拆開換行（長輩讀到一半斷行容易看錯）
    return '<h1>重返職場 AI 入門班｜<span class="nw">報名資料表</span></h1>' +
      '<p class="lead">' + ['歡迎回來！'].concat(msg).map(function (s) { return '<span class="nw">' + esc(s) + '</span>'; }).join('') + '</p>' +
      (nm ? '<p class="hint">學員：' + esc(nm) + (state.rid ? '（編號 ' + state.rid + '）' : '') + '</p>' : '') +
      '<button type="button" class="btn" data-act="resume">' + esc(btn) + '</button>' + footHTML(true);
  }

  function questionHTML(q) {
    var h = topHTML(state.pos);
    h += '<h2 class="qt" id="qt" tabindex="-1">' + esc(q.title) + '</h2>';
    if (q.hint) h += '<p class="hint">' + esc(q.hint) + '</p>';
    if (q.type === 'single') h += '<p class="how">點一個答案</p>';
    if (q.type === 'multi') h += '<p class="how">' + (q.max ? '最多選 ' + q.max + ' 個' : '可以選好幾個') + '</p>';
    if (q.type === 'photo' && !files[q.id]) h += '<p class="how">放在深色的桌面上<br>手機拿平，從正上方拍<br>靠近一點，四個角都要拍到<br>字要清楚，不要反光</p>';
    if (q.type === 'docs') h += '<p class="how">PDF、截圖、拍照都可以，最多 ' + MAX_DOCS + ' 個</p>';
    if (q.type === 'batch') h += '<p class="how">點一個梯次</p>';
    if (q.type === 'photo') {
      h += fileHTML(q);
    } else if (q.type === 'docs') {
      h += docsHTML(q);
    } else if (q.type === 'batch') {
      h += batchHTML();
    } else if (q.type === 'text') {
      h += fieldHTML(q.id, q, 'qt');
    } else {
      var role = q.type === 'single' ? 'radio' : 'checkbox';
      h += '<div class="opts ' + q.type + '" role="' + (q.type === 'single' ? 'radiogroup' : 'group') + '" aria-labelledby="qt">';
      q.opts.forEach(function (o, i) {
        h += '<button type="button" class="opt" data-act="opt" data-i="' + i + '" role="' + role + '" aria-label="' + esc(showT(o)) + '" aria-checked="' + (isSel(q, o) ? 'true' : 'false') + '">' +
          '<span class="mark">' + CHECK + '</span><span class="t">' + esc(o.t) +
          (o.n ? '<span class="note">（' + esc(o.n) + '）</span>' : '') + '</span></button>';
      });
      h += '</div><div id="follow" class="follow"></div>';

  // 欄位路徑：姓名、身分證字號、出生日期、戶籍地址、通訊地址、郵遞區號；lh.<欄>＝勞保表頭；md.<列>.<欄>＝勞保明細；title.<第幾筆>＝職稱
  function fixGet(path, src) {
    var p = path.split('.');
    if (src) {   // 讀取（或重新判讀）時的原值：看改過沒有
      if (p[0] === 'lh') return str(obj(LB()['表頭'])[p[1]]);
      if (p[0] === 'md') return str(obj(arr(LB()['明細'])[+p[1]])[p[2]]);
      if (p[0] === 'title') return str(obj(arr(J()['工作經歷'])[+p[1]])['職稱']);
      if (p[0] === '通訊地址' || p[0] === '郵遞區號') return str(J()[p[0]]);
      return str(IDC()[p[0]]);
    }
    var f = state.fix;
    if (p[0] === 'lh') return str(f['勞保']['表頭'][p[1]]);
    if (p[0] === 'md') return str(obj(f['勞保']['明細'][+p[1]])[p[2]]);
    if (p[0] === 'title') return str(f['工作經歷職稱'][+p[1]]);
    return str(f[p[0]]);
  }
  function setFix(path, v) {
    var f = state.fix, p = path.split('.');
    if (p[0] === 'lh') f['勞保']['表頭'][p[1]] = v;
    else if (p[0] === 'md') { if (f['勞保']['明細'][+p[1]]) f['勞保']['明細'][+p[1]][p[2]] = v; }
    else if (p[0] === 'title') f['工作經歷職稱'][+p[1]] = v;
    else f[p[0]] = v;
  }
  function normFix(path, v) {
    var k = path.split('.').pop();
    if (/日期$/.test(k)) { var d = normDate(v); return d === null ? v : d; }
    if (k === '身分證字號') return normId(v);
    if (k === '郵遞區號') return digits(v);
    return v;

  function nows(s) { return str(s).replace(/\s+/g, ''); }

  // 一格欄位：o.ro＝只顯示；o.uc＝AI 看不清楚；o.need＝空的要標「缺」；o.lines＝多行；o.im＝鍵盤；o.ph＝提示

    var h = '<div class="' + cls + '" data-wrap="' + esc(path) + '"' + (o.need ? ' data-need="1"' : '') + '>';
    if (o.ro) {
      h += '<span class="fk">' + esc(label) + '</span><span class="fv">' + (v ? esc(v) : '（空白）') + '</span>';
    } else {

      var a = ' id="' + id + '" class="inp" data-fix="' + esc(path) + '" autocomplete="off"' + (o.ph ? ' placeholder="' + esc(o.ph) + '"' : '');
      if (o.lines) h += '<textarea' + a + ' rows="2">' + esc(v) + '</textarea>';
      else h += '<input type="text"' + a + (o.im ? ' inputmode="' + o.im + '"' : '') + ' value="' + esc(v) + '">';

      '<span class="tag tchg">改過</span><span class="tag tneed">缺，要填</span></span></div>';

    else h += (ro ? '<button type="button" class="btn" data-act="endAsk">結束</button>'
                  : '<button type="button" class="btn" data-act="gen">改好了，產生申請文件</button>') +
      '<div class="foot"><button type="button" class="linkbtn" data-act="reeditAsk">回去換檔案或改答案</button>' +
      (ro ? '' : '<button type="button" class="linkbtn" data-act="endAsk">今天印不了，先換下一位</button>') + '</div>';
    return h + '<div id="ask"></div>';
  }

  // ---------- 列印頁 ----------
  // 手機、平板（學員自己的手機）：印表機在店裡的電腦 → 最上面叫她去列印站點自己的名字；這裡的列印按鈕縮小放最下面當退路。
  // 文件沒存進雲端（試算表暫時連不上）列印站就看不到，照舊在這裡印
  function printHTML() {
    var o = obj(state.out), n = Number(o['頁數']) || 0, nm = nameOf(), pf = files.pdf_print, ef = files.pdf_env;
    var far = TOUCH && o['已存雲端'] !== false, c1 = far ? 'btn btn2 sm' : 'btn', c2 = far ? 'btn btn2 sm' : 'btn btn2';
    var h = '<h1>申請文件做好了</h1><p class="lead">學員：' + esc(nm) + '<span class="nw">（編號 ' + state.rid + '）</span></p>';
    if (!pf) return h + '<div class="box warn"><p>申請文件沒有存到，要再產生一次。</p></div>' +
      '<button type="button" class="btn" data-act="toReview">回到核對頁</button>';
    // 一小段一小段不拆開（手機上一行約 10 個字）；名字太長才讓它換行，免得超出框
    var who = '點「' + esc(nm) + '」';
    if (far) h += '<div class="box go"><p><span class="nw">請到櫃台電腦的</span><span class="nw">「列印站」，</span>' +
      (nm.length > 5 ? who : '<span class="nw">' + who + '</span>') + '<span class="nw">的名字列印</span></p></div>';
    else if (TOUCH) h += '<div class="box err"><p>' + ['這份申請文件', '沒有存進雲端，', '櫃台電腦的「列印站」', '看不到。'].map(function (s) { return '<span class="nw">' + s + '</span>'; }).join('') +
      '<br>' + ['請把這支手機', '拿給現場人員，', '用下面的按鈕列印。'].map(function (s) { return '<span class="nw">' + s + '</span>'; }).join('') + '</p></div>';
    var btns = (TOUCH ? '<p class="hint">按「列印」會在新分頁打開 PDF，<span class="nw">再按「分享」→「列印」。</span>印完回到這一頁。</p>' : '') +
      printBtn('pdf_print', '列印申請文件' + (n ? '（共 ' + n + ' 頁）' : ''), c1, '申請文件') +
      '<a class="' + c2 + '" href="' + esc(pf.url) + '" download="' + esc('申請文件_' + nm + '.pdf') + '">下載 PDF</a>' +
      (ef ? (far ? '<h3 class="st2">信封</h3>' : '<h2 class="st">信封</h2>') + '<p class="lead">先把 A4 牛皮紙信封<span class="nw">放進印表機。</span></p>' + printBtn('pdf_env', '印信封', c2, '信封') : '');
    if (!far) h += btns;
    h += '<h2 class="st">要簽名、寫日期的地方</h2>' + (arr(o['簽名處']).length ? '<ol class="plist">' + arr(o['簽名處']).map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol>' : '<p>（沒有資料）</p>');
    if (arr(o['提醒']).length) h += '<h2 class="st">提醒</h2><ul class="plist">' + arr(o['提醒']).map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>';
    if (far) h += '<h2 class="st">列印站印不出來的時候</h2>' + btns;
    h += '<div id="msg" role="alert"></div><button type="button" class="btn" data-act="nextAsk">下一位學員</button><div id="ask"></div>';
    return h;
  }
  // 電腦：按鈕→隱藏框直接叫出列印視窗，下面一行退路（新分頁打開）；平板、手機：直接是新分頁打開的連結
  function printBtn(k, label, cls, what) {
    var url = esc(files[k].url);
    if (TOUCH) return '<a class="' + cls + '" href="' + url + '" target="_blank" rel="noopener">' + esc(label) + '</a>';
    return '<button type="button" class="' + cls + '" data-act="print" data-k="' + k + '">' + esc(label) + '</button>' +
      '<a class="alt" href="' + url + '" target="_blank" rel="noopener">列印視窗沒有出來？用新分頁打開' + esc(what) + '</a>';
  }
  function printPdf(k) { if (files[k] && files[k].url) printUrl(files[k].url); }
  // 隱藏框載入 PDF，載好叫出列印視窗；這台瀏覽器不能顯示 PDF、出錯、8 秒沒載好 → 改用新分頁打開
  function printUrl(url) {
    var old = document.getElementById('pframe');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    if (navigator.pdfViewerEnabled === false) { openTab(url); return; }
    var fr = document.createElement('iframe'), done = false;
    var timer = setTimeout(function () { if (!done) { done = true; openTab(url); } }, 8000);
    fr.id = 'pframe';
    fr.className = 'pframe';
    fr.title = '列印用';
    fr.setAttribute('aria-hidden', 'true');
    fr.tabIndex = -1;
    fr.onload = function () {
      if (done) return;
      done = true;
      clearTimeout(timer);
      setTimeout(function () {
        try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (e) { openTab(url); }
      }, 300);
    };
    fr.src = url;
    document.body.appendChild(fr);
  }
  function openTab(url) {
    var w = null;
    try { w = window.open(url, '_blank'); } catch (e) { /* 被擋 */ }
    if (!w) showMsg('列印視窗叫不出來。\n請按按鈕下面的「用新分頁打開」，在新分頁按列印。', 'warn');
  }

  // ---------- 列印站（店裡的電腦：學員在手機上產好的申請文件，點她的名字列印；規格 2-4、2-5） ----------
  // 網址 #列印站 直接進來（店裡電腦設成書籤）。不碰這台電腦上做到一半的報名；拿到的 PDF 只放記憶體，名單上沒有了、離開就丟掉
  var ST_HASH = '列印站';
  var ST_EVERY = 20000;        // 每 20 秒自動更新
  var ST_IDLE = 1800000;       // 30 分鐘沒人動滑鼠、鍵盤就先停（電腦整晚開著也不會一直叫雲端服務）；一動就馬上更新
  var ST_GUARD = 1500;         // 名單剛變（多了一位、位置往下移）這段時間內按列印不算，免得印到別人的
  var stList = null, stKey = '', stErr = '', stAt = '', stLoading = false, stSeq = 0, stTimer = 0;
  var stActive = Date.now(), stIdle = false, stChanged = 0, stJob = '', stUrls = {};
  var begun = false;           // 報名畫面開始過了沒（做到一半的照片、檔案拿回來了沒）

  function atStation() {
    var h = location.hash.slice(1);
    try { h = decodeURIComponent(h); } catch (e) { /* 看不懂就照原樣比 */ }
    return h === ST_HASH;
  }
  function openStation() {
    if (!atStation()) { try { history.pushState(null, '', '#' + ST_HASH); } catch (e) { /* 網址沒變也照常用 */ } }
    view = 'station';
    if (codeMissing()) { codeWhy = 'first'; codeBack = 'station'; view = 'code'; render(); return; }
    if (!stTimer) stTimer = setInterval(stTick, ST_EVERY);
    stActive = Date.now();
    stIdle = false;
    render();
    try { window.scrollTo(0, 0); } catch (e) { /* 舊瀏覽器 */ }
    stLoad();
  }
  function closeStation() {
    clearInterval(stTimer);
    Object.keys(stUrls).forEach(function (k) { URL.revokeObjectURL(stUrls[k]); });
    stTimer = 0; stUrls = {}; stList = null; stKey = ''; stErr = ''; stJob = ''; stLoading = false; stSeq++;
    if (atStation()) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* 同上 */ } }
    view = 'screen';
    if (!begun) { begin(); return; }
    render();
    try { window.scrollTo(0, 0); } catch (e) { /* 舊瀏覽器 */ }
  }

  function stClock() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
  function stStatus() {
    if (stIdle) return '已經 30 分鐘沒人用，自動更新先停了。動一下滑鼠，或按「重新整理」。';
    if (stLoading) return '更新中…';
    return stAt ? '每 20 秒自動更新（上次 ' + stAt + '）' : '';
  }
  function paintStat() { var el = document.getElementById('stStat'); if (el) el.textContent = stStatus(); }

  function stLoad() {
    if (stLoading) return;
    if (!API) { stList = []; render(); return; }   // 測試模式：沒有連雲端服務，名單一直是空的
    var my = ++stSeq;
    stLoading = true;
    paintStat();
    api('GET', '/api/recent', null, WAIT_MS.recent, function (r) {
      if (my !== stSeq) return;
      stLoading = false;
      if (view !== 'station') return;
      if (!r.ok) {
        if (codeRejected(r)) return;
        stErr = errHTML('recent', r);   // 舊名單留著
        render();
        return;
      }
      var list = arr(r.data['文件']).map(obj).filter(function (d) { return Number(d['編號']) > 0; });
      var key = JSON.stringify(list), had = stErr;
      stErr = '';
      stAt = stClock();
      if (key !== stKey) {
        stList = list; stKey = key; stChanged = Date.now();
        Object.keys(stUrls).forEach(function (k) {   // 名單上沒有了的人：PDF 丟掉
          if (!list.some(function (d) { return Number(d['編號']) === Number(k.split('|')[0]); })) { URL.revokeObjectURL(stUrls[k]); delete stUrls[k]; }
        });
        render();
      } else if (had) render();
      else paintStat();   // 沒變就只改「上次更新」，不重畫（不會在滑鼠底下跳動）
    });
  }
  function stTick() {
    if (view !== 'station' || stIdle || document.hidden) return;
    if (Date.now() - stActive > ST_IDLE) { stIdle = true; paintStat(); return; }
    stLoad();
  }
  // 有人動滑鼠、鍵盤、摸螢幕；切回這個分頁（now＝true）：停了的話馬上更新
  function stWake(now) {
    stActive = Date.now();
    if (view === 'station' && (stIdle || now === true)) { stIdle = false; stLoad(); }
  }

  function stationHTML() {
    var h = '<h1>剛產好的申請文件</h1><div class="sbar"><p class="hint" id="stStat">' + esc(stStatus()) + '</p>' +
      '<button type="button" class="btn btn2 sm" data-act="stReload">重新整理</button></div>';
    if (stErr) h += stErr;
    h += '<div id="msg" role="alert"></div>';
    if (stList === null) h += stErr ? '' : '<div class="box warn" role="status"><p>正在讀取，請稍等…</p></div>';
    else if (!stList.length) h += '<div class="box warn"><p>還沒有產好的文件。<br>學員在手機上按「產生申請文件」之後，這裡會出現她的名字。</p></div>';
    else h += '<ol class="slist">' + stList.map(stRowHTML).join('') + '</ol>';
    return h + '<div class="foot"><button type="button" class="linkbtn" data-act="stExit">回報名畫面</button></div>';
  }
  function stRowHTML(d) {
    var no = Number(d['編號']), nm = str(d['姓名']) || '（沒有姓名）';
    var h = '<li class="srow"><p class="shead"><span class="stime">' + esc((d['昨天'] ? '昨天 ' : '') + str(d['時間'])) + '</span>' +
      '<span class="sname">' + esc(nm) + '</span><span class="smeta">' + esc(str(d['梯次'])) + '<span class="nw">｜編號 ' + no + '</span></span></p>' +
      '<div class="sbtns"><div>' + stBtn(no, nm, '申請文件', '列印申請文件', 'btn') + '</div>';
    if (d['有信封']) h += '<div><p class="snote">先把 A4 牛皮紙信封放進印表機</p>' + stBtn(no, nm, '信封', '印信封', 'btn btn2') + '</div>';
    // 退路連結統一放在兩顆按鈕下面一行，按鈕才不會一高一低
    var links = ['申請文件', '信封'].filter(function (k) { return stUrls[no + '|' + k]; }).map(function (k) {
      return '<a href="' + esc(stUrls[no + '|' + k]) + '" target="_blank" rel="noopener">' + esc(k) + '</a>';
    });
    return h + '</div>' + (links.length ? '<p class="sfall">列印視窗沒有出來？用新分頁打開：' + links.join('') + '</p>' : '') + '</li>';
  }
  function stBtn(no, nm, kind, label, cls) {
    var on = stJob === no + '|' + kind;
    return '<button type="button" class="' + cls + '" data-act="stPrint" data-no="' + no + '" data-kind="' + esc(kind) + '" aria-label="' +
      esc(label + '：' + nm) + '"' + (on ? ' aria-disabled="true"' : '') + '>' + esc(on ? '準備中，請稍等…' : label) + '</button>';
  }

  // 點了列印：跟雲端服務拿那一位的 PDF → 叫出列印視窗（跟列印頁一樣）
  function stPrint(no, kind) {
    var d = null, k = no + '|' + kind;
    arr(stList).forEach(function (x) { if (Number(x['編號']) === no) d = x; });
    if (!d) return;
    if (stJob) { showMsg('上一份還在準備，請等一下。', 'warn'); return; }
    if (Date.now() - stChanged < ST_GUARD) { showMsg('名單剛剛更新了，請再看一次名字，再按一次。', 'warn'); return; }
    stJob = k;
    render();
    api('GET', '/api/packet?' + encodeURIComponent('編號') + '=' + no + '&' + encodeURIComponent('種類') + '=' + encodeURIComponent(kind),
      null, WAIT_MS.packet, function (r) {
        if (stJob !== k) return;   // 已經離開列印站
        stJob = '';
        if (view !== 'station') return;
        var b = r.ok ? b64Blob(r.data.base64, 'application/pdf') : null, n = r.ok ? Number(r.data['頁數']) || 0 : 0;
        if (!r.ok && codeRejected(r)) return;
        if (!b) {
          render();
          putMsg(errHTML('packet', r.ok ? { code: 'internal', msg: '雲端服務回的檔案是空的。' } : r,
            ' data-no="' + no + '" data-kind="' + esc(kind) + '"'));
          return;
        }
        if (stUrls[k]) URL.revokeObjectURL(stUrls[k]);
        stUrls[k] = URL.createObjectURL(b);
        render();
        if (TOUCH) { showMsg('請按按鈕下面「用新分頁打開」的「' + kind + '」，在新分頁列印。', 'ok'); return; }
        showMsg('正在叫出「' + str(d['姓名']) + '」的' + kind + (n ? '（共 ' + n + ' 頁）' : '') + '的列印視窗…', 'ok');
        printUrl(stUrls[k]);
      });
  }

  // ---------- 換畫面 ----------
  function render() {
    var h;
    followKey = null;
    if (view === 'code') h = codeHTML();
    else if (view === 'wait') h = waitHTML();
    else if (view === 'station') h = stationHTML();
    else if (view === 'welcome') h = welcomeHTML();
    else if (state.pos === 0) h = introHTML();
    else if (state.pos <= N) h = questionHTML(QS[state.pos - 1]);
    else if (state.pos === SUBMIT) h = submitHTML();
    else if (state.pos === REVIEW) h = reviewHTML();
    else h = printHTML();
    notice = '';
    flash = '';
    app.className = 'wrap' + ((view === 'screen' && state.pos >= REVIEW) || view === 'station' ? ' wide' : '');
    app.innerHTML = (API ? '' : '<p class="tm" role="note">測試模式：沒有連雲端服務，資料不會送出</p>') + h;
    shownAt = Date.now();
    var q = curQ();
    if (q) { updateFollow(q); updateNext(q, true); }
    growAll();
  }

  function go(p) {
    state.pos = p;
    if (p === SUBMIT) confirmChecked = false;   // 每次到確認頁都要重新勾「本人確認」
    if (p >= 1 && p <= N && QS[p - 1].type === 'batch') loadBatches();   // 到選梯次這一題就重新讀（剩幾位、有沒有額滿）
    save();
    render();
    try { window.scrollTo(0, 0); } catch (e) { /* 舊瀏覽器 */ }
    var h = document.getElementById('qt');
    if (h) { try { h.focus({ preventScroll: true }); } catch (e) { /* 舊瀏覽器 */ } }
  }

  // 只有看不到的時候才捲，而且只捲到剛好看得到（畫面在手指下亂動容易點錯）
  function scrollToEl(el) {
    if (!el || !el.getBoundingClientRect) return;
    var r = el.getBoundingClientRect();
    var vh = window.innerHeight || document.documentElement.clientHeight;
    var d = r.bottom > vh ? r.bottom - vh + 16 : r.top < 0 ? r.top - 16 : 0;
    if (!d) return;
    if ('scrollBehavior' in document.documentElement.style) window.scrollBy({ top: d, behavior: 'smooth' });
    else window.scrollBy(0, d);
  }

  function showMsg(text, cls) {
    putMsg('<div class="box ' + (cls || 'err') + '"><p>' + (cls === 'ok' ? '' : '！ ') + escBr(text) + '</p></div>');   // \n＝一句一行
  }
  function putMsg(h) {
    var m = document.getElementById('msg');
    if (!m) return;
    m.innerHTML = h;
    scrollToEl(m);
  }
  function hideMsg() { var m = document.getElementById('msg'); if (m) m.innerHTML = ''; }

  // 多行輸入框跟著字變高，整段地址一眼看得完（不用在框裡面捲）
  function autoGrow(el) {
    if (!el || el.tagName !== 'TEXTAREA' || !(el.getAttribute('data-field') || el.getAttribute('data-fix'))) return;
    el.style.height = 'auto';
    el.style.height = (el.scrollHeight + 6) + 'px';
  }
  function growAll() {
    var els = app.querySelectorAll('textarea');
    for (var i = 0; i < els.length; i++) autoGrow(els[i]);
  }

  // ---------- 題目畫面的即時更新 ----------
  function paintOpts(q) {
    var els = app.querySelectorAll('.opt[data-act="opt"]');
    for (var i = 0; i < els.length; i++) els[i].setAttribute('aria-checked', isSel(q, q.opts[i]) ? 'true' : 'false');
  }

  function activeFollow(q) {
    if (q.type === 'single') { var o = optByT(q, state.a[q.id]); return o && o.f ? o.f : null; }
    if (q.type === 'multi') {
      for (var i = 0; i < q.opts.length; i++) if (q.opts[i].f && isSel(q, q.opts[i])) return q.opts[i].f;
    }
    return null;
  }

  // 顯示「選了要接著填」的框；有變動才重畫（避免打字中被清掉）
  function updateFollow(q) {
    var box = document.getElementById('follow');
    if (!box) return false;
    var f = activeFollow(q);
    var key = f ? f.type + '|' + f.label : '';
    if (key === followKey) return false;
    followKey = key;
    if (!f) { box.innerHTML = ''; return false; }
    box.innerHTML = '<label class="flabel" for="f_' + q.id + '_t">' + esc(f.label) + '</label>' +
      (f.hint ? '<p class="hint">' + esc(f.hint) + '</p>' : '') + fieldHTML(q.id + '_t', f, '');
    growAll();
    return true;
  }

  function nextLabel(q) {
    if (state.back >= SUBMIT) return (q.type === 'photo' ? '清楚，' : '改好了，') + (state.back === REVIEW ? '回核對頁' : '回確認頁');
    if (q.type === 'photo') return '清楚，下一步';
    if (q.type === 'batch') return '下一步：確認資料';
    if (q.type === 'multi') return selOf(q).length ? '選好了，下一題' : '跳過這題';
    if (q.type === 'text' && !q.req) return textOf(q) ? '下一題' : '跳過這題';
    return '下一題';
  }

  function updateNext(q, initial) {
    var b = document.getElementById('next');
    if (!b) return;
    if (q.type === 'single') {
      var o = optByT(q, state.a[q.id]);
      b.hidden = !(o && (o.f || initial));   // 單選第一次點會自動跳題，不用按鈕
    }
    if (q.type === 'batch') b.hidden = !state.batch;   // 點梯次會自動往下；沒得選就不能往下
    if (q.type === 'docs') b.className = 'btn' + (state.docs.length ? '' : ' btn2');   // 還沒選檔：選檔才是主要按鈕
    b.textContent = nextLabel(q);
  }

  function removeMax() { var m = document.getElementById('maxmsg'); if (m && m.parentNode) m.parentNode.removeChild(m); }
  function showMax(i, max) {
    removeMax();
    var els = app.querySelectorAll('.opt[data-act="opt"]');
    var m = document.createElement('div');
    m.id = 'maxmsg';
    m.className = 'box warn';
    m.setAttribute('role', 'alert');
    m.innerHTML = '<p>最多選 ' + max + ' 個。想換的話，先點掉一個已經選的。</p>';
    els[i].parentNode.insertBefore(m, els[i].nextSibling);
  }

  // 下一題；從確認頁、核對頁來改的，或回去補拍、補選的，補完直接回到原本的位置
  function advance() {
    var p = state.pos + 1;
    if (state.back) {
      p = lostAt(p, state.back) || state.back;
      if (p === state.back) state.back = 0;
    }
    go(p);
  }

  // 「歡迎回來」：有照片、檔案沒存到，先回去補，補完回到上次的位置

    state.wait = '';

    go(lost || state.pos);
  }

  function onOpt(i) {
    var q = curQ();

    var o = q.opts[i];
    hideMsg();
    if (q.type === 'single') {
      state.a[q.id] = o.t;
      save();
      paintOpts(q);
      if (o.f) {
        var changed = updateFollow(q);
        updateNext(q, false);
        if (changed) scrollToEl(document.getElementById('next'));   // 接著填的框和「下一題」都要看得到
        return;
      }
      updateFollow(q);
      busy = true;   // 讓她看到勾勾再跳題
      setTimeout(function () { busy = false; advance(); }, 350);

    }
    var sel = selOf(q).slice();
    var k = sel.indexOf(o.t);

    if (k >= 0) {
      sel.splice(k, 1);
    } else {

      else sel = sel.filter(function (t) { var x = optByT(q, t); return !(x && x.ex); });
      if (q.max && sel.length >= q.max) { showMax(i, q.max); return; }

  function onNext() {

  // 從確認頁、核對頁來改的：「回確認頁」先檢查這題再回去
  function onBack() {

  // ---------- 拍照、上傳 ----------
  // 照片縮到長邊 edge px 轉成 JPEG；瀏覽器把照片畫進 canvas 時會照 EXIF 自動轉正（iPhone 的 HEIC 在 Safari 也是這樣轉成 JPEG）
  function shrink(file, edge, quality, done) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      try {
        var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, edge / Math.max(w, h, 1));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(w * k));
        c.height = Math.max(1, Math.round(h * k));
        var g = c.getContext('2d');
        g.fillStyle = '#fff';   // 透明的地方變白底
        g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { done(b); }, 'image/jpeg', quality);
      } catch (e) { URL.revokeObjectURL(url); done(null); }
    };
    img.onerror = function () { URL.revokeObjectURL(url); done(null); };
    img.src = url;
  }

  // 身分證照片：縮到長邊 1600px
  function takeFile(q, file) {
    if (file.type && !/^image\//i.test(file.type)) { showMsg('請選一張照片。'); return; }
    working = q.id;
    refresh(q);
    shrink(file, MAX_EDGE, JPEG_Q, function (blob) {
      working = '';
      if (!blob) { refresh(q); if (curQ() === q) showMsg('這張照片打不開，請重拍或換一張。'); return; }
      keepFile(q, { blob: blob, mime: 'image/jpeg', name: q.fileKind + '.jpg', url: URL.createObjectURL(blob), label: '照片' });
    });
  }
  function keepFile(q, f) {
    dropFile(q.id);
    files[q.id] = f;
    state.had[q.id] = true;
    save();
    idbPut(q.id, f);   // 存進這台電腦：網頁重新打開不用重拍
    refresh(q);
    if (curQ() === q) scrollToEl(document.getElementById('retake') || document.getElementById('next'));   // 兩個大按鈕都要看得到
  }
  function dropFile(id) {
    if (files[id] && files[id].url) URL.revokeObjectURL(files[id].url);
    delete files[id];
  }

  // 勞保資料：可以一次選好幾個；PDF 原檔（10MB 內）、照片截圖縮到長邊 2400px
  function takeDocs(q, list) {
    var todo = Array.prototype.slice.call(list), room = MAX_DOCS - state.docs.length, errs = [];
    if (todo.length > room) { todo = todo.slice(0, Math.max(0, room)); errs.push('最多 ' + MAX_DOCS + ' 個檔案，多的沒有加進來。'); }
    working = q.id;
    refresh(q);
    (function step() {
      if (!todo.length) {
        working = '';
        refresh(q);
        if (curQ() === q) { if (errs.length) showMsg(errs.join('\n')); else scrollToEl(document.getElementById('next')); }
        return;
      }
      var file = todo.shift(), nm = file.name || '';
      if (/pdf/i.test(file.type) || /\.pdf$/i.test(nm)) {
        if (file.size > MAX_BYTES) errs.push('「' + nm + '」超過 10MB，太大了。');
        else addDoc({ blob: file, mime: 'application/pdf', name: nm, label: (nm || 'PDF 檔') + '（' + kb(file.size) + '）' });
        step();
        return;
      }
      if (file.type && !/^image\//i.test(file.type)) { errs.push('「' + nm + '」不是 PDF 或照片，不能上傳。'); step(); return; }
      shrink(file, DOC_EDGE, DOC_Q, function (blob) {
        if (!blob) errs.push('「' + (nm || '照片') + '」打不開，請換一張，或改用截圖、PDF。');
        else addDoc({ blob: blob, mime: 'image/jpeg', name: nm, url: URL.createObjectURL(blob), label: (nm || '照片') + '（' + kb(blob.size) + '）' });
        step();
      });
    })();
  }
  function addDoc(f) {
    var k = 'doc_' + Date.now().toString(36) + '_' + (++docSeq);
    files[k] = f;
    state.docs.push({ k: k, label: f.label, mime: f.mime, size: f.blob.size });

  function undoc(k) {

  // 還停在這題才重畫（處理照片時她可能已經按了上一題）

  // ---------- 梯次（規格 2-1） ----------
  function loadBatches() {

  // ---------- 送出，讀取資料（規格 2-2） ----------
  function onSubmit() {

        showMsg('測試模式：沒有連雲端服務，資料沒有送出。\n（要送的內容印在瀏覽器的 console）', 'warn');

        state.wait = '';
        if (r.ok) { gotRead(r.data); return; }
        if (r.data && Number(r.data['編號']) > 0) state.pend = Number(r.data['編號']);   // 失敗但已經存進試算表了
        view = 'screen';

  function gotRead(d) {

  // 檔案轉成 base64（照片已經縮小過）；list：[{k, kind}]；讀不到的檔 → done(null, 那一個)
  function makeFiles(list, done) {

    (function step() {
      if (i === list.length) { done(out); return; }
      var it = list[i++], f = files[it.k], r = new FileReader();
      if (!f) { done(null, it); return; }
      r.onload = function () { out.push({ '種類': it.kind, 'mime': f.mime, 'base64': String(r.result).split(',')[1] || '' }); step(); };
      r.onerror = function () { done(null, it); };
      r.readAsDataURL(f.blob);
    })();
  }
  // 檔案讀不到（這台電腦把它清掉了）：回到那一題重拍、重選，補完回到原本的畫面
  function fileGone(k) {
    var doc = /^doc_/.test(k);
    if (doc) { state.docs = state.docs.filter(function (x) { return x.k !== k; }); docsLost = 1; }
    dropFile(k);
    state.back = state.pos;
    go(QS.indexOf(qById(doc ? 'labor' : k)) + 1);
  }
  // 測試模式印在 console 的版本：base64 太長，只寫長度
  function preview(data) {
    var c = {};
    for (var k in data) c[k] = data[k];
    c['檔案'] = data['檔案'].map(function (f) { return { '種類': f['種類'], 'mime': f.mime, 'base64': '（省略，共 ' + f.base64.length + ' 字）' }; });
    return c;
  }

  // 等候畫面：標題＋轉圈＋「不要關掉」（等多久算失敗由 api() 的逾時管）
  function showWait(kind) {
    view = 'wait';
    waitKind = kind;
    render();
    try { window.scrollTo(0, 0); } catch (e) { /* 舊瀏覽器 */ }
  }

  // ---------- 核對後產生申請文件（規格 2-3） ----------
  // 送出前的格式檢查；有問題回傳 {path, msg}
  function checkFix() {
    var f = state.fix, i, bad, rows = f['勞保']['明細'], jobs = arr(J()['工作經歷']);
    function need(path, label) { return clean(fixGet(path)) ? null : { path: path, msg: label + '是空的，請填上。' }; }
    function date(path, label, may) {
      var v = fixGet(path);
      if (!clean(v)) return may ? null : { path: path, msg: label + '是空的，請照文件填上。' };
      return normDate(v) ? null : { path: path, msg: label + '「' + v + '」看不懂，請寫成像 055/03/12 這樣（民國年/月/日）。' };
    }
    bad = need('姓名', '姓名（身分證）') ||
      (/^[A-Z][A-D0-9]\d{8}$/.test(normId(f['身分證字號'])) ? null : { path: '身分證字號', msg: '身分證字號（身分證）要 1 個英文字母加 9 個數字，請再看一下。' }) ||
      date('出生日期', '出生日期（身分證）') || date('lh.出生日期', '出生日期（勞保）', true) ||
      need('戶籍地址', '戶籍地址') || need('通訊地址', '通訊地址') ||
      (/^\d{3}(\d{2,3})?$/.test(digits(f['郵遞區號'])) ? null : { path: '郵遞區號', msg: '郵遞區號要 3 個數字（或 5、6 個），請填上通訊地址的郵遞區號。' });
    if (bad) return bad;
    for (i = 0; i < rows.length; i++) {
      bad = date('md.' + i + '.生效日期', '勞保第 ' + (i + 1) + ' 列的生效日期') || date('md.' + i + '.退保日期', '勞保第 ' + (i + 1) + ' 列的退保日期', true);
      if (bad) return bad;
    }
    for (i = 0; i < f['工作經歷職稱'].length; i++) {
      if (!clean(f['工作經歷職稱'][i])) return { path: 'title.' + i, msg: '工作經歷第 ' + (i + 1) + ' 筆（' + str(obj(jobs[i])['機構']) + '）還沒填職稱，請問學員後填上。' };
    }

  }
  // 送出的「核對後」（3-4 的格式；日期整理成 YYY/MM/DD、字號大寫；勞保的「看不清楚」照 AI 原本的清單）
  function fixOut() {

    lb['明細'].forEach(function (r) { ['生效日期', '退保日期'].forEach(function (k) { if (r[k] != null) r[k] = d(r[k]); }); });
    if (lb['表頭']['姓名'] != null) lb['表頭']['姓名'] = clean(lb['表頭']['姓名']);
    if (lb['表頭']['身分證字號'] != null) lb['表頭']['身分證字號'] = normId(lb['表頭']['身分證字號']);
    if (lb['表頭']['出生日期'] != null) lb['表頭']['出生日期'] = d(lb['表頭']['出生日期']);
    return { '姓名': clean(f['姓名']), '身分證字號': normId(f['身分證字號']), '出生日期': d(f['出生日期']), '戶籍地址': clean(f['戶籍地址']),
      '通訊地址': clean(f['通訊地址']), '郵遞區號': digits(f['郵遞區號']), '工作經歷職稱': f['工作經歷職稱'].map(clean), '勞保': lb };
  }
  // 重新判讀的結果（409）：換掉判讀；已經填的職稱照機構對回去（工作經歷的順序可能變了）
  function rejudged(j) {

    old.forEach(function (w, i) { if (clean(titles[i])) byOrg[str(obj(w)['機構'])] = titles[i]; });
    state.read['判讀'] = j;
    state.fix['工作經歷職稱'] = arr(j['工作經歷']).map(function (w) {
      w = obj(w);

    });

  function wrapOf(path) {

  function onGen() {

    busy = true;

      var data = { '編號': state.rid, '梯次': state.batch ? state.batch['梯次'] : '', '資料表': state.sheet || buildText(),

  function b64Blob(b64, mime) {

    idbPut(k, files[k]);   // 存進這台電腦：重新整理不用再產生一次
  }
  function gotDocs(d) {
    var p = obj(d['列印檔']), e = obj(d['信封']), pb = b64Blob(p.base64, p.mime), eb = b64Blob(e.base64, e.mime);

    keepPdf('pdf_print', pb);
    if (eb) keepPdf('pdf_env', eb); else { dropFile('pdf_env'); idbDel('pdf_env'); }
    state.out = { '頁數': Number(p['頁數']) || 0, '簽名處': arr(d['簽名處']).map(str), '提醒': arr(d['提醒']).map(str),
      '已存雲端': d['已存雲端'] !== false };   // 沒存進雲端：列印站看不到，手機的列印頁就不叫她去列印站
    pdfLost = false;
    go(PRINT);
  }

  // ---------- 結束、下一位學員、回確認頁（都要再按一次確定） ----------
  function ask(kind) {
    var el = document.getElementById('ask');
    if (!el) return;
    var res = str(J()['結果']) || '要確認', t;
    if (kind === 'next') t = ['文件都印好、學員都簽好名了嗎？\n按「確定」會清掉這台電腦上這位學員的資料（照片、勞保、申請文件）。', '確定，下一位學員', '還沒，回去'];
    else if (kind === 'end') t = ['確定' + (res === '不符合' ? '' : '先') + '結束嗎？\n資料已經存起來了（編號 ' + state.rid + '，狀態「' + res + '」）。' +
      (res === '不符合' ? '' : '這一頁改的地方不會存。') + '\n按「確定」會清掉這台電腦上這位學員的資料。', '確定，換下一位學員', '不要，回去'];
    else t = ['回確認頁改的話，要重新讀取一次。\n這一頁改的地方不會留著。', '確定，回確認頁', '不要，留在這裡'];
    el.innerHTML = '<div class="box warn"><p>' + escBr(t[0]) + '</p>' +
      '<button type="button" class="btn" data-act="askNo">' + esc(t[2]) + '</button>' +
      '<button type="button" class="btn btn-danger" data-act="askYes" data-k="' + kind + '">' + esc(t[1]) + '</button></div>';
    scrollToEl(el);
  }
  function askYes(kind) {
    if (kind !== 'reedit') { doRestart('上一位學員的資料已經從這台電腦清掉了。'); return; }
    state.rid = 0; state.read = null; state.fix = null; state.out = null; state.sheet = '';
    go(SUBMIT);
  }

  // ---------- 重新填寫（要再按一次確定） ----------
  function askRestart() {
    var f = document.getElementById('foot');
    if (!f) return;
    f.innerHTML = '<div class="box warn"><p>確定要清掉全部答案和照片，從頭開始嗎？</p>' +
      '<button type="button" class="btn" data-act="restartNo">不要，回去繼續</button>' +
      '<button type="button" class="btn btn-danger" data-act="restartYes">確定清掉，重新填寫</button></div>';
    scrollToEl(f);
  }
  function cancelRestart() {
    var f = document.getElementById('foot');
    if (f) f.outerHTML = footHTML(f.getAttribute('data-big') === '1');
  }
  function doRestart(msg) {
    wipe();
    Object.keys(files).forEach(dropFile);
    state = fresh();
    view = 'screen';
    confirmChecked = false; working = ''; docsLost = 0; pdfLost = false;
    batches = null; batchErr = null; batchGone = '';
    notice = msg || '';
    go(0);
  }

  // ---------- 事件 ----------
  function actEl(t) {
    while (t && t !== app) {
      if (t.getAttribute && t.getAttribute('data-act')) return t;
      t = t.parentNode;
    }
    return null;
  }
  var GUARDED = { start: 1, resume: 1, opt: 1, next: 1, back: 1, send: 1, edit: 1, batch: 1, gen: 1, codeOk: 1, endAsk: 1, nextAsk: 1, reeditAsk: 1,
    station: 1, stPrint: 1, retry: 1 };

  app.addEventListener('click', function (e) {
    var el = actEl(e.target);
    if (!el || busy) return;
    var act = el.getAttribute('data-act');
    if (GUARDED[act] && Date.now() - shownAt < GUARD_MS) return;
    switch (act) {
      case 'start': go(1); break;
      case 'resume': resume(); break;
      case 'opt': onOpt(Number(el.getAttribute('data-i'))); break;
      case 'next': onNext(); break;
      case 'back': onBack(); break;
      case 'chk': onChk(el); break;
      case 'send': onSubmit(); break;
      case 'edit': state.back = SUBMIT; go(Number(el.getAttribute('data-q'))); break;
      case 'undoc': undoc(el.getAttribute('data-k')); break;
      case 'batch': onBatch(Number(el.getAttribute('data-i'))); break;
      case 'reloadBatches': loadBatches(); render(); break;
      case 'code': askCode('change'); break;
      case 'codeOk': onCodeOk(); break;
      case 'codeCancel': view = codeBack; render(); break;
      case 'gen': onGen(); break;
      case 'retry': retry(el); break;
      case 'print': printPdf(el.getAttribute('data-k')); break;
      case 'toReview': go(REVIEW); break;
      case 'endAsk': ask('end'); break;
      case 'nextAsk': ask('next'); break;
      case 'reeditAsk': ask('reedit'); break;
      case 'askNo': document.getElementById('ask').innerHTML = ''; break;
      case 'askYes': askYes(el.getAttribute('data-k')); break;
      case 'restart': askRestart(); break;
      case 'restartNo': cancelRestart(); break;
      case 'restartYes': doRestart(); break;
      case 'station': openStation(); break;
      case 'stReload': stWake(true); break;
      case 'stPrint': stPrint(Number(el.getAttribute('data-no')), el.getAttribute('data-kind')); break;
      case 'stExit': closeStation(); break;
    }
  });

  app.addEventListener('input', function (e) {
    var t = e.target, fp = t && t.getAttribute && t.getAttribute('data-fix');
    if (fp && state.fix) {   // 核對頁改欄位
      setFix(fp, t.value);
      save();
      autoGrow(t);
      paintFix(fp);
      clearErr();
      hideMsg();
      return;
    }
    var f = t && t.getAttribute && t.getAttribute('data-field');
    if (!f) return;
    state.a[f] = t.value;
    save();
    hideMsg();
    autoGrow(t);
    var q = curQ();
    var b = document.getElementById('next');
    if (q && b) b.textContent = nextLabel(q);
  });

  // 拍好照片、選好檔案；核對頁的日期、字號打完整理格式
  app.addEventListener('change', function (e) {
    var t = e.target, fp = t && t.getAttribute && t.getAttribute('data-fix');
    if (fp && state.fix) {
      var v = normFix(fp, t.value);
      if (v !== t.value) { t.value = v; setFix(fp, v); save(); paintFix(fp); }
      return;
    }
    var q = t && t.getAttribute && qById(t.getAttribute('data-file') || '');
    if (!q || !t.files || !t.files[0]) return;
    var list = Array.prototype.slice.call(t.files);
    try { t.value = ''; } catch (err) { /* 舊瀏覽器 */ }   // 清掉，同一個檔再選一次也會觸發
    hideMsg();
    if (q.type === 'docs') takeDocs(q, list);
    else takeFile(q, list[0]);
  });

  // 單行輸入框按 Enter＝下一題；通關碼按 Enter＝確定（打中文選字時不算）
  app.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.keyCode === 13) && !e.isComposing && e.keyCode !== 229) {
      var t = e.target;
      if (t && t.id === 'f_code') { e.preventDefault(); if (!busy) onCodeOk(); return; }
      if (t && t.tagName === 'INPUT' && t.getAttribute('data-field')) {
        e.preventDefault();
        if (Date.now() - shownAt >= GUARD_MS) onNext();
      }
    }
  });

  // 等雲端服務的時候不小心按到重新整理、關掉：先問一下
  window.addEventListener('beforeunload', function (e) {
    if (view === 'wait') { e.preventDefault(); e.returnValue = ''; }
  });

  // 列印站：有人在用就算醒著；切回這個分頁馬上更新；網址改成（或按上一頁離開）#列印站 就進出列印站
  ['mousemove', 'mousedown', 'keydown', 'touchstart', 'wheel'].forEach(function (t) { document.addEventListener(t, stWake, { passive: true }); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) stWake(true); });
  window.addEventListener('hashchange', function () {
    var inStation = view === 'station' || (view === 'code' && codeBack === 'station');
    if (atStation() && !inStation && view !== 'wait') openStation();
    else if (!atStation() && inStation) closeStation();
  });

  // ---------- 開始 ----------
  loadCode();
  var saved = load();
  OLD_KEYS.forEach(function (k) { try { window.localStorage.removeItem(k); } catch (e) { /* 略過 */ } });
  if (saved) state = saved;
  var going = state.pos >= 1;
  function start() {
    view = going ? 'welcome' : 'screen';
    if (codeMissing()) { codeWhy = 'first'; codeBack = view; view = 'code'; }
    render();
  }
  function begin() {
    begun = true;
    if (!going) { idbClear(); start(); }   // 沒有做到一半的：這台電腦裡如果還留著舊檔，清掉
    else restoreFiles(start);              // 做到一半的：先把照片、檔案拿回來再顯示
  }
  if (atStation()) openStation();          // 列印站的書籤：做到一半的報名等離開列印站再接
  else begin();
})();
</script>
</body>
</html>
