<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no, email=no, address=no">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="重返職場 AI 入門班｜報名資料表">
<meta property="og:description" content="現場報名：拍身分證、填資料、上傳勞保，當場產出申請文件。">
<link rel="icon" href="data:,">
<title>重返職場 AI 入門班｜報名資料表</title>
<script>
// 雲端服務網址（Google Cloud Run 部署後拿到的網址，例 https://gov-subsidy-xxxxxxxxxx.asia-east1.run.app，結尾不要加斜線）。
// 留空字串＝測試模式：不連網、資料不會送出（梯次用範例；按「送出，讀取資料」只在 console 印出要送的資料）。
// 本機測試：開 測試資料/假雲端服務.py，複製一份這個檔到暫存區、把複本的網址改成 'http://127.0.0.1:8767'；正本一律保持下面的正式網址
var SERVICE_URL = 'https://gov-subsidy-450277428146.asia-east1.run.app';
// 瀏覽器儲存的名字空間：各家的報名網頁都在同一個 GitHub Pages 來源底下（只差路徑），localStorage、IndexedDB 是共用的。
// 空字串＝不給公司發布的那一家（鍵名、資料庫名跟以前一字不差）；發布.py 發別家時把這一行換成那一家的代號，每個鍵、資料庫名後面加「.<代號>」
var STORAGE_NS = '';
// 介紹人那一題（KNOWN 192，主辦 11/17；公司設定 報名網頁.介紹人欄）：false＝不問，資料表沒有「介紹人：」那一行（正本、沒開的那一家）；
// 發布.py 發給開了的那一家時把這一行換成 true
var ASK_INTRODUCER = false;
// 選梯次照區分開（KNOWN 199，主辦 11/17；公司設定 報名網頁.梯次分區）：false＝不分、照舊整排列出來（正本、沒開的那一家）；
// 發布.py 發給開了的那一家時把這一行換成 true（最上面一排區按鈕，先選她通訊地址那一區）
var BATCH_REGIONS = false;
// 舊發布設定保留相容；兩家公司都依通訊地址選文件，不再用此開關擋跨區（11/19）。
var AREA_WARN_ONLY = false;
// 申請文件、信封的下載按鈕（亞拿 11/17；公司設定 報名網頁.文件下載）：false＝做好頁照舊、列印站沒有下載（正本、沒開的那一家）；
// 發布.py 發給開了的那一家時把這一行換成 true（做好頁、列印站每份文件的列印按鈕下面多一排「下載 PDF」）
var DOC_DOWNLOAD = true;
// 下載 Word（公司設定 報名網頁.下載Word）：false＝沒有（正本、沒開的那一家）；true＝那一排多「下載 Word」（網頁把手上的 PDF 傳給雲端 /api/word 轉）。
// DOC_DOWNLOAD 是 false 時這一行是 true 也當作關。發布.py 發給開了的那一家時把這一行換成 true
var WORD_DOWNLOAD = true;
// 保健課事先建檔的名單（2026-11-25；公司設定 報名網頁.合作單位代碼）：false＝沒有（正本、沒開的那一家：不問名單、開始畫面跟以前一樣）；
// true＝店裡碼、合作單位的代碼有事先建檔的學員時，開始畫面多「已有勞保資料的學員（從名單選）」。發布.py 發給開了的那一家時把這一行換成 true
var PRELOAD = true;
// 截止後可補報（主辦 11/25；公司設定 報名網頁.截止後可補報）：false＝照舊，已截止的梯次灰掉寫「已截止，不能選」（正本、沒開的那一家）；
// true＝雲端說「可補報」的（過了報名截止日、離開課日還有 20 天以上）收在選梯次最下面、可以選，其他已截止的不列。發布.py 發給開了的那一家時把這一行換成 true
var LATE_SIGNUP = false;
// 現場通關碼：true＝第一次在這台電腦打開要輸入一次（記在這台電腦），每個請求帶 X-Store-Code 標頭；
// false＝不問、不帶（雲端服務那邊的檢查也要一起拿掉）
var 需要通關碼 = true;
</script>
<!--
  現場報名網頁 v4（店裡的電腦接印表機；現場人員帶學員從頭做到尾。平板、手機也能用）
  - 不載任何外部資源：只用系統字型，CSS／JS 全部在這個檔案裡
  - 流程＝docs/規格_現場報名雲端版.md 第 0 節；API＝第 2 節；資料格式＝第 3 節
  - 資料表文字＝docs/規格_小幫手資料格式.md 第 1 節（v3 原樣）；改題目或標籤要同步改規格
  - 答案、讀取結果、核對時改的地方存在這台電腦（localStorage）；身分證照片、勞保檔、申請文件 PDF 存在 IndexedDB。
    重新整理可以接著做；按「下一位學員」「今天印不了，先換下一位」或「重新填寫」才清掉（現場通關碼留著）
  - 列印站（網址加 #列印站，店裡接印表機的電腦設成書籤）：學員在自己手機上產好文件，現場人員在這裡點她的名字列印。
    手機、平板的列印頁會叫她去列印站；列印站拿到的 PDF 只放在記憶體，不存進這台電腦
  - 以前開始畫面有「我協助的學員」（KNOWN 202），2026-11-25 Tomi 說寫手、合作單位直接到後台看，拿掉了
-->
<style>
:root{
  --ink:#111111;--ink2:#2b2b2b;--line:#595959;--bg:#ffffff;--soft:#efefec;
  --pri:#0b4f9c;--pri-dk:#083b75;--pri-bg:#e3edfa;
  --err:#a00000;--err-bg:#fff0f0;--warn:#7a4a00;--warn-bg:#fff4d8;--ok:#1b6a2e;--ok-bg:#ecf7ee;
  color-scheme:light
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Heiti TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:22px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
.wrap.wide{max-width:820px}
button,input,textarea{font:inherit;color:inherit;margin:0}
button{-webkit-appearance:none;appearance:none;cursor:pointer;touch-action:manipulation}
h1{font-size:32px;line-height:1.35;font-weight:800;margin:32px 0 20px}
.nw{white-space:nowrap}
.lead{font-size:24px;margin:0 0 14px}
.hint{font-size:22px;color:var(--ink2);margin:0 0 8px}
.how{font-size:22px;font-weight:700;color:var(--pri-dk);margin:0 0 14px}
.tm{margin:12px 0 0;padding:8px 12px;border:3px dashed var(--ink2);border-radius:12px;background:var(--warn-bg);font-size:20px;font-weight:800;text-align:center}

/* 上方：上一題＋第幾題 */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 0 8px}
.back{min-height:64px;padding:8px 18px 8px 12px;border:3px solid var(--ink2);border-radius:14px;background:#fff;color:var(--ink);font-size:22px;font-weight:700}
.back:active{background:var(--soft)}
.count{font-size:22px;font-weight:800;padding:6px 0 6px 12px}
.bar{height:14px;border:2px solid var(--ink2);border-radius:8px;background:#fff;overflow:hidden}
.bar span{display:block;height:100%;background:var(--pri)}

/* 題目與選項 */
.qt{font-size:30px;line-height:1.35;font-weight:800;margin:24px 0 10px}
.qt:focus{outline:none}
.opts{margin:6px 0 0}
.opt{display:flex;align-items:center;width:100%;min-height:72px;margin:0 0 14px;padding:12px 16px;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:24px;font-weight:600;line-height:1.35;text-align:left}
.opt:active{background:var(--soft)}
.mark{flex:none;display:flex;align-items:center;justify-content:center;width:38px;height:38px;margin-right:14px;border:3px solid var(--ink2);border-radius:50%;background:#fff}
.multi .mark,.chk .mark{border-radius:8px}
.mark svg{width:26px;height:26px;visibility:hidden}
.opt[aria-checked="true"]{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri);background:var(--pri-bg)}
.opt[aria-checked="true"] .mark{background:var(--pri);border-color:var(--pri)}
.opt[aria-checked="true"] .mark svg{visibility:visible}
.opt .t{flex:1;min-width:0}
.note{display:inline-block;font-size:22px;font-weight:400;color:var(--ink2)}
.sub2{display:block;margin-top:4px;font-size:20px;font-weight:600;color:var(--ink2)}

/* 梯次：一梯一個大按鈕；不能選的（已寄出、額滿、已截止）灰底虛線框＋寫原因 */
.bt .t{display:block}
.b1{display:block;font-size:26px;font-weight:800}
.b2{display:block;font-size:22px;font-weight:600}
.b3{display:block;margin-top:4px;font-size:22px;font-weight:800}
.opt:disabled{border-style:dashed;border-color:#7a7a7a;background:#e6e6e6;color:#333;-webkit-text-fill-color:#333;opacity:1;cursor:not-allowed}
.opt:disabled .mark{border-color:#7a7a7a;background:#e6e6e6}
/* 梯次照開課日排、同一個月一段：段落上面一行月份（大字、粗底線，跟核對頁的段落標題同一種） */
.mon{font-size:26px;font-weight:800;margin:30px 0 12px;padding-bottom:6px;border-bottom:3px solid var(--ink2)}
.mon:first-child{margin-top:8px}
/* 梯次名稱、上課時間各自一塊：放不下就整塊換到下一行，不在「115/11/24」「（二）」或「09:00–」後面拆開（一塊比一行還長才在塊裡面換行，不會超出按鈕） */
.b1>span{display:inline-block}
@media (max-width:340px){.b1{font-size:24px}}   /* 320 寬：26px 的「115/11/24（二）」差 1px 放不下一行 */
/* 選梯次照區分開（KNOWN 199）：梯次上面一排區按鈕（樣子同核對頁點選的 .pk：按下去藍底白字＋✓），手機兩個一列、電腦一排；縣市之間才換行 */
.rgs{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 0}
.rgs .pk{flex:1 1 calc(50% - 5px);min-height:60px;padding:6px 8px;font-size:20px;text-align:center}
@media (min-width:600px){.rgs .pk{flex:1 1 0}}
.rgh{margin:10px 0 0}
/* 截止後可補報（LATE_SIGNUP）：清單最下面一塊，標題整排可點（粗框、▸▾），打開後梯次跟上面一樣寬；卡片最後一行黃字（字也寫清楚，不只靠顏色） */
.lateb{margin:30px 0 0}
.lateb>summary{display:flex;align-items:center;min-height:64px;padding:8px 14px;border:3px solid var(--ink2);border-radius:14px;background:#fff;font-size:22px;font-weight:800;cursor:pointer;list-style:none}
.lateb>summary::-webkit-details-marker{display:none}
.lateb>summary::before{content:"▸";margin-right:10px}
.lateb[open]>summary::before{content:"▾"}
.lateb[open]>summary{margin-bottom:14px}
.b3.late{color:var(--warn)}

/* 輸入框 */
.flabel{display:block;font-size:22px;font-weight:800;margin:8px 0}
.field{display:block;width:100%;min-height:72px;padding:14px 16px;border:3px solid var(--ink2);border-radius:14px;background:#fff;color:var(--ink);font-size:26px;line-height:1.4;-webkit-appearance:none;appearance:none}
textarea.field{min-height:150px;resize:vertical}
.field:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri)}
.follow{margin:0 0 6px}
.code{font-size:36px;letter-spacing:.3em}

/* 提醒框（有粗框和文字，不只靠顏色） */
.box{margin:14px 0;padding:14px 16px;border:3px solid;border-radius:14px;font-size:22px;font-weight:700;line-height:1.5}
.box p{margin:0}
.box p+p,.box ul+p,.box p+ul{margin-top:8px}
.box ul{margin:0;padding-left:1.3em}
.box li{margin:4px 0}
.err{border-color:var(--err);background:var(--err-bg);color:var(--err)}
.warn{border-color:var(--warn);background:var(--warn-bg);color:var(--ink)}
.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}

/* 按鈕 */
.btn{display:block;width:100%;min-height:72px;margin:20px 0 0;padding:14px 18px;border:3px solid var(--pri);border-radius:14px;background:var(--pri);color:#fff;font-size:26px;font-weight:800;line-height:1.3;text-align:center;text-decoration:none}
.btn:active{background:var(--pri-dk)}
.btn2{background:#fff;color:var(--pri-dk)}
.btn2:active{background:var(--pri-bg)}
.btn-danger{background:#fff;border-color:var(--err);color:var(--err)}
.btn-danger:active{background:var(--err-bg)}
.btn[aria-disabled="true"]{background:#e6e6e6;border-color:#7a7a7a;border-style:dashed;color:#333}
/* 錯誤框裡有「再試一次」時，下面同一個動作的大按鈕先藏起來，畫面只留一顆 */
#msg:has([data-act="retry"]) ~ #send,#msg:has([data-act="retry"]) ~ [data-act="gen"]{display:none}
.foot{margin:40px 0 0;text-align:center}
.linkbtn{min-height:56px;padding:8px 16px;border:0;background:none;color:var(--ink2);font-size:22px;text-decoration:underline}

/* 拍照、上傳：input 藏起來，按大按鈕樣式的 label 打開相機或選檔 */
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
label.btn,.alt{cursor:pointer;-webkit-user-select:none;user-select:none}
.vh:focus-visible+label{outline:4px solid var(--pri-dk);outline-offset:3px}
.alt{display:block;width:100%;min-height:56px;margin:12px 0 0;padding:12px 8px;border:0;background:none;color:var(--pri-dk);font-size:22px;font-weight:700;text-align:center;text-decoration:underline}
.thumb{display:block;max-width:100%;max-height:45vh;margin:14px auto;border:3px solid var(--ink2);border-radius:14px}
.flist{list-style:none;margin:8px 0 0;padding:0}
.fitem{display:flex;align-items:center;gap:12px;min-height:76px;margin:0 0 12px;padding:6px 8px 6px 10px;border:3px solid var(--line);border-radius:14px}
.fthumb,.fpdf{flex:none;width:64px;height:64px;border:2px solid var(--ink2);border-radius:8px}
.fthumb{object-fit:cover}
.fpdf{display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.fname{flex:1;min-width:0;font-size:22px;font-weight:600;overflow-wrap:anywhere}

/* 確認頁：一題一列，旁邊「改」 */
.list{list-style:none;margin:8px 0 0;padding:0;border-top:2px solid #b5b5b5}
.item{display:flex;align-items:flex-start;padding:14px 0;border-bottom:2px solid #b5b5b5}
.item .txt{flex:1;min-width:0}
.k{font-size:20px;font-weight:700;color:var(--ink2)}
.v{font-size:24px;font-weight:600;overflow-wrap:anywhere}
.edit{flex:none;min-width:80px;min-height:64px;margin-left:12px;padding:0 12px;border:3px solid var(--pri);border-radius:12px;background:#fff;color:var(--pri-dk);font-size:24px;font-weight:800}
.edit:active{background:var(--pri-bg)}
.del{border-color:var(--err);color:var(--err)}
.del:active{background:var(--err-bg)}
.mini{display:inline-block;max-width:46%;max-height:120px;margin:6px 8px 0 0;border:2px solid var(--ink2);border-radius:8px;vertical-align:top}
.chk{margin-top:24px}

/* 等候 */
.spin{width:72px;height:72px;margin:24px auto;border:8px solid var(--pri-bg);border-top-color:var(--pri);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:4s}}

/* 核對頁（現場人員用：比學員畫面密一點，字還是大） */
.st{font-size:26px;font-weight:800;margin:36px 0 10px;padding-bottom:6px;border-bottom:3px solid var(--ink2)}
.st2{font-size:22px;font-weight:800;margin:18px 0 4px}
.vt{font-size:28px;font-weight:800}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:12px 0;font-size:22px}
.facts dt{font-weight:800}
.facts dd{margin:0}
.card{margin:12px 0;padding:10px 14px;border:3px solid var(--line);border-radius:14px}
.card.bad{border-color:var(--err);box-shadow:0 0 0 2px var(--err)}
.ch{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:22px;font-weight:700}
.cn{font-size:24px;font-weight:800}
.tag{display:inline-block;padding:0 8px;border:2px solid;border-radius:8px;font-size:19px;font-weight:800;line-height:1.5;white-space:nowrap}
.tbad{color:var(--err);border-color:var(--err);background:var(--err-bg)}
.tok{color:var(--ok);border-color:var(--ok)}
.tuc{color:var(--warn);border-color:var(--warn);border-style:dashed;background:var(--warn-bg)}
.tchg{color:var(--pri-dk);border-color:var(--pri-dk)}
.tneed{color:var(--err);border-color:var(--err)}
.tchg,.tneed{display:none}
.chg .tchg,.need .tneed{display:inline-block}
.fl{display:grid;grid-template-columns:4.6em minmax(0,1fr);align-items:center;gap:4px 10px;margin:10px 0}
.fk{font-size:20px;font-weight:800}
.fv{font-size:22px;font-weight:600;overflow-wrap:anywhere}
.inp{display:block;width:100%;min-height:56px;padding:8px 12px;border:3px solid var(--ink2);border-radius:12px;background:#fff;color:var(--ink);font-size:22px;line-height:1.4;-webkit-appearance:none;appearance:none}
textarea.inp{resize:vertical}
.inp:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri)}
.uc .inp{border-style:dashed;border-color:var(--warn);background:var(--warn-bg)}
.need .inp{border-color:var(--err)}
.ferr .inp{border-color:var(--err);box-shadow:0 0 0 3px var(--err)}
.tags,.ftxt{grid-column:2}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.ftxt{margin:0;font-size:20px;font-weight:800;color:var(--err)}
.areat{margin:-4px 0 10px calc(4.6em + 10px);font-size:20px;font-weight:800;color:var(--err)}   /* 地址認不出縣市：請補正才能選對文件 */
.areainfo{margin:4px 0 14px;padding:10px 12px;border:2px solid var(--pri);border-radius:10px;color:var(--pri-dk);font-size:20px;font-weight:700;overflow-wrap:anywhere}
.areainfo p{margin:0 0 4px}.areainfo p:last-child{margin-bottom:0}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:0 18px}
@media (min-width:600px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.idth{display:flex;gap:12px;margin:8px 0}
.idth figure{flex:1;min-width:0;margin:0}
.idth img{display:block;max-width:100%;max-height:170px;border:2px solid var(--ink2);border-radius:8px}
.idth figcaption{font-size:20px;font-weight:700}
.chain{margin:6px 0;padding-left:1.3em;font-size:22px}
.chain li{margin:6px 0}
.say{border-color:var(--pri);background:var(--pri-bg);color:var(--ink)}
.said{font-size:24px;line-height:1.6}
/* 核對頁 10/15：基本資料（不一樣的點一下）、最後一份工作、她的話、切結書會這樣勾、她看過都對 */
.brow{padding:12px 0;border-top:2px solid #b5b5b5}
.bk{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:22px;font-weight:800}
.bl{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px}
.bv{font-size:28px;font-weight:800;letter-spacing:.5px;overflow-wrap:anywhere}
.bv.ba{font-size:24px}
.qa{margin:8px 0 0;padding:10px 12px;border:3px solid var(--warn);border-radius:12px;background:var(--warn-bg);font-size:20px;font-weight:700}
.qa p{margin:0 0 8px}
.picks,.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips{margin:6px 0 10px}
.pk{min-height:56px;padding:6px 14px;border:3px solid var(--ink2);border-radius:12px;background:#fff;color:var(--ink);font-size:22px;font-weight:800;line-height:1.3;text-align:left}
.pk:active{background:var(--soft)}
.pk[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:#fff}
.pk[aria-pressed="true"]::before{content:"✓ "}
.pk .src{display:block;font-size:18px;font-weight:600}
.tq{color:var(--ink);border-color:var(--warn);background:var(--warn-bg)}
.tsys{color:var(--pri-dk);border-color:var(--pri-dk);background:var(--pri-bg)}
.jo .t{display:block}
.jn{font-size:24px;font-weight:800;overflow-wrap:anywhere}
.jd{display:block;font-size:21px;font-weight:600}
.jw{display:inline-block;margin-top:6px;padding:0 8px;border:2px solid var(--warn);border-radius:8px;background:var(--warn-bg);font-size:19px;font-weight:700}
.ins{margin:0 0 14px;padding:8px 14px;border:3px dashed var(--line);border-radius:14px;font-size:21px}
.ins ul{margin:4px 0 0;padding-left:1.3em}
.ck{list-style:none;margin:6px 0;padding:0;font-size:22px}
.ck li{position:relative;padding:6px 0 6px 42px}
.ck li::before{content:"";position:absolute;left:0;top:9px;width:28px;height:28px;border:3px solid var(--ink);border-radius:4px;background:#fff}
.ck li.y{font-weight:800}
.ck li.y::after{content:"✓";position:absolute;left:6px;top:4px;font-size:24px;font-weight:900;line-height:1.3}
.ck li.n{color:var(--ink2)}
/* 10/22 切結書照印出來的樣子：一行一行大字，下面小字寫從哪裡來 */
.ck.pv{font-size:24px;line-height:1.5}
.ck.pv li{padding:8px 0 8px 42px;border-bottom:2px solid #d6d6d6}
.ck .src{display:block;margin-top:2px;font-size:19px;font-weight:600;color:var(--ink2)}
/* 11/08 切結書每一行旁邊「改」（KNOWN 169）：改過的那一行黃框黃底、按鈕寫「已改」；打開的那一行下面是改法（藍框） */
.ck .pvl{display:flex;align-items:flex-start;gap:12px}
.ck .pvt{flex:1;min-width:0}
.ck .pvb{min-width:84px;min-height:56px;margin:0;font-size:22px}
.ck .pvb.done{border-color:var(--warn);background:var(--warn-bg);color:var(--ink)}
.ck.pv li.chgd{margin:4px 0;padding-left:50px;padding-right:8px;border:3px solid var(--warn);border-radius:10px;background:var(--warn-bg)}
.ck.pv li.chgd::before{left:8px}
.ck.pv li.chgd::after{left:14px}
.pved{margin:10px 0 4px;padding:8px 12px 12px;border:3px solid var(--pri);border-radius:12px;background:#fff;font-size:22px;font-weight:600}
.pved .flabel{margin:8px 0 4px}
.pved .hint{font-size:19px}
.pvbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:10px}
.pvbar .btn{width:auto;margin:0;padding:8px 28px}
.pvw{margin:10px 0 0}
.redo{margin-top:32px}
.redo .btn{margin-top:10px}
.more{margin:16px 0;padding:0 14px;border:3px solid var(--line);border-radius:14px}
.more[open]{padding-bottom:12px}
.more>summary{display:flex;align-items:center;min-height:64px;font-size:22px;font-weight:800;cursor:pointer;list-style:none}
.more>summary::-webkit-details-marker{display:none}
.more>summary::before{content:"▸";margin-right:10px}
.more[open]>summary::before{content:"▾"}
.fw{margin:14px 0}
p.cn{margin:6px 0 2px}
.card>.st:first-child{margin-top:8px}
.seen{margin:28px 0 0;padding:14px 16px;border:5px solid var(--pri);border-radius:14px;background:#fff}
.sv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:10px 0;font-size:26px}
.sv dt{font-size:22px;font-weight:700;align-self:center}
.sv dd{margin:0;font-weight:800;overflow-wrap:anywhere}
.seen .opt{font-size:26px;font-weight:800}
.seen .vt{margin:0 0 6px}

.stale .ck,.stale .facts,.stale .say{opacity:.35;filter:grayscale(1)}
.stale #pvst,.stw{padding:6px 12px;border:3px solid var(--warn);border-radius:12px;background:var(--warn-bg);color:var(--ink);font-size:22px;font-weight:800}
.stw{margin:14px 0 0}

.secnav{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));align-items:stretch;gap:8px;margin:0 -16px;padding:8px 16px;border-bottom:3px solid var(--ink2);background:#fff}
.secnav .sn{align-self:center;font-size:20px;font-weight:800;white-space:nowrap}
.sg{min-height:60px;padding:4px 6px;border:3px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:20px;font-weight:800;line-height:1.25}
.sg:active{background:var(--soft)}
.sg .m{display:block;font-size:22px}
.sg.ok{border-color:var(--ok);color:var(--ok)}
.sg[aria-current="true"]{box-shadow:0 0 0 3px var(--pri);border-color:var(--pri)}
.anc{scroll-margin-top:96px}
@media (max-width:599px){.secnav{grid-template-columns:repeat(4,minmax(0,1fr))}.secnav{gap:6px}.secnav .sn{display:none}.sg{padding:4px 2px;font-size:16px;white-space:nowrap}}
/* 10/31 底部兩條退路分開：「今天印不了」會清掉這台電腦上她的資料，紅字＋一句後果，跟「回去改」隔一條線（仍是文字連結，不比產生按鈕搶眼） */
.foot .end{margin:18px 0 0;padding-top:12px;border-top:2px solid #b5b5b5}
.foot .end .linkbtn{color:var(--err);font-weight:800}
.foot .end .sub2{margin:0}

/* 列印頁 */
.plist{margin:6px 0;padding-left:1.4em;font-size:22px;font-weight:600}
.plist li{margin:6px 0}
.pframe{position:fixed;right:0;bottom:0;width:2px;height:2px;border:0;opacity:0;pointer-events:none}
.go{border-width:5px;border-color:var(--pri);background:var(--pri-bg);color:var(--ink);font-size:28px;font-weight:800;line-height:1.45}
.btn.sm{min-height:64px;font-size:22px}

/* 列印站（店裡的電腦）：一位一列，時間、姓名、梯次＋兩個大按鈕 */
.sbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.sbar .hint{margin:0}
.sbar .btn{width:auto;margin:0;padding:8px 28px}
.slist{list-style:none;margin:16px 0 0;padding:0}

.sname{font-size:34px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.smeta{font-size:22px;font-weight:700}
.sbtns{display:grid;grid-template-columns:minmax(0,1fr);gap:0 20px;align-items:end}
@media (min-width:700px){.sbtns{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.snote{margin:16px 0 0;font-size:20px;font-weight:800}
.sfall{margin:14px 0 0;font-size:22px;font-weight:700}
.sfall a{display:inline-block;min-height:44px;padding:6px 10px;color:var(--pri-dk)}

.dlrow{display:flex;gap:12px}
.dlrow .btn{flex:1 1 0;width:auto;min-width:0;margin:12px 0 0;padding:10px 8px;display:flex;align-items:center;justify-content:center}
.dlnote{margin:14px 0 0}

/* 多人一起報名（10/22）：手機送出後的大號碼；店裡電腦開場頁的名單（一位一顆大按鈕，號碼在左邊）、QR 畫面 */
.gdone{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.gname{margin:0 0 6px;font-size:34px;font-weight:800;line-height:1.3}
.fillbar{margin:10px 0 0;font-size:18px}
.fillbar .linkbtn{margin-left:14px}
/* 寫手（KNOWN 182，只有開了寫手代碼的那一家）：畫面最上面一行「寫手：○○」＋「換寫手」 */
.writerbar{margin:10px 0 0;font-size:20px;color:var(--ink2)}
.writerbar b{color:var(--ink)}
.writerbar .linkbtn{margin-left:14px}
.gno{margin:0 0 18px;font-size:28px;font-weight:800;line-height:1.3;text-align:center}
.gno b{display:block;font-size:120px;line-height:1.1;letter-spacing:4px}
.glist{list-style:none;margin:8px 0 0;padding:0}
.hint.pnote{margin-top:12px}   /* 已有勞保資料的學員（11/25）：開始畫面按鈕下面那行、名單上面的人數，跟上面的按鈕、搜尋框隔開 */
.pbad ul{margin:6px 0 0;padding-left:20px}.pbad li{margin:4px 0;word-break:break-all}   /* 名單最下面：自動建檔看不懂的檔（11/26） */
.gnum{flex:none;min-width:72px;margin-right:12px;font-size:34px;font-weight:800;text-align:center}
.gdn{display:flex;align-items:center;min-height:60px;margin:0 0 12px;padding:8px 16px;border:3px dashed #7a7a7a;border-radius:14px;color:#333;font-size:22px;font-weight:700}
.gdn .gnum{font-size:28px}
.gqr{display:block;width:100%;max-width:560px;height:auto;margin:12px auto;border:3px solid var(--ink);image-rendering:pixelated}
.gurl{display:block;width:100%;margin:8px 0;padding:8px 10px;border:2px solid var(--ink2);border-radius:10px;font-size:16px}
</style>

  var idb = null, idbWait = null;   // idb：開好的資料庫（false＝這台不能用）；idbWait：還在開的時候排隊的動作
  var saveNo = 0, saving = {};      // 每個檔最後一次存檔的號碼：舊的還沒寫完就換了或清掉了，舊的就不寫

  function useDB(fn) {
    if (idb !== null) { fn(idb || null); return; }
    if (idbWait) { idbWait.push(fn); return; }
    idbWait = [fn];
    function ready(d) {
      if (idb !== null) return;
      idb = d || false;
      var w = idbWait;
      idbWait = null;
      w.forEach(function (f) { f(idb || null); });
    }
    try {
      var r = window.indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore(DB_STORE); };
      r.onsuccess = function () { ready(r.result); };
      r.onerror = function () { ready(null); };
    } catch (e) { ready(null); }
  }
  function store(d, mode) { return d.transaction(DB_STORE, mode).objectStore(DB_STORE); }

  function idbPut(id, f) {
    var n = saving[id] = ++saveNo, r = new FileReader();
    r.onload = function () {
      var rec = { buf: r.result, mime: f.mime, name: f.name, label: f.label };
      useDB(function (d) {
        if (!d || saving[id] !== n) return;
        try { store(d, 'readwrite').put(rec, id); } catch (e) { /* 存不了：重新打開時請她重拍 */ }
      });
    };
    try { r.readAsArrayBuffer(f.blob); } catch (e) { /* 同上 */ }
  }
  function idbDel(id) {
    saving[id] = ++saveNo;
    useDB(function (d) { if (d) { try { store(d, 'readwrite').delete(id); } catch (e) { /* 略過 */ } } });
  }
  function idbClear() {
    saving = {};
    useDB(function (d) { if (d) { try { store(d, 'readwrite').clear(); } catch (e) { /* 略過 */ } } });
  }

  // 打開網頁時，把照片、勞保檔（列印頁再加申請文件）從 IndexedDB 拿回來；最多等 3 秒，拿不到就當沒存到
  function restoreFiles(done) {
    var ids = QS.filter(function (q) { return q.type === 'photo' && state.had[q.id]; }).map(function (q) { return q.id; });
    state.docs.forEach(function (x) { ids.push(x.k); });
    if (state.pos === PRINT) ids.push('pdf_print', 'pdf_env');
    var over = false, timer = setTimeout(finish, 3000);
    function finish() {
      if (over) return;
      over = true;
      clearTimeout(timer);
      var before = state.docs.length;
      state.docs = state.docs.filter(function (x) { return files[x.k]; });
      docsLost = before - state.docs.length;
      if (state.pos === PRINT && !files.pdf_print) { state.pos = REVIEW; pdfLost = true; }
      save();
      done();
    }
    if (!ids.length) { finish(); return; }
    useDB(function (d) {
      if (!d || over) { finish(); return; }
      try {
        var got = {}, st = store(d, 'readonly');
        ids.forEach(function (id) { var r = st.get(id); r.onsuccess = function () { got[id] = r.result; }; });
        st.transaction.oncomplete = function () {
          if (over) return;
          ids.forEach(function (id) {
            var v = got[id];
            if (!v || !v.buf || !v.buf.byteLength || !v.mime) return;
            var blob = new Blob([v.buf], { type: v.mime });
            files[id] = { blob: blob, mime: v.mime, name: v.name, label: v.label,
              url: /^image\//.test(v.mime) || /^pdf_/.test(id) ? URL.createObjectURL(blob) : '' };
          });
          finish();
        };
        st.transaction.onerror = finish;
      } catch (e) { finish(); }
    });
  }

  // ---------- 輸出文字（規格第 1 節，v3 原樣） ----------
  // 台中 LINE 報名載進來的點選題（11/14）：她在 LINE 答的、這台電腦上還沒改過（沒點選項）→ 照 LINE 資料表那一行的字
  // （LINE 的選項跟這裡不完全一樣，例：調理課的「想上課的原因」，所以不轉成這裡的選項，資料表直接寫她選的字）
  function lineText(q) {
    if (!state.lineId || !state.lineOut || typeof state.lineOut[q.id] !== 'string' || (q.type !== 'single' && q.type !== 'multi')) return '';
    return (q.type === 'single' ? optByT(q, state.a[q.id]) : isArr(state.a[q.id])) ? '' : state.lineOut[q.id];
  }
  function outValue(q) {
    if (q.type === 'text') return textOf(q) || EMPTY;
    if (lineText(q)) return lineText(q);
    if (q.type === 'single') {
      var o = optByT(q, state.a[q.id]);
      if (!o) return EMPTY;
      if (o.f && o.f.type === 'text') {
        var t = followText(q);
        if (o.f.raw) return t || EMPTY;                  // 通訊地址：直接寫地址
        return outT(o) + '（' + (t || '未填') + '）';    // 其他（說明）
      }
      return outT(o);
    }
    var parts = [];
    q.opts.forEach(function (o) {
      if (!isSel(q, o)) return;
      // 多選用「、」分隔，所以「其他」說明裡的「、」換成「，」
      if (o.f) parts.push(outT(o) + '（' + (followText(q).replace(/、/g, '，') || '未填') + '）');
      else parts.push(outT(o));
    });
    return parts.length ? parts.join('、') : EMPTY;
  }
  function buildText() {
    var lines = [HEADER, '填寫日期：' + today()];
    QS.forEach(function (q) {
      if (!q.out || !shownBase(q)) return;   // 條件題沒問的不輸出（保健課沒問的 AI 課那幾題照舊輸出，格式不變）
      if (q.type === 'range') {
        var r = rangeOf(q);
        lines.push(q.out + '：' + (r[0] || EMPTY), q.out2 + '：' + (r[1] || EMPTY));
      } else lines.push(q.out + '：' + outValue(q));
    });
    if (state.noId) {   // 她不想拍身分證（10/28）：雲端看到這行就不要身分證照片，身分證照下面三行（現場照卡片打的）
      lines.push(NO_ID_LINE);
      [['身分證字號', 'idNum'], ['出生日期', 'idBirth'], ['戶籍地址', 'idAddr']].forEach(function (x) { lines.push(x[0] + '：' + (x[1] === 'idAddr' && noAddrOn() ? EMPTY : textOf(qById(x[1])) || EMPTY)); });
    }
    if (noAddrOn()) lines.push(NO_ADDR_LINE);   // 地址欄位留空（保健課，11/26）：雲端看到這行就不要地址、分署照上課地點
    if (state.noLabor) lines.push(NO_LABOR_LINE);   // 最後一題之後、本人確認之前（雲端看到這行就不要勞保檔）
    var iq = qById('introducer');   // 介紹人（KNOWN 192，只有開了的那一家有這一題）：有打才多這一行，跳過就沒有
    if (iq && shown(iq) && textOf(iq)) lines.push('介紹人：' + textOf(iq));
    lines.push('本人確認：以上都是真實狀況');
    return lines.join('\n');
  }

  // 確認頁上顯示的答案（用畫面上的白話）
  function showHTML(q) {
    if (lineText(q)) return esc(lineText(q)) + '<span class="sub2">（她在 LINE 填的）</span>';
    if (q.type === 'photo') {
      var f = files[q.id];
      return f && f.url ? '<img class="mini" src="' + esc(f.url) + '" alt="' + esc(q.fileKind) + '的照片">' : '（還沒拍）';
    }
    if (q.type === 'docs') {
      if (preUse()) return esc('已帶入勞保 ' + state.pre.n + ' 份（合作單位事先查好的，不用再上傳）');
      if (state.noLabor) return esc(NO_LABOR + '（現場點選）');
      return state.docs.length ? state.docs.map(function (x, i) { return esc((i + 1) + '. ' + x.label); }).join('<br>') : '（還沒上傳）';
    }
    if (q.type === 'batch') return state.batch ? batchLines(state.batch) : '（還沒選）';
    if (q.type === 'range') { var r = rangeOf(q); return esc('從 ' + (r[0] || EMPTY) + ' 到 ' + (r[1] || EMPTY)); }
    if (q.id === 'idAddr' && noAddrOn()) return esc('地址欄位留空（印出來她自己寫）');   // 保健課（11/26）
    if (q.type === 'text') return esc(textOf(q) || EMPTY);
    if (q.type === 'single') {
      var o = optByT(q, state.a[q.id]);
      if (!o) return esc(EMPTY);
      if (o.f && o.f.type === 'text') {
        var t = followText(q);
        return esc(o.f.raw ? t || EMPTY : showT(o) + '（' + (t || '未填') + '）');
      }
      return esc(o.show || showT(o));
    }
    var parts = [];
    q.opts.forEach(function (o) { if (isSel(q, o)) parts.push(o.f ? showT(o) + '（' + (followText(q) || '未填') + '）' : showT(o)); });
    return esc(parts.length ? parts.join('、') : EMPTY);
  }
  function batchLines(b) {
    return '<b>' + esc(str(b['梯次']) + ' ' + str(b['上課時間'])) + '</b><br>地點：' + esc(b['上課地點'] || '（未定）') +
      '<br>辦訓單位：' + esc(b['辦訓單位'] || '（未定）');
  }

  // 回傳錯誤訊息；沒問題回傳空字串
  function check(q) {
    if (q.type === 'photo') {
      if (working === q.id) return '照片還在處理，請等一下。';
      if (!files[q.id]) return '請按「' + (TOUCH ? '打開相機拍照' : '選擇照片檔') + '」，拍' + q.fileKind + '。';
      return '';
    }
    if (q.type === 'docs') {
      if (working === q.id) return '檔案還在處理，請等一下。';
      if (state.noLabor || preUse()) return '';   // 從名單點進來的（11/25）：勞保已經帶入
      if (!state.docs.length) return '勞保資料一定要上傳。\n從來沒保過勞保、農保的，按「' + NO_LABOR + '」。';
      var total = 0;
      state.docs.forEach(function (x) { total += x.size; });
      if (total > MAX_TOTAL) return '檔案加起來太大（超過 20MB）。\n請刪掉幾個，或改用 PDF。';
      return '';
    }
    if (q.type === 'batch') {
      if (state.batch) return '';
      return batches && !openCount() && !lateIn(batches, 'all') ? '目前沒有開放報名的梯次。' : '請點一個梯次。';
    }
    if (q.type === 'range') {   // 兩格都要寫；日期寫法只提醒、不擋（onNext 的 rangeOdd）
      if (!clean(state.a[q.id + '_from']) || !clean(state.a[q.id + '_to'])) return '「從」「到」兩格都要寫。\n記不清楚的，寫大概的就好。';
      return '';
    }
    if (q.type === 'text') {
      if (q.id === 'idAddr' && noAddrOn()) return '';   // 地址欄位留空（保健課，11/26）
      var v = textOf(q);
      if (q.kind === 'email' && !v && !q.req) return '';   // 不是必填的 Email 沒填（現在都必填，留著給 req 改回 false）
      if (q.kind === 'tel') {
        if (!v) return '請寫你的手機號碼。';
        if (!/^09\d{8}$/.test(v)) return '號碼好像不對，請再看一下。手機號碼是 09 開頭、10 個數字。';
      } else if (q.kind === 'email') {
        if (!v) return '申請表的 Email 是必填。\n看手機上登入的 Email；真的沒有，填家人的。';
        if (!EMAIL_RE.test(v)) return 'Email 好像不完整，請再看一下。';
      } else if (q.req && !v) {
        return '這題要填喔。';
      }
      return '';
    }
    if (q.type === 'single') {
      // 台中 LINE 報名：她在 LINE 答過的單選題（照 LINE 那一行的字，state.lineOut）算答好了。11/14 第二階段發現第一階段漏了這一行：
      // 送出時被當成沒答、跳回那一題要她重點（主辦：「一定要帶入她在 LINE 已經填好的答案」）
      if (lineText(q)) return '';
      var o = optByT(q, state.a[q.id]);
      if (!o) return '請點一個答案。';
      if (fOf(o) && o.f.req && !followText(q)) return o.f.label + '。';
    }
    return '';
  }

  // ---------- 畫面狀態 ----------
  var app = document.getElementById('app');
  var state = fresh();
  var view = 'screen';          // screen＝一般；welcome＝回來時的歡迎畫面；code＝現場通關碼；wait＝等雲端服務；station＝列印站
  var shownAt = 0, busy = false, followKey = null;
  var confirmChecked = false;
  var files = {};               // 照片、勞保檔、申請文件（記憶體一份、IndexedDB 一份）：{ blob, mime, name, url, label }
  var working = '';             // 正在處理檔案的題目 id
  var notice = '';              // 開場頁的一次性提示
  var flash = '';               // 核對頁上方的一次性提示
  var softOk = '';              // 從、到寫法看不懂時已經提醒過的那組字（同樣的字再按一次就照寫）
  var docsLost = 0, pdfLost = false, docSeq = 0;   // 重新打開時沒拿回來的勞保檔個數、申請文件
  var batches = null, batchErr = null, batchLoading = false, batchGone = '', batchSeq = 0;   // 梯次（batchErr＝沒讀到時雲端的回應）
  var lateOpen = null, lateShown = false;   // 截止後可補報那一塊（畫面用、不存）：寫手按的打開／收起（null＝照預設）、這次畫成打開了沒
  var waitKind = '';

  function curQ() { return view === 'screen' && state.pos >= 1 && state.pos <= N ? QS[state.pos - 1] : null; }

  // ---------- 現場通關碼（全部集中在這一段；最上面 需要通關碼 = false 就整個不用） ----------
  var CODE_ON = typeof 需要通關碼 === 'undefined' ? true : 需要通關碼 !== false;
  var CODE_KEY = nsKey('gov_subsidy.store_code');   // 記在這台電腦；換學員不清
  var storeCode = '', codeWhy = 'first', codeBack = 'screen';   // codeWhy：first 第一次／bad 雲端服務說不對／change 自己要換

  function loadCode() { try { storeCode = str(window.localStorage.getItem(CODE_KEY)); } catch (e) { storeCode = ''; } }
  function saveCode(c) {
    storeCode = c;
    gListErr = ''; gListOff = false; gListAt = 0;   // 多人一起報名的名單：換了通關碼就重新問（之前被 401 停掉的也恢復）
    pList = null; pErr = null; pListOff = false; pListAt = 0;   // 事先建檔的名單（11/25）：換了代碼看到的不一樣，重新問
    try { if (c) window.localStorage.setItem(CODE_KEY, c); else window.localStorage.removeItem(CODE_KEY); } catch (e) { /* 存不了：這次開著還是有用 */ }
  }
  function codeMissing() { return CODE_ON && !G_TOKEN && !storeCode; }   // 手機一起報名：不用通關碼（帶 QR 的代碼）
  function codeHeaders(h) { if (CODE_ON && !G_TOKEN) h['X-Store-Code'] = storeCode; return h; }
  // 雲端服務回 401：通關碼不對（可能換了）→ 到通關碼畫面重新輸入；回傳 true＝處理好了
  function codeRejected(r) {

  }
  // ---------- 寫手（KNOWN 182，主辦 11/16）：開了寫手代碼的那一家，雲端讀梯次時多回「寫手」（這台電腦打的代碼是哪位寫手；共用的
  // 現場通關碼是「主辦」）。記在這台電腦（換寫手、通關碼不對就清），畫面最上面一行「寫手：○○」＋「換寫手」。名字只從雲端來，網頁不判斷誰是寫手。
  // 雲端沒回（沒開寫手代碼的那一家）：什麼都不顯示，畫面跟以前一樣。不給公司發布的那一份（STORAGE_NS 空的）不存寫手的名字、打開時
  // 也不背景問：這台電腦的儲存、送出的請求跟以前一模一樣（KNOWN 183 的儲存鍵檢查照舊只看到舊鍵名）
  // 合作單位的代碼（保健課，11/25；雲端的「寫手」多 合作單位 true，只有開了 報名網頁.合作單位代碼 的那一家會回）：partnerOn＝整份換成保健課
  // （isHealth）、多人一起報名和保健課 LINE 名單不放（雲端也不給）。STORAGE_NS 空的那一份平常不存寫手，只有合作單位的代碼才存名字和
  // 這個記號（PARTNER_KEY）、打開時才背景問；店裡的通關碼什麼都不存，跟以前一樣
  var WRITER_KEY = nsKey('gov_subsidy.writer_name'), PARTNER_KEY = nsKey('gov_subsidy.partner_code');
  var WRITER_KEEP = typeof STORAGE_NS === 'string' && STORAGE_NS !== '';
  var writerName = '', partnerOn = false;
  function loadWriter() {
    try { partnerOn = window.localStorage.getItem(PARTNER_KEY) === '1'; } catch (e) { partnerOn = false; }
    if (!WRITER_KEEP && !partnerOn) return;
    try { writerName = str(window.localStorage.getItem(WRITER_KEY)).slice(0, 50); } catch (e) { writerName = ''; }
    if (!writerName) partnerOn = false;
  }
  function saveWriter(name, partner) {
    partner = !!(partner && name);
    if (name === writerName && partner === partnerOn) return;   // 沒變（沒開寫手代碼的一直是空的）：什麼都不做
    var was = partnerOn;
    writerName = name;
    partnerOn = partner;
    try {
      if (partner) window.localStorage.setItem(PARTNER_KEY, '1'); else if (was) window.localStorage.removeItem(PARTNER_KEY);
      if (WRITER_KEEP || partner) { if (name) window.localStorage.setItem(WRITER_KEY, name); else window.localStorage.removeItem(WRITER_KEY); }
      else if (was) window.localStorage.removeItem(WRITER_KEY);
    } catch (e) { /* 存不了：這次開著照樣顯示 */ }
  }
  // 讀梯次成功的回應 → 有「寫手」就記下來、沒有就清掉（之後那一家關了寫手代碼）；回 true＝名字或是不是合作單位變了
  function noteWriter(r) {
    var before = writerName + '|' + partnerOn, w = obj(r.data && r.data['寫手']);

  function writerBarHTML() {
    if (!CODE_ON || G_TOKEN || !writerName || view === 'code' || view === 'wait' || view === 'gsend') return '';
    return '<p class="writerbar">' + (partnerOn ? '協助報名' : '寫手') + '：<b>' + esc(writerName) + '</b><button type="button" class="linkbtn" data-act="writerSwitch">' +
      (partnerOn ? '換人' : '換寫手') + '</button></p>';

  // 背景讀到的名字變了：只換最上面那一行（不整頁重畫：正在打字、等雲端的畫面都不受影響）
  function paintWriterBar() {
    var old = app.querySelector('.writerbar'), html = writerBarHTML();
    if (old) { if (html) old.outerHTML = html; else old.parentNode.removeChild(old); }
    else if (html && shownAt) { var tm = app.querySelector('.tm'); if (tm) tm.insertAdjacentHTML('afterend', html); else app.insertAdjacentHTML('afterbegin', html); }
  }
  // 「換寫手」：清掉這台電腦記住的代碼和寫手、回代碼畫面；填到一半的學員資料照留（打好新的代碼回到原本那一頁）
  function switchWriter() {
    saveWriter('');
    saveCode('');
    askCode('writer');
  }
  // 別家的網頁（STORAGE_NS 不是空的）打開時，記著代碼就背景問一次雲端是哪位寫手（名字可能改了、代碼可能被停用；沒開寫手代碼的那一家
  // 回的沒有寫手，什麼都不顯示）；不給公司發布的那一份（STORAGE_NS 空的）不問，跟以前一樣
  function refreshWriter() {
    if ((!WRITER_KEEP && !partnerOn) || !CODE_ON || G_TOKEN || !storeCode || !API) return;
    api('GET', '/api/batches', null, WAIT_MS.batches, function (r) {
      // 名字變了：開始畫面整頁重畫（列印站那顆跟著是不是寫手，KNOWN 204；開始畫面沒有輸入框），其他畫面只換最上面那一行
      if (r.ok) { if (noteWriter(r)) { if (view === 'screen' && state.pos === 0) render(); else if (view === 'station' && stWriter()) openStation(); else paintWriterBar(); } return; }
      codeRejected(r);   // 代碼停用了、換了：到代碼畫面（填到一半的資料照留）
    });
  }
  function askCode(why) {
    if (why === 'bad') { saveCode(''); saveWriter(''); }
    codeWhy = why;
    if (view !== 'code') codeBack = view === 'welcome' || view === 'station' ? view : 'screen';
    view = 'code';
    busy = false;
    render();
    try { window.scrollTo(0, 0); } catch (e) { /* 舊瀏覽器 */ }
    var f = document.getElementById('f_code');
    if (f) { try { f.focus(); } catch (e) { /* 略過 */ } }
  }
  function codeHTML() {
    var h = '<h1>現場通關碼</h1>';
    if (codeWhy === 'bad') h += '<div class="box err"><p>現場通關碼不對（可能換了），請重新輸入。' + (codeBack === 'station' ? '' : '<br>剛剛填的資料都還在。') + '</p></div>';
    else if (codeWhy === 'change') h += '<p class="lead">請輸入新的現場通關碼。</p>';
    else if (codeWhy === 'writer') h += '<p class="lead">換寫手：<span class="nw">請輸入自己的代碼。</span></p>' + (codeBack === 'station' ? '' : '<p class="hint">剛剛填的資料都還在。</p>');
    else h += '<p class="lead">第一次在這台電腦使用，<span class="nw">請輸入現場通關碼。</span></p>' +
      '<p class="hint">輸入一次就會記在這台電腦，<span class="nw">之後不用再輸入。</span></p>';
    h += '<label class="flabel" for="f_code">現場通關碼（6 位數字）</label>' +
      '<input type="text" id="f_code" class="field code" inputmode="numeric" maxlength="6" autocomplete="off" enterkeyhint="done">' +
      '<div id="msg" role="alert"></div>' +
      '<button type="button" class="btn" id="codeOk" data-act="codeOk">確定</button>';
    if (codeWhy === 'change' && storeCode) h += '<button type="button" class="btn btn2" data-act="codeCancel">不換了，回去</button>';
    return h;
  }
  // 按「確定」：有接雲端服務就先讀一次梯次，確認通關碼對不對（連不上就先記下來，選梯次時會再確認）
  function onCodeOk() {
    var f = document.getElementById('f_code'), v = half(f ? f.value : '').replace(/\s+/g, '');
    if (!/^\d{6}$/.test(v)) { showMsg('通關碼是 6 位數字，請再看一下。'); return; }
    if (!API) { codeDone(v, ''); return; }
    var old = storeCode, b = document.getElementById('codeOk');
    busy = true;
    hideMsg();
    if (b) b.textContent = '確認中，請稍等…';
    storeCode = v;
    api('GET', '/api/batches', null, WAIT_MS.batches, function (r) {
      busy = false;
      if (r.code === 'store_code') {
        storeCode = old;
        if (b) b.textContent = '確定';
        showMsg('通關碼不對，請再看一下。');
        return;
      }
      if (r.ok) noteWriter(r);   // 開了寫手代碼的那一家：這個代碼是哪位寫手（KNOWN 182）
      else if (v !== old) saveWriter('');   // 連不上、換了別的代碼（11/19）：記著的寫手清掉，雲端說是誰之前不當寫手（手機的身分證留空沒有）
      codeDone(v, r.ok ? '' : '還沒辦法確認通關碼對不對（連不上雲端服務），先記下來了。');
    });
  }
  function codeDone(v, warn) {
    var why = codeWhy, m = why === 'change' ? '通關碼換好了。' : why === 'bad' ? '通關碼更新好了。' : why === 'writer' ? '寫手換好了。' : '';
    var byJudge = jdOff;   // 是核對頁的預覽（/api/judge）被擋下來的：現場沒按按鈕，不叫她「再按一次」；換好了預覽再打
    saveCode(v);
    jdOff = false;
    if (codeBack === 'station') { openStation(); if (warn) showMsg(warn, 'warn'); return; }
    if (why === 'bad' && !byJudge && (state.pos === SUBMIT || state.pos === REVIEW)) m += '\n請再按一次下面的按鈕。';
    if (warn) m += (m ? '\n' : '') + warn;
    view = codeBack;
    if (view !== 'screen' || state.pos === 0) { notice = m; render(); return; }
    if (state.pos === SUBMIT || state.pos === REVIEW) render();   // 不重設「本人確認」、不捲回最上面
    else go(state.pos);                                          // 選梯次那一題會重新讀梯次
    if (state.pos === REVIEW) judgeSoon();
    if (m) showMsg(m, warn ? 'warn' : 'ok');
  }

  // ---------- 呼叫雲端服務 ----------
  // cb(r)：r.ok＝成功、r.data＝回的 JSON；失敗 r.code＝store_code／bad_input／ai_failed／…（服務的代碼）或 net／timeout／bad_json，
  //        r.msg＝服務寫的白話、r.status＝HTTP 狀態碼
  function api(method, path, body, ms, cb) {
    var ended = false, ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); end({ code: 'timeout' }); }, ms);
    function end(r) { if (!ended) { ended = true; clearTimeout(timer); cb(r); } }
    var opt = { method: method, headers: codeHeaders({}), cache: 'no-store', signal: ctrl ? ctrl.signal : undefined };
    if (body != null) { opt.headers['Content-Type'] = 'application/json'; opt.body = body; }
    try {
      fetch(API + path, opt).then(function (res) {
        return res.text().then(function (t) {
          var j = null;
          try { j = JSON.parse(t); } catch (e) { /* 不是 JSON */ }
          if (res.status === 401) end({ code: 'store_code', status: 401, msg: j ? str(j['錯誤']) : '', data: j });
          else if (!j || typeof j !== 'object') end({ code: 'bad_json', status: res.status });
          else if (res.ok && j.ok === true) end({ ok: true, status: res.status, data: j });
          else end({ code: str(j['代碼']) || 'internal', status: res.status, msg: str(j['錯誤']), data: j });
        });
      }).catch(function (e) { end({ code: 'net', msg: String(e) }); });
    } catch (e) { end({ code: 'net', msg: String(e) }); }
  }

  // 錯誤 → 紅框：一句白話原因。斷線、逾時、雲端暫時出錯 → 加「再試一次」（重跑同一個呼叫，資料都還在）；
  // 重試也沒用的（資料不對、額滿、梯次設定不完整…）只寫雲端回的原因
  var RETRY = { net: 1, timeout: 1, bad_json: 1, ai_failed: 1, sheet_failed: 1, internal: 1 };
  var STEPS = { batches: '讀取梯次', read: '讀取資料', gen: '產生申請文件', recent: '更新名單', packet: '拿文件', dl: '拿文件', word: '轉成 Word ' };
  // step＝哪一步（也是「再試一次」要重跑的）；attrs＝按鈕多帶的屬性（列印站拿文件：編號、種類）
  function errHTML(step, r, attrs) {
    var again = !!RETRY[r.code], t;
    if (r.code === 'net') t = '網路斷線了，請看 Wi-Fi 有沒有通。';
    else if (r.code === 'timeout') t = '雲端太久沒有回應。';
    else if (again) t = '沒有成功：' + (r.msg || '雲端服務出錯（HTTP ' + r.status + '）。');
    else t = STEPS[step] + '沒有成功：' + (r.msg || '雲端服務出錯（' + r.code + '）。');
    if (again && (step === 'read' || step === 'gen')) t += '\n資料都還在。';
    if (step === 'recent') t += '\n會自動再試。';
    return '<div class="box err"><p>！ ' + escBr(t) + '</p>' +
      (again ? '<button type="button" class="btn" data-act="retry" data-k="' + step + '"' + (attrs || '') + '>再試一次</button>' : '') + '</div>';
  }
  // 「再試一次」：送出時答案、檔案都沒改就照舊帶上次存好的編號（state.pend，不會多一列）；產生用同一份核對後的資料
  function retry(el) {
    var k = el.getAttribute('data-k');
    if (k === 'read') onSubmit();
    else if (k === 'gen') onGen();
    else if (k === 'batches') { loadBatches(); render(); }
    else if (k === 'recent') stWake(true);
    else if (k === 'packet') stPrint(Number(el.getAttribute('data-no')), el.getAttribute('data-kind'));
    else if (k === 'dl' || k === 'word') dlGo(el.getAttribute('data-s'), Number(el.getAttribute('data-no')), el.getAttribute('data-kind'), el.getAttribute('data-f'));
  }

  // ---------- 畫面 ----------
  function topHTML(n) {
    var fill = state.fill && !G_TOKEN;   // 店裡電腦上幫手機填好的人補資料（10/23）
    var back = n <= N && state.back >= SUBMIT ? (state.back === REVIEW ? '‹ 回核對頁' : '‹ 回確認頁')
      : (fill && n >= 1 && n <= SUBMIT && !prevFill(n)) || (state.pre && pOn() && n >= 1 && n <= N && step(n - 1, -1) === 0) ? '‹ 回名單' : '‹ 上一題';   // 從名單點進來的第 1 題（11/25）
    var fc = fill ? fillCount(n) : null;
    var all = fill ? Math.max(fc.all, 1) : shownCount(N), at = fill ? fc.at : Math.min(shownCount(n), all);   // 只算要問的（條件題沒問的不算）
    var h = '<div class="top"><button type="button" class="back" data-act="back">' + back + '</button>' +
      '<span class="count">' + (n <= N ? (fill ? '要補第 ' : '第 ') + at + ' 題／共 ' + all + ' 題' : '最後一步') + '</span></div>';
    var pct = Math.round((n <= N ? at : all) / all * 100);
    return h + '<div class="bar" aria-hidden="true"><span style="width:' + pct + '%"></span></div>' +
      (fill ? '<p class="fillbar">正在幫 <b>' + esc(fillWho()) + '</b> 補資料' +
        '<button type="button" class="linkbtn" data-act="gSwitch">換人</button></p>' : '');
  }

  function footHTML(big) {
    return '<div class="foot" id="foot" data-big="' + (big ? '1' : '0') + '">' +
      (big ? '<button type="button" class="btn btn2" data-act="restart">重新填寫</button>'
           : '<button type="button" class="linkbtn" data-act="restart">重新填寫</button>') + '</div>';
  }

  function fieldHTML(name, cfg, labelledBy) {
    var val = str(state.a[name]);

      (labelledBy ? ' aria-labelledby="' + labelledBy + '"' : '');

    if (cfg.maxlen) extra += ' maxlength="' + cfg.maxlen + '"';   // 介紹人（KNOWN 192）：雲端最多記 50 字
    return '<input type="' + type + '"' + attrs + extra + ' enterkeyhint="next" value="' + esc(val) + '">';

  // 畫面上的標題（保健課的人不寫 AI 課，11/25）；資料表開頭那行（HEADER）不跟著換
  function formTitle() { return isHealth() ? '保健課' : '重返職場 AI 入門班'; }
  function introHTML() {
    return '<h1>' + formTitle() + '｜<span class="nw">報名資料表</span></h1>' +

      '<span class="nw">上傳那一步按</span><span class="nw">「沒有任何勞保、</span><span class="nw">農保紀錄」。</span></p>' +

      // 保健課事先建檔的名單（11/25，PRELOAD 開著的那一家）：這個代碼看得到的名單有人 → 「全新報名」＋「已有勞保資料的學員（從名單選）」；
      // 名單背景讀，讀到了只換這一塊（pPaint）。沒開的那一家照舊只有一顆
      (PRELOAD === true ? '<div id="pstart">' + pStartHTML() + '</div>' : '<button type="button" class="btn" data-act="start">我同意，開始填寫</button>') +
      (TOUCH || partnerOn ? '' : gHomeHTML()) +   // 合作單位的代碼（11/25）：手機填好的人、保健課 LINE 名單、多人 QR 都不放（雲端也不給）   // 多人一起報名（10/22）：今天在手機上填好的人、產生 QR（店裡電腦才有）

      // 寫手（開了寫手代碼的那一家，名字不是「主辦」）也不放：列印站只認店裡的碼（KNOWN 204）
      (TOUCH || stWriter() ? '' : '<div class="foot"><button type="button" class="btn btn2" data-act="station">列印站（店裡電腦用）</button></div>') +
      (TOUCH || partnerOn ? '' : '<div id="llist">' + lLinkHTML() + '</div>') +   // 保健課 LINE 報名名單：開始畫面最下面一行小連結，點進去才是名單（11/25）
      (CODE_ON ? '<div class="foot"><button type="button" class="linkbtn" data-act="code">更換通關碼</button></div>' : '');

  // 拍過、選過，但檔案沒有留在這台電腦的題號（from ≤ 題號 < to）；沒有就回傳 0
  // 勞保檔只有要回確認頁（還沒讀取）時才要補；讀取過以後只需要身分證照片（產生申請文件要再送一次）；
  // 按了「沒有任何勞保、農保紀錄」的沒有檔可以弄丟
  function lostAt(from, to) {
    for (var p = from; p < to && p <= N; p++) {
      var q = QS[p - 1];
      if (!shown(q)) continue;   // 她不拍身分證（10/28）：拍照題不問，沒有照片可以弄丟
      if (q.type === 'photo' && state.had[q.id] && !files[q.id]) return p;
      if (q.type === 'docs' && docsLost && !state.noLabor && to <= SUBMIT) return p;
    }
    return 0;
  }

  function welcomeHTML() {
    var p = state.pos, lost = p === PRINT ? 0 : lostAt(1, p), nm = nameOf(), msg, btn;
    if (lost && QS[lost - 1].type === 'photo') {
      msg = ['你填的答案都還在。', '不過照片沒有存到，', '要請你再拍一次。'];
      btn = '重拍身分證';
    } else if (lost) {
      msg = ['你填的答案都還在。', '不過勞保資料有 ' + docsLost + ' 個檔沒有存到，', '要請你再選一次。'];
      btn = '重選勞保資料';
    } else if (p === PRINT) {
      msg = ['申請文件已經做好了。'];
      btn = '回到列印頁';
    } else if (p === REVIEW) {
      msg = [pdfLost ? '申請文件沒有存到，要再產生一次。' : state.wait === 'gen' ? '剛剛「產生申請文件」還沒做完就關掉了，要再按一次。' : '資料已經讀好，還沒產生申請文件。'];
      btn = '回到核對頁';
    } else if (p === SUBMIT) {
      msg = [state.wait === 'read' ? '剛剛「送出，讀取資料」還沒做完就關掉了，要再按一次。' : '你上次填到最後一步了。'];
      btn = '接著填';
    } else {

      btn = '接著填（第 ' + shownCount(p) + ' 題）';
    }
    // 一小句不拆開換行（長輩讀到一半斷行容易看錯）
    return '<h1>' + formTitle() + '｜<span class="nw">報名資料表</span></h1>' +
      '<p class="lead">' + ['歡迎回來！'].concat(msg).map(function (s) { return '<span class="nw">' + esc(s) + '</span>'; }).join('') + '</p>' +
      (nm ? '<p class="hint">學員：' + esc(nm) + (state.rid ? '（編號 ' + state.rid + '）' : '') + '</p>' : '') +
      '<button type="button" class="btn" data-act="resume">' + esc(btn) + '</button>' + footHTML(true);

  function questionHTML(q) {
    var h = topHTML(state.pos), tt = titleOf(q);
    h += '<h2 class="qt" id="qt" tabindex="-1">' + (isArr(tt) ? tt.map(function (s) { return '<span class="nw">' + esc(s) + '</span>'; }).join('') : esc(tt)) + '</h2>';
    if (q.how) h += '<p class="how">' + esc(q.how) + '</p>';   // 標題下面的藍字（介紹人那一題，KNOWN 192）
    if (q.hint && !(q.id === 'idAddr' && noAddrOn())) h += '<p class="hint">' + escBr(q.lateHint && lateMode() ? q.lateHint : q.hint) + '</p>';   // 截止後可補報（保健課那幾條路照原本的）
    if (G_TOKEN && q.id === 'live') h += '<p class="hint">不一樣的話，地址等一下到電腦前再寫</p>';   // 手機一起報名：地址不在手機上打（10/22 驗收）
    if (q.plan && !G_TOKEN) h += '<p class="hint">這題會寫進計畫書，請帶她想清楚</p>';   // 給現場人員看，不輸出（學員自己的手機上不放）
    if (q.type === 'single') h += '<p class="how">點一個答案</p>';
    if (q.type === 'multi') h += '<p class="how">' + (q.max ? '最多選 ' + q.max + ' 個' : '可以選好幾個') + '</p>';
    if (q.type === 'photo' && !files[q.id]) h += '<p class="how">放在深色的桌面上<br>手機拿平，從正上方拍<br>靠近一點，四個角都要拍到<br>字要清楚，不要反光</p>';
    if (q.type === 'docs' && !state.noLabor && !preUse()) h += '<p class="how">可以選好幾個，最多 ' + MAX_DOCS + ' 個</p>';
    if (q.type === 'batch') h += '<p class="how">點一個梯次</p>';
    if (q.type === 'photo') {
      h += fileHTML(q);
      if (q.id === 'idFront' && noIdOk() && (!state.fill || state.lineId) && working !== q.id)   // 10/28：店裡電腦才有、11/19 起寫手代碼、店裡碼的手機平板也有（noIdOk；手機填好載進來的不給：照片在手機上拍好了；台中 LINE 報名帶進來的給，11/14）；拍過的照片按了會刪掉
        h += '<button type="button" class="btn btn2 sm" data-act="noId">身分證欄位留空，<span class="nw">之後自己貼影本</span></button>';
    } else if (q.type === 'docs') {
      h += docsHTML(q);
    } else if (q.type === 'batch') {

    } else if (q.type === 'text') {
      if (q.id === 'idAddr' && noAddrOn()) h += '<div class="box ok" role="status"><p>地址欄位留空，<span class="nw">印出來她自己寫</span></p>' +
        '<p class="sub2">戶籍地址、通訊地址都不用打；申請表、切結書、信封的地址印空白</p></div>';   // 保健課（11/26）
      else h += fieldHTML(q.id, q, 'qt');
    } else if (q.type === 'range') {   // 兩格：從、到（例子放在格子裡）
      h += '<label class="flabel" for="f_' + q.id + '_from">從</label>' + fieldHTML(q.id + '_from', { ph: '例 100/03/01' }, '') +
        '<label class="flabel" for="f_' + q.id + '_to">到</label>' + fieldHTML(q.id + '_to', { ph: '例 105/08/31' }, '');
    } else {

      q.opts.forEach(function (o, i) {
        h += '<button type="button" class="opt" data-act="opt" data-i="' + i + '" role="' + role + '" aria-label="' + esc(showT(o)) + '" aria-checked="' + (isSel(q, o) ? 'true' : 'false') + '">' +
          '<span class="mark">' + CHECK + '</span><span class="t">' + esc(o.t) +
          (o.n ? '<span class="note">（' + esc(o.n) + '）</span>' : '') + '</span></button>';
      });
      h += '</div><div id="follow" class="follow"></div>';
    }
    h += '<div id="msg" role="alert"></div>';
    if (q.type !== 'photo') h += '<button type="button" class="btn" id="next" data-act="next">下一題</button>';   // 拍照題的按鈕在 fileHTML
    if (q.id === 'idAddr' && isHealth()) h += noAddrOn() ? '<button type="button" class="linkbtn" data-act="useAddr">改成打地址</button>'   // 保健課（11/26）

  }

  // 拍照題：還沒拍→「打開相機拍照」（電腦：「選擇照片檔」）；拍好→縮圖＋問清不清楚；沒存住→提醒重拍
  function fileHTML(q) {

  // 勞保資料：選好的檔一個一列（可刪），最多 5 個；下面一顆「沒有任何勞保、農保紀錄」（跟選檔二選一：選了檔就不能按，按了就收起選檔）

  //（之後最下面多一行「改回用帶入的勞保」）
  function docsHTML(q) {

  // 梯次：一梯一個大按鈕；只有「開放報名」能點。照開課日早到晚、同一個月一段（gotBatches 排好了）
  function openCount() {

    return n;
  }
  // 梯次名稱一塊：同一天另開的梯次名稱接地點（KNOWN 200，例 116/01/16（六）屏東長治）→ 日期、地點各一塊（放不下時地點整塊換到下一行，
  // 不在地點中間拆開）；只有日期的照舊一塊
  function titleSpans(t) {

  function ownerLine(b) {

  }
  // 截止後可補報（主辦 11/25；只有 LATE_SIGNUP 是 true 的那一家、一般報名；保健課那幾條路〔isHealth：LINE 報名、合作單位的代碼、已有勞保資料的名單，只列合作單位的梯次〕照舊）：雲端說「可補報」的已截止梯次（離開課日還有 20 天以上）
  // 不放在月份裡，收在清單最下面「已過報名截止日的梯次（N）」，可以選、最後一行黃字；其他已截止的（離開課不到 20 天、開課了）不列。
  // 其他不能選的（設定不完整）照舊灰掉。沒開的那一家 lateOk 一律 false，畫面、行為跟以前一樣
  function lateMode() { return LATE_SIGNUP === true && !isHealth(); }
  function lateOk(b) { return lateMode() && b['狀態'] === '已截止' && b['可補報'] === true; }

  function listed(b) { return !lateMode() || b['狀態'] !== '已截止' || lateOk(b); }   // 畫得出來的（分區按鈕照這些算）
  function lateIn(list, r) { return arr(list).filter(function (b) { return lateOk(b) && inRegion(b, r); }).length; }
  function lateSel() {   // 選好的那一梯是可補報的 → 那一梯；不是 → null
    var sel = null;
    if (state.batch) arr(batches).forEach(function (b) { if (b['梯次'] === state.batch['梯次'] && lateOk(b)) sel = b; });
    return sel;
  }
  // 選了可補報的那一梯：放在「下一步」上面的黃框（選的當下就看得到；回來改時照樣在）
  function lateDays(roc) {   // 今天（台灣時間）到這個民國日期還有幾天（主線 11/26 拿掉「我協助的學員」時 myDays 跟著拿掉了，這裡自己算）
    var iso = function (t) { return (Number(t.slice(0, 3)) + 1911) + '-' + t.slice(4, 6) + '-' + t.slice(7, 9); }, a = todayTW(), d = normDate(roc);
    return a && d ? Math.round((Date.parse(iso(d) + 'T00:00:00Z') - Date.parse(iso(a) + 'T00:00:00Z')) / 86400000) : null;
  }
  function latePickHTML() {
    var b = lateSel(), n = b ? lateDays(b['開課日']) : null;
    return b ? '<div class="box warn"><p>你選的這一梯已過報名截止日，<span class="nw">離開課剩 ' + n + ' 天，</span>申請文件做好要趕快寄出。</p></div>' : '';
  }
  // 選梯次照區分開（KNOWN 199，主辦 11/17；只有 BATCH_REGIONS 是 true 的那一家）：梯次上面一排區按鈕，下面只列那一區的梯次。
  // 區＝分署（OFFICE_COUNTIES，跟受理分署、切結書預覽同一條 officeOf）：照上課地點的縣市分，認不出縣市的梯次只在「全部」。
  // 按鈕：有梯次的區才有（北到南），字寫那一區有梯次的縣市（例「高雄・屏東」），最後「全部」；梯次都在同一組（每個按鈕列的都一樣）就不畫。
  // 先選哪一個（regionAt）：這位學員寫手按過的（state.rg）→ 選好的梯次那一區（回來改時看得到選的那一梯）→ 她通訊地址那一區
  // （那一區有開放報名的梯次才算）→ 全部。多人一起報名產 QR 那時還沒有學員、沒有地址：先選全部（gq.rg 記寫手按的）
  var REGION_ORDER = ['北基宜花金馬', '桃竹苗', '中彰投', '雲嘉南', '高屏澎東'];   // 北到南；北基宜花金馬 11/17 加（KNOWN 201）、桃竹苗同一天加（KNOWN 203）
  // 這台電腦上次按的區（Tomi 11/17「照你建議的，記住上次按的區」）：她的地址選梯次時還不知道（認不出區）才拿來先選；
  // 只有 BATCH_REGIONS 的那一家讀、存（沒開的那一家這台電腦的儲存跟以前一模一樣）
  var REGION_KEY = nsKey('gov_subsidy.batch_region');
  function lastRegion() {
    if (BATCH_REGIONS !== true) return '';
    try { var v = str(window.localStorage.getItem(REGION_KEY)); return v === 'all' || REGION_ORDER.indexOf(v) >= 0 ? v : ''; } catch (e) { return ''; }
  }
  function keepRegion(r) {
    if (BATCH_REGIONS !== true) return;
    try { window.localStorage.setItem(REGION_KEY, r); } catch (e) { /* 存不了：下次照舊先列全部 */ }
  }
  function regionsOf(list) {   // [{r: 分署, t: [有梯次的縣市]}]
    var have = {};
    arr(list).forEach(function (b) {
      var r = officeOf(b['上課地點']);
      if (r) countiesOf(b['上課地點']).forEach(function (c) { if (OFFICE_COUNTIES[r].indexOf(c.slice(0, 2)) >= 0) (have[r] = have[r] || {})[c.slice(0, 2)] = 1; });
    });
    return REGION_ORDER.filter(function (r) { return have[r]; }).map(function (r) { return { r: r, t: OFFICE_COUNTIES[r].filter(function (c) { return have[r][c]; }) }; });
  }
  function regionTabs(list) {   // 要畫的區按鈕；梯次都在同一組（含認不出縣市的那一組）→ null（不畫）
    var g = {};
    arr(list).forEach(function (b) { g[officeOf(b['上課地點']) || '?'] = 1; });
    return Object.keys(g).length > 1 ? regionsOf(list) : null;
  }
  function inRegion(b, r) { return r === 'all' || officeOf(b['上課地點']) === r; }
  // 這一區有沒有梯次可以選：開放報名的；截止後可補報的那一家連可補報的也算（沒開的那一家 lateIn 一律 0＝同 openIn）
  function pickIn(list, r) { return openIn(list, r) || lateIn(list, r) > 0; }
  function openIn(list, r) { return arr(list).some(function (b) { return b['狀態'] === '開放報名' && inRegion(b, r); }); }
  // 她的通訊地址（到選梯次這一步就知道的才算）：「不一樣」打的地址；「一樣」又是身分證欄位留空的，照卡片打的戶籍地址。
  // 拍了身分證又選「一樣」的，要送出讀了身分證才知道 → ''
  function addrNow() {
    var q = qById('live'), o = q && optByT(q, state.a.live);
    return !o ? '' : o.f ? followText(q) : noIdOn() ? textOf(qById('idAddr')) : '';
  }
  function regionAt(list, tabs) {
    var rs = tabs.map(function (x) { return x.r; }), mine = officeOf(addrNow()), sel = null;
    if (state.rg === 'all' || rs.indexOf(state.rg) >= 0) return state.rg;
    if (state.batch) arr(list).forEach(function (b) { if (b['梯次'] === state.batch['梯次']) sel = b; });
    if (sel) return officeOf(sel['上課地點']) || 'all';
    if (mine) return pickIn(list, mine) ? mine : 'all';
    return fromMemory(list, tabs) || 'all';
  }
  // 她的地址認不出區時：這台電腦上次按的區（那一區有開放報名的梯次才算；上次按全部＝全部）
  function fromMemory(list, tabs) {
    var m = lastRegion();
    return m === 'all' ? 'all' : m && tabs.some(function (x) { return x.r === m; }) && pickIn(list, m) ? m : '';
  }
  function regionHint(list, at, tabs) {
    var a = addrNow(), mine = officeOf(a), cs = countiesOf(a), where = cs.length === 1 ? cs[0] : '';
    var mem = !mine && at !== 'all' && !state.rg && !(state.batch && arr(list).some(function (b) { return b['梯次'] === state.batch['梯次']; })) && fromMemory(list, tabs) === at;
    var memTxt = mem ? '先列這台電腦上次看的' + tabs.filter(function (x) { return x.r === at; })[0].t.join('・') + '；要看別區按上面。' : '';
    if (!where) return memTxt || (at === 'all' ? '先列全部梯次；要只看一區，按上面。' : '');
    if (!mine) return '她的通訊地址在' + where + '，不在這幾區' + (memTxt ? '；' + memTxt : '。');
    if (at === mine) return '她的通訊地址在' + where + '，先列' + mine + '的梯次；要看別區按上面。';
    return '她的通訊地址在' + where + (pickIn(list, mine) ? '（' + mine + '）；要看那一區按上面。' : '，' + mine + '現在沒有開放報名的梯次。');
  }
  // 選好的梯次不在現在列的這一區（寫手按了別區）：寫一行「已選：…（在…）」，選的那一梯不會看不見
  function pickedHint(at, tabs) {
    var sel = null;
    if (state.batch) arr(batches).forEach(function (b) { if (b['梯次'] === state.batch['梯次']) sel = b; });
    if (!sel || inRegion(sel, at)) return '';
    var r = officeOf(sel['上課地點']), t = tabs.filter(function (x) { return x.r === r; })[0];
    return '<p class="hint rgh" id="picked">已選：' + esc(str(sel['梯次'])) + '（在' + esc(t ? t.t.join('・') : '「全部」') + '）</p>';
  }
  function regionTabsHTML(tabs, at, act) {
    return '<div class="rgs" role="group" aria-label="上課地區">' + tabs.concat([{ r: 'all', t: ['全部'] }]).map(function (x) {
      return '<button type="button" class="pk" data-act="' + act + '" data-r="' + esc(x.r) + '" aria-pressed="' + (x.r === at) + '">' +
        x.t.map(function (c) { return '<span class="nw">' + esc(c) + '</span>'; }).join('・') + '</button>';
    }).join('') + '</div>';
  }
  function batchHTML() {
    if (batchErr) return errHTML('batches', batchErr) +
      (RETRY[batchErr.code] ? '' : '<button type="button" class="btn btn2" data-act="reloadBatches">重新整理梯次</button>');
    if (batchLoading || !batches) return '<div class="box warn" role="status"><p>正在讀取梯次，請稍等…</p></div>';
    var h = '';
    if (!API) h += '<p class="hint">（測試模式：下面是範例梯次）</p>';
    if (batchGone) h += '<div class="box warn"><p>原本選的 ' + esc(batchGone) + ' 不能報名了，請重選。</p></div>';
    var pt = partnerOn && !state.lineId;   // 合作單位的代碼（11/25）：只看得到自己單位開的保健課梯次
    var sp = !!state.pre && !pt && !state.lineId, lc = !!state.lineId || sp;   // 店裡碼從「已有勞保資料的學員」名單點進來的（11/25）：只列合作單位的梯次
    if (state.lineId) h += '<p class="hint">保健課 LINE 報名的人，<span class="nw">只列「' + esc(LINE_CH) + '」的梯次。</span></p>';

    var lateAll = lateIn(batches, 'all');   // 截止後可補報（沒開的那一家、保健課那幾條路一律 0）
    if (!openCount() && !lateAll) h += '<div class="box err"><p>目前沒有開放報名的' + (lc ? '「' + esc(LINE_CH) + '」' : pt ? '保健課' : '') + '梯次。' +
      (lc ? '<br>請先在後台新增梯次，報名管道選「' + esc(LINE_CH) + '」。' : pt ? '<br>請聯絡主辦開班。' : '') + '</p></div>';
    var tabs = BATCH_REGIONS === true ? regionTabs(batches.filter(listed)) : null, at = tabs ? regionAt(batches, tabs) : 'all', tip = tabs ? regionHint(batches, at, tabs) : '';
    var openAt = openIn(batches, at), lateAt = lateIn(batches, at);
    if (tabs) h += regionTabsHTML(tabs, at, 'batchRg') + (tip ? '<p class="hint rgh">' + esc(tip) + '</p>' : '') +
      ((openCount() || lateAll) && !openAt && !lateAt ? '<div class="box warn"><p>這一區現在沒有開放報名的梯次，按上面的「全部」看別區。</p></div>' : '') + pickedHint(at, tabs);
    if (lateAt && !openAt) h += '<div class="box warn"><p>' + (at === 'all' ? '目前' : '這一區目前') + '沒有還在報名期間的梯次；<span class="nw">已過截止日、還來得及的在下面。</span>' +
      (at !== 'all' && openCount() ? '<br>別區還在報名的，按上面的「全部」看。' : '') + '</p></div>';
    h += '<div class="opts" role="radiogroup" aria-labelledby="qt">';
    var year = todayTW().slice(0, 3), month = '';
    batches.forEach(function (b, i) {
      if (!inRegion(b, at)) return;   // 分區（KNOWN 199）：別區的不畫（data-i 照全部梯次的順序）
      if (lateMode() && b['狀態'] === '已截止') return;   // 截止後可補報：可補報的收在最下面那一塊，其他已截止的不列
      var d = normDate(b['開課日']);   // gotBatches 只留看得懂的
      if (d.slice(0, 6) !== month) {   // 換月份：上面一行月份（今年的只寫月；別年的寫民國年，跟梯次名稱一樣用民國）
        month = d.slice(0, 6);

    var lates = '';   // 截止後可補報：照日期列在最下面一塊（預設收起；這一區沒有還在報名期間的、或選的就是這裡面的，先打開）
    batches.forEach(function (b, i) { if (lateOk(b) && inRegion(b, at)) lates += batchBtn(b, i); });
    if (lates) {

  // ---------- 列印站（店裡的電腦：學員在手機上產好的申請文件，點她的名字列印；規格 2-4、2-5） ----------
  // 網址 #列印站 直接進來（店裡電腦設成書籤）。不碰這台電腦上做到一半的報名；拿到的 PDF 只放記憶體，名單上沒有了、離開就丟掉
  var ST_HASH = '列印站';
  var ST_EVERY = 20000;        // 每 20 秒自動更新

  // ---------- 下載申請文件、信封（亞拿 11/17；DOC_DOWNLOAD 開了才有，WORD_DOWNLOAD 再加 Word） ----------
  // 做好頁（s＝pp）、列印站（st）每份文件的列印按鈕下面一排「下載 PDF」「下載 Word」。

  function dlRowHTML(s, no, nm, kind, pdfA) {

  }
  function dlBtn(s, no, nm, kind, f) {

    return nm;
  }
  // 那一份 PDF → cb(blob)；拿不到 cb(null, r)。列印站每次都重新拿（不留）
  function dlPdf(s, no, kind, cb) {
    if (s === 'pp') { var f = files[kind === '信封' ? 'pdf_env' : 'pdf_print']; cb(f && f.blob || null, { code: 'internal', msg: '申請文件沒有存到，要再產生一次。' }); return; }
    api('GET', '/api/packet?' + encodeURIComponent('編號') + '=' + no + '&' + encodeURIComponent('種類') + '=' + encodeURIComponent(kind),

  function dlGo(s, no, kind, f) {

    dlJob = key;
    render();
    dlPdf(s, no, kind, function (b, r) {
      if (my !== dlSeq) return;
      if (!b) { fail('dl', r); return; }
      if (f === 'pdf') { save(b, '.pdf'); return; }
      dlB64(b, function (b64) {
        if (my !== dlSeq) return;
        if (!b64) { fail('word', { code: 'internal', msg: '這份 PDF 讀不出來。' }); return; }
        api('POST', '/api/word', JSON.stringify({ pdf: b64 }), WAIT_MS.word, function (r) {
          if (my !== dlSeq) return;
          var w = r.ok ? b64Blob(r.data.base64, str(r.data.mime) || DOCX) : null;
          if (!r.ok && r.status === 404) { fail('word', { code: 'word_off', msg: DL_WORD_OFF }); return; }   // 雲端沒開下載 Word：不給「再試一次」
          if (!w) { fail('word', r.ok ? { code: 'internal', msg: '雲端服務回的檔案是空的。' } : r); return; }
          save(w, '.docx');
        });
      });
    });
  }

  // ---------- 換畫面 ----------
  function render() {
    var h;
    followKey = null;
    var where = view === 'screen' ? (state.pos === PRINT ? 'print' : 'form') : view;   // 下載：離開畫面就收回拿過的 PDF、存檔連結
    if (where !== dlWhere) { if (dlWhere) dlReset(); dlWhere = where; }
    if (view === 'code') h = codeHTML();
    else if (view === 'wait') h = waitHTML();
    else if (view === 'station') h = stationHTML();
    else if (view === 'lline') h = lPageHTML();                                      // 保健課 LINE 報名名單（第二層，11/25）
    else if (view === 'plist') h = pPageHTML();                                      // 已有勞保資料的學員（事先建檔的名單，第二層，11/25）
    else if (view === 'gqr') h = gQrHTML();                                           // 多人一起報名（10/22）：店裡電腦的 QR
    else if (view === 'gsend') h = gSendingHTML();                                    // 手機：送出中
    else if (G_TOKEN && (state.g || gBad)) h = state.g ? gDoneHTML() : gBadHTML();    // 手機：你是第 N 號／這張 QR 不能用
    else if (view === 'welcome') h = welcomeHTML();
    else if (state.pos === 0) h = G_TOKEN ? gIntroHTML() : introHTML();
    else if (state.pos <= N) h = questionHTML(QS[state.pos - 1]);
    else if (state.pos === SUBMIT) h = G_TOKEN ? gSendHTML() : submitHTML();
    else if (state.pos === REVIEW) h = reviewHTML();
    else h = printHTML();
    notice = '';
    flash = '';
    jobNote = '';
    app.className = 'wrap' + ((view === 'screen' && state.pos >= REVIEW) || view === 'station' ? ' wide' : '');
    app.innerHTML = (API ? '' : '<p class="tm" role="note">測試模式：沒有連雲端服務，資料不會送出</p>') + writerBarHTML() + h;
    if (!G_TOKEN) document.title = formTitle() + '｜報名資料表';   // 分頁上的標題（保健課的人不寫 AI 課）
    shownAt = Date.now();
    var q = curQ();
    if (q) { updateFollow(q); updateNext(q, true); }
    growAll();
    // 核對頁第一次出現：用現場的預設（推薦那份、職稱、版本 2）打一次 /api/judge，提醒、預覽、唸給她聽才跟畫面一致；
    // 判讀沒有候選工作（10/15 前讀取、存在這台電腦的）也靠這一次拿新的；拿不到就照舊的卡片做。
    // 重新整理後也打一次：存著的預覽可能比畫面上改的舊（上次預覽沒拿到、或改完 0.5 秒內就關掉），拿不到就灰掉
    // 重新整理回來、「她說都對」已經是按著的：按的那時候看的切結書沒存（seenPv），先記下現在畫面上這份——判讀回來切結書變了照樣
    // 自動取消（審查 10/22）
    if (view === 'screen' && state.pos === REVIEW && state.fix && seenOk() && !seenPv) seenPv = pvSig();
    if (view === 'screen' && state.pos === REVIEW && state.fix && API && !jdTried) { jdTried = true; judgeNow(); }
    if (view === 'screen' && state.pos === REVIEW) secScan();
    gAfterRender();   // 多人一起報名：開場頁、QR 畫面上的名單（太久沒更新才問雲端）
  }

  function go(p) {
    lineBack = -1;   // 換了畫面：#line= 打開時記的「回去繼續做」不算了
    state.pos = p;
    if (p === SUBMIT) confirmChecked = false;   // 每次到確認頁都要重新勾「本人確認」
    if (p >= 1 && p <= N && QS[p - 1].type === 'batch') loadBatches();   // 到選梯次這一題就重新讀（剩幾位、有沒有額滿）
    save();
    render();
    try { window.scrollTo(0, 0); } catch (e) { /* 舊瀏覽器 */ }
    var h = document.getElementById('qt');
    if (h) { try { h.focus({ preventScroll: true }); } catch (e) { /* 舊瀏覽器 */ } }
  }

  // 只有看不到的時候才捲，而且只捲到剛好看得到（畫面在手指下亂動容易點錯）
  function scrollToEl(el) {
    if (!el || !el.getBoundingClientRect) return;
    var r = el.getBoundingClientRect();
    var vh = window.innerHeight || document.documentElement.clientHeight;
    var d = r.bottom > vh ? r.bottom - vh + 16 : r.top < 0 ? r.top - 16 : 0;
    if (!d) return;
    if ('scrollBehavior' in document.documentElement.style) window.scrollBy({ top: d, behavior: 'smooth' });
    else window.scrollBy(0, d);
  }

  function showMsg(text, cls) {
    putMsg('<div class="box ' + (cls || 'err') + '"><p>' + (cls === 'ok' ? '' : '！ ') + escBr(text) + '</p></div>');   // \n＝一句一行
  }
  function putMsg(h) {
    var m = document.getElementById('msg');
    if (!m) return;
    m.innerHTML = h;
    scrollToEl(m);
  }
  function hideMsg() { var m = document.getElementById('msg'); if (m) m.innerHTML = ''; }

  // 多行輸入框跟著字變高，整段地址一眼看得完（不用在框裡面捲）
  function autoGrow(el) {
    if (!el || el.tagName !== 'TEXTAREA' || !(el.getAttribute('data-field') || el.getAttribute('data-fix'))) return;
    el.style.height = 'auto';
    el.style.height = (el.scrollHeight + 6) + 'px';
  }
  function growAll() {
    var els = app.querySelectorAll('textarea');
    for (var i = 0; i < els.length; i++) autoGrow(els[i]);
  }

  // ---------- 題目畫面的即時更新 ----------
  function paintOpts(q) {
    var els = app.querySelectorAll('.opt[data-act="opt"]');
    for (var i = 0; i < els.length; i++) els[i].setAttribute('aria-checked', isSel(q, q.opts[i]) ? 'true' : 'false');
  }

  function activeFollow(q) {
    if (q.type === 'single') { var o = optByT(q, state.a[q.id]); return fOf(o); }
    if (q.type === 'multi') {
      for (var i = 0; i < q.opts.length; i++) if (q.opts[i].f && isSel(q, q.opts[i])) return q.opts[i].f;
    }
    return null;
  }

  // 顯示「選了要接著填」的框；有變動才重畫（避免打字中被清掉）
  function updateFollow(q) {
    var box = document.getElementById('follow');
    if (!box) return false;
    var f = activeFollow(q);
    var key = f ? f.type + '|' + f.label : '';
    if (key === followKey) return false;
    followKey = key;
    if (!f) { box.innerHTML = ''; return false; }
    box.innerHTML = '<label class="flabel" for="f_' + q.id + '_t">' + esc(f.label) + '</label>' +
      (f.hint ? '<p class="hint">' + esc(f.hint) + '</p>' : '') + fieldHTML(q.id + '_t', f, '');
    growAll();
    return true;
  }

  function nextLabel(q) {
    if (state.back >= SUBMIT) return (q.type === 'photo' ? '清楚，' : '改好了，') + (state.back === REVIEW ? '回核對頁' : '回確認頁');
    if (q.type === 'photo') return '清楚，下一步';
    if (q.type === 'batch' || (preBatch() && step(QS.indexOf(q) + 2, 1) > N)) return '下一步：確認資料';   // 名單點進來的：最後一題是勞保
    if (q.type === 'multi') return selOf(q).length ? '選好了，下一題' : '跳過這題';
    if (q.type === 'text' && !q.req && !q.keepNext) return textOf(q) ? '下一題' : '跳過這題';
    return '下一題';
  }

  function updateNext(q, initial) {
    var b = document.getElementById('next');
    if (!b) return;
    if (q.type === 'single') {
      var o = optByT(q, state.a[q.id]);
      b.hidden = !(o && (fOf(o) || initial));   // 單選第一次點會自動跳題，不用按鈕
    }
    if (q.type === 'batch') b.hidden = !state.batch;   // 點梯次會自動往下；沒得選就不能往下
    if (q.type === 'docs') b.className = 'btn' + (state.docs.length || state.noLabor || preUse() ? '' : ' btn2');   // 還沒選檔、也沒按「沒有任何紀錄」：選檔才是主要按鈕
    b.textContent = nextLabel(q);
  }

  function removeMax() { var m = document.getElementById('maxmsg'); if (m && m.parentNode) m.parentNode.removeChild(m); }
  function showMax(i, max) {
    removeMax();
    var els = app.querySelectorAll('.opt[data-act="opt"]');
    var m = document.createElement('div');
    m.id = 'maxmsg';
    m.className = 'box warn';
    m.setAttribute('role', 'alert');
    m.innerHTML = '<p>最多選 ' + max + ' 個。想換的話，先點掉一個已經選的。</p>';
    els[i].parentNode.insertBefore(m, els[i].nextSibling);
  }

  // 下一題（條件題沒問的跳過）；從確認頁、核對頁來改的，或回去補拍、補選的，補完直接回到原本的位置——
  // 只有改了職稱、多出還沒答的條件題（沒在公司上過班的三題）時，先接著問完再回去
  function advance() {
    var p = step(state.pos + 1, 1);
    if (state.fill && !state.back) p = nextGap(p);   // 手機填好、載進這台電腦的（一起報名）：答過的題跳過
    if (state.back) {
      var pq = QS[p - 1];   // 還沒拍的身分證（她不拍又改回來拍，10/28）也先接著問
      if (!(p < state.back && p <= N && (pq.when || pq.type === 'photo') && !answered(pq))) p = lostAt(p, state.back) || state.back;
      if (p === state.back) state.back = 0;
    }
    go(p);
  }

  // 「歡迎回來」：有照片、檔案沒存到，先回去補，補完回到上次的位置
  function resume() {
    var lost = state.pos === PRINT ? 0 : lostAt(1, state.pos);
    view = 'screen';
    state.wait = '';
    if (lost && !(state.back > state.pos)) state.back = state.pos;
    go(lost || state.pos);
  }

  function onOpt(i) {
    var q = curQ();
    if (!q || !q.opts[i]) return;
    var o = q.opts[i];
    hideMsg();
    if (q.type === 'single') {
      state.a[q.id] = o.t;
      save();
      paintOpts(q);
      if (fOf(o)) {
        var changed = updateFollow(q);
        updateNext(q, false);
        if (changed) scrollToEl(document.getElementById('next'));   // 接著填的框和「下一題」都要看得到
        return;
      }
      updateFollow(q);
      busy = true;   // 讓她看到勾勾再跳題
      setTimeout(function () { busy = false; advance(); }, 350);
      return;
    }
    var sel = selOf(q).slice();
    var k = sel.indexOf(o.t);
    removeMax();
    if (k >= 0) {
      sel.splice(k, 1);
    } else {
      if (o.ex) sel = [];
      else sel = sel.filter(function (t) { var x = optByT(q, t); return !(x && x.ex); });
      if (q.max && sel.length >= q.max) { showMax(i, q.max); return; }
      sel.push(o.t);
    }
    state.a[q.id] = sel;
    save();
    paintOpts(q);
    var shown = updateFollow(q) && activeFollow(q);
    updateNext(q, false);
    if (shown) scrollToEl(document.getElementById('next'));
  }

  function onNext() {
    var q = curQ();
    if (!q) return;
    var err = check(q);
    if (err) {
      showMsg(err);
      var f = document.getElementById('f_' + q.id) || document.getElementById('f_' + q.id + '_t') ||
        document.getElementById('f_' + q.id + (clean(state.a[q.id + '_from']) ? '_to' : '_from'));
      if (f && q.type !== 'multi') { try { f.focus(); } catch (e) { /* 略過 */ } }
      return;
    }
    if (q.type === 'range') {   // 日期寫法看不懂：提醒一次，同樣的字再按一次就照寫（不擋）
      var odd = rangeOdd(q), key = state.a[q.id + '_from'] + '|' + state.a[q.id + '_to'];
      if (odd && softOk !== key) { softOk = key; showMsg(odd, 'warn'); return; }
    }
    if (q.soft) {   // 她不拍身分證時打的字號、生日（10/28）：同上
      var warn = q.soft(), sk = q.id + '|' + state.a[q.id];
      if (warn && softOk !== sk) { softOk = sk; showMsg(warn, 'warn'); return; }
    }
    if (q.type === 'docs') docsLost = 0;
    if (q.when && q.type === 'text' && typeof state.a[q.id] !== 'string') { state.a[q.id] = ''; save(); }   // 跳過也算答過（answered）
    if (G_TOKEN && q.type === 'multi' && !isArr(state.a[q.id])) { state.a[q.id] = []; save(); }   // 手機一起報名：跳過也記下來，電腦上不再問
    advance();
  }
  // 從、到寫的字看不懂成民國日期 → 回傳提醒的話；都看得懂回傳空字串
  function rangeOdd(q) {
    var bad = [['從', '_from'], ['到', '_to']].filter(function (x) { var v = state.a[q.id + x[1]]; return clean(v) && !normDate(v); })
      .map(function (x) { return '「' + x[0] + '」寫的「' + clean(state.a[q.id + x[1]]) + '」'; });
    return bad.length ? bad.join('、') + '，\n看不出是哪一天。\n請寫成像 100/03/01 這樣。\n只記得大概的，照這樣也行，\n再按一次「' + nextLabel(q) + '」。' : '';
  }

  // 從確認頁、核對頁來改的：「回確認頁」先檢查這題再回去
  function onBack() {
    if (state.pos <= N && state.back >= SUBMIT) { onNext(); return; }
    if (state.fill && state.pos >= 1 && state.pos <= SUBMIT) { go(prevFill(state.pos)); return; }   // 載進來的：只退回電腦上要補的題，第一題再退＝回名單
    var p = step(state.pos - 1, -1);   // 條件題沒問的跳過
    if (p === 0 && state.pre && pOn()) {   // 從名單點進來的：第一題再退＝回名單（11/25；畫面位置回開場，名單按回開始畫面寫「正在幫 ○○ 報名」）
      state.pos = 0; pNewAsk = false; save();
      view = 'plist'; render();
      try { window.scrollTo(0, 0); } catch (e) { /* 舊瀏覽器 */ }
      return;
    }
    go(p);
  }
  // 載進來的（一起報名）：p 之前、電腦上要補的那一題；沒有＝0（開場頁的名單）。她手機上答過的不退回去，要改到確認頁按「改」（主辦 10/23）
  function prevFill(p) {
    for (var i = Math.min(p - 1, N); i >= 1; i--) if (state.fillQs.indexOf(QS[i - 1].id) >= 0 && shown(QS[i - 1])) return i;
    return 0;
  }
  function fillCount(n) {   // 電腦上要補的題：到第 n 題為止補了幾題、一共幾題
    var at = 0, all = 0;
    QS.forEach(function (q, i) { if (state.fillQs.indexOf(q.id) >= 0 && shown(q)) { all++; if (i + 1 <= n) at++; } });
    return { at: at, all: all };
  }

  function onChk(el) {
    confirmChecked = !confirmChecked;
    el.setAttribute('aria-checked', confirmChecked ? 'true' : 'false');
    var s = document.getElementById('send');
    if (s) s.setAttribute('aria-disabled', confirmChecked ? 'false' : 'true');
    hideMsg();
  }

  // ---------- 拍照、上傳 ----------
  // 照片縮到長邊 edge px 轉成 JPEG；瀏覽器把照片畫進 canvas 時會照 EXIF 自動轉正（iPhone 的 HEIC 在 Safari 也是這樣轉成 JPEG）
  function shrink(file, edge, quality, done) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      try {
        var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, edge / Math.max(w, h, 1));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(w * k));
        c.height = Math.max(1, Math.round(h * k));
        var g = c.getContext('2d');
        g.fillStyle = '#fff';   // 透明的地方變白底
        g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { done(b); }, 'image/jpeg', quality);
      } catch (e) { URL.revokeObjectURL(url); done(null); }
    };
    img.onerror = function () { URL.revokeObjectURL(url); done(null); };
    img.src = url;
  }

  // 身分證照片：縮到長邊 1600px
  function takeFile(q, file) {
    if (file.type && !/^image\//i.test(file.type)) { showMsg('請選一張照片。'); return; }
    working = q.id;
    refresh(q);
    shrink(file, MAX_EDGE, JPEG_Q, function (blob) {
      working = '';
      if (!blob) { refresh(q); if (curQ() === q) showMsg('這張照片打不開，請重拍或換一張。'); return; }
      keepFile(q, { blob: blob, mime: 'image/jpeg', name: q.fileKind + '.jpg', url: URL.createObjectURL(blob), label: '照片' });
    });
  }
  function keepFile(q, f) {
    dropFile(q.id);
    files[q.id] = f;
    state.had[q.id] = true;
    save();
    idbPut(q.id, f);   // 存進這台電腦：網頁重新打開不用重拍
    refresh(q);
    if (curQ() === q) scrollToEl(document.getElementById('retake') || document.getElementById('next'));   // 兩個大按鈕都要看得到
  }
  function dropFile(id) {
    if (files[id] && files[id].url) URL.revokeObjectURL(files[id].url);
    delete files[id];
  }

  // 勞保資料：可以一次選好幾個；PDF 原檔（10MB 內）、照片截圖縮到長邊 2400px
  function takeDocs(q, list) {
    var todo = Array.prototype.slice.call(list), room = MAX_DOCS - state.docs.length, errs = [];
    if (todo.length > room) { todo = todo.slice(0, Math.max(0, room)); errs.push('最多 ' + MAX_DOCS + ' 個檔案，多的沒有加進來。'); }
    working = q.id;
    refresh(q);
    (function step() {
      if (!todo.length) {
        working = '';
        refresh(q);
        if (curQ() === q) { if (errs.length) showMsg(errs.join('\n')); else scrollToEl(document.getElementById('next')); }
        return;
      }
      var file = todo.shift(), nm = file.name || '';
      if (/pdf/i.test(file.type) || /\.pdf$/i.test(nm)) {
        if (file.size > MAX_BYTES) errs.push('「' + nm + '」超過 10MB，太大了。');
        else addDoc({ blob: file, mime: 'application/pdf', name: nm, label: (nm || 'PDF 檔') + '（' + kb(file.size) + '）' });
        step();
        return;
      }
      if (file.type && !/^image\//i.test(file.type)) { errs.push('「' + nm + '」不是 PDF 或照片，不能上傳。'); step(); return; }
      shrink(file, DOC_EDGE, DOC_Q, function (blob) {
        if (!blob) errs.push('「' + (nm || '照片') + '」打不開，請改選下載的 PDF。');
        else addDoc({ blob: blob, mime: 'image/jpeg', name: nm, url: URL.createObjectURL(blob), label: (nm || '照片') + '（' + kb(blob.size) + '）' });
        step();
      });
    })();
  }
  function addDoc(f) {
    var k = 'doc_' + Date.now().toString(36) + '_' + (++docSeq);
    files[k] = f;
    state.docs.push({ k: k, label: f.label, mime: f.mime, size: f.blob.size });
    state.noLabor = false;   // 二選一
    docsLost = 0;
    save();
    idbPut(k, f);
  }
  // 「沒有任何勞保、農保紀錄」：按一次選、再按一次取消；已經選了檔案不能按（按鈕是 disabled）
  function onNoLabor() {
    var q = curQ();
    if (!q || q.type !== 'docs' || state.docs.length || working === q.id) return;
    state.noLabor = !state.noLabor;
    docsLost = 0;
    save();
    render();
    if (state.noLabor) scrollToEl(document.getElementById('next'));
  }
  // 她不想拍身分證（10/28）：拍過的照片刪掉（不留在這台電腦），改問字號、生日、戶籍地址；「改成拍身分證」回第 1 題，打的字清掉
  function onNoId() {
    var q = curQ();
    if (!q || q.id !== 'idFront' || !noIdOk() || (state.fill && !state.lineId) || working) return;
    ['idFront', 'idBack'].forEach(function (k) { dropFile(k); idbDel(k); delete state.had[k]; });

  function loadBatches() {

  // 只列開課日 ≥ 今天（台灣時間）的；照開課日早到晚排，同一天照雲端給的順序；不能選的也照日期排在原本的位置（10/20）。
  // 報名管道（11/14）：雲端已經照管道分開回，這裡再擋一次——台中 LINE 報名的人只留合作單位的，其他人不留合作單位的
  function gotBatches(list) {

    list.forEach(function (b, i) {

      if ((b['管道'] === LINE_CH) !== isHealth()) return;   // 合作單位的代碼：雲端只回她那家的保健課梯次
      if (b['梯次'] && d && d >= today) keep.push({ b: b, d: d, i: i });
    });
    keep.sort(function (x, y) { return x.d < y.d ? -1 : x.d > y.d ? 1 : x.i - y.i; });

  // ---------- 送出，讀取資料（規格 2-2） ----------
  function onSubmit() {

    var list = (state.noId ? [] : [{ k: 'idFront', kind: '身分證正面' }, { k: 'idBack', kind: '身分證反面' }])
      .concat(state.noLabor || preUse() ? [] : state.docs.map(function (x) { return { k: x.k, kind: '勞保資料' }; }));   // 從名單點進來的：勞保雲端自己拿
    busy = true;

      if (state.lineId) data['LINE報名'] = state.lineId;   // 台中 LINE 報名載進來的（11/14）：雲端只讓她報合作單位的梯次
      if (state.pre) data['事先建檔'] = state.pre.id;   // 從「已有勞保資料的學員」名單點進來的（11/25）：沒附勞保檔＝雲端拿事先建檔的
      // 上次讀取失敗、資料已經存了：這次送的跟存進去的一模一樣才帶編號（不會多存一列）。改過答案、梯次、照片、勞保檔就不帶、
      // 存成新的一列：帶編號雲端就不再存，試算表那一列會停在舊的答案（舊的那列之後她產出文件時標重複；KNOWN 135）
      if (state.pend && sigOf(data) === state.pendSig) data['編號'] = state.pend;

        console.log('測試模式：沒有連雲端服務。要送出的資料（檔案內容省略）：\n' + JSON.stringify(preview(data), null, 2));
        showMsg('測試模式：沒有連雲端服務，資料沒有送出。\n（要送的內容印在瀏覽器的 console）', 'warn');

        state.wait = '';
        if (r.ok) { gotRead(r.data); return; }
        if (r.data && Number(r.data['編號']) > 0) { state.pend = Number(r.data['編號']); state.pendSig = sigOf(data); }   // 失敗但已經存進試算表了：記住存的是哪一份
        view = 'screen';
