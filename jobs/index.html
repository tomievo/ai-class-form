    { id: 'jobTitle', type: 'text', show: worked, title: '你在那裡做什麼職位？', hint: '例如：作業員、店員。不知道怎麼寫可以按「跳過」' },

    { id: 'pcSkills', type: 'multi', req: true, show: function () { return state.a.pc === '會'; }, title: '電腦會哪些？', hint: '可以選好幾個，選好按「下一題」',
      opts: [{ t: '開機、用滑鼠', o: '電腦基本操作' }, { t: '打字、用 Word', o: '文書處理' }, { t: '上網、收信', o: '網際網路' },
        { t: '做網頁', o: '網頁編輯' }, { t: '用 Excel 等軟體', o: '商業軟體' }, { t: '寫程式', o: '程式設計' }] },
    { id: 'vehicle', type: 'single', title: '你自己有機車或汽車嗎？', hint: '家人接送、坐公車，選「沒有」',
      opts: [{ t: '有', o: '自備' }, { t: '沒有', o: '無' }] },
    { id: 'license', type: 'single', title: '你有什麼駕照？', hint: '機車、汽車都有，選「汽車」',
      opts: [{ t: '沒有', o: '無' }, { t: '輕型機車', n: '50cc 以下', o: '輕型機車駕照' }, { t: '普通重型機車', o: '重型機車駕照' }, { t: '汽車', o: '普通小型車駕照' }] },
    { id: 'retire', type: 'single', title: '你退休了嗎？',
      opts: [{ t: '還沒退休', o: '未退休' }, { t: '退休了，有在領老年年金或退休金', o: '已退休並領取老年年金或退休金者' },
        { t: '退休了，還沒開始領', o: '已退休尚未領取老年年金或退休金者' }] }
  ];
  var BY = {};
  QS.forEach(function (q) {
    BY[q.id] = q;
    if (q.opts) q.opts = q.opts.map(function (o) {
      if (typeof o !== 'string') return o;
      var m = /^(.+?)（(.+)）$/.exec(o);   // 「工廠作業員（組裝、包裝、品檢）」：畫面分成主字＋小字，送出整串
      return m ? { t: m[1], n: m[2], o: o } : { t: o };
    });
  });
  function shown() { return QS.filter(function (q) { return !q.show || q.show(); }); }

  // ---------- 日期 ----------
  var NOW = new Date(), NOW_Y = NOW.getFullYear(), NOW_M = NOW.getMonth() + 1, ROC_NOW = NOW_Y - 1911;
  function pad(n) { return ('0' + n).slice(-2); }
  function range(a, b) { var r = []; for (var i = a; i <= b; i++) r.push(i); return r; }

  // ---------- 狀態（存在這支手機） ----------
  // pos：'start'、題目 id、'review'、'done'、'redo'；a：答案；seen：走過的題；warned：提醒過的值；ret：從確認頁按「改」進來；num：號碼
  var state = load();
  var err = '', warn = '', sending = false, shownAt = 0;
  function blank() { return { v: 1, pos: 'start', a: {}, seen: {}, warned: {}, ret: false, num: '' }; }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (s && s.v === 1 && s.a && typeof s.a === 'object') { s.seen = s.seen || {}; s.warned = s.warned || {}; return s; }
    } catch (e) { /* 壞掉、不給用：重新開始 */ }
    return blank();
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* 私密模式：照樣能填完 */ } }

  // ---------- 小工具 ----------
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function half(s) { return String(s || '').replace(/[０-９Ａ-Ｚａ-ｚ＠．]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }); }
  function digits(s) { return half(s).replace(/\D/g, ''); }
  function idNo() { return half(state.a.idno).replace(/[\s\u3000\-]/g, '').toUpperCase(); }
  function email() { return half(state.a.email).replace(/[\s\u3000]+/g, ''); }
  function clean(s) { return String(s || '').replace(/[\r\n\u2028\u2029]+/g, ' ').replace(/[ \t\u3000]+/g, ' ').trim(); }
  function optOf(q, t) { return q.opts.filter(function (o) { return o.t === t; })[0]; }
  function outT(o) { return o.o || o.t; }
  function isSel(q, o) { var v = state.a[q.id]; return q.type === 'multi' ? Array.isArray(v) && v.indexOf(o.t) >= 0 : v === o.t; }
  function idChecksumOk(id) {   // 身分證、新式居留證：第一個字母換成 10–35，加權總和要被 10 整除
    var n = 'ABCDEFGHJKLMNPQRSTUVXYWZIO'.indexOf(id.charAt(0)) + 10, sum = Math.floor(n / 10) + (n % 10) * 9;
    for (var i = 1; i < 9; i++) sum += +id.charAt(i) * (9 - i);
    return (sum + +id.charAt(9)) % 10 === 0;
  }
  function emailOdd(e) {   // 常見打錯：網域結尾 .con／.cm／.om、gmail 拼錯、有中文
    return /[^\x21-\x7e]/.test(e) || !/\.[a-z]{2,}$/i.test(e) || /\.(con|cm|om|comm|cmo)$/i.test(e) ||
      /@(gmial|gmai|gamil|gmaill|gmali|gnail|yaho|yahooo|hotmial|hotmal)\./i.test(e) || /@gmail\.(?!com$)/i.test(e);
  }
  function ymOut(ym, unknownMonth) {   // {y:民國, m:'1'…'12'／'x'} → 西元 YYYY-MM
    var y = +ym.y + 1911, m = ym.m === 'x' ? unknownMonth : +ym.m;

  function rocText(ym) { return '民國 ' + ym.y + ' 年' + (ym.m === 'x' ? '（月份不記得）' : ' ' + ym.m + ' 月'); }

  // ---------- 檢查：擋（err）＝空白或雲端一定不收；提醒（warn）＝提醒一次，再按一次照樣過 ----------
  function check(q) {
    var a = state.a[q.id];
    switch (q.id) {
      case 'name': return clean(a) ? {} : { err: '請寫你的姓名' };
      case 'idno':
        var id = idNo();
        if (!id) return { err: '請寫身分證字號' };
        if (!/^[A-Z]\d{9}$/.test(id)) return { err: '身分證字號是 1 個英文字母加 9 個數字，請對著身分證再看一下' };
        return idChecksumOk(id) ? {} : { warn: '這個身分證字號好像有一個字不對，請對著身分證再看一次。確定沒錯，再按一次「' + nextLabel() + '」。', sig: id };
      case 'birth':
        if (!a || !a.y || !a.m || !a.d) return { err: '請把年、月、日都選好' };
        if (+a.d > daysIn(a.y, a.m)) return { err: a.m + ' 月沒有 ' + a.d + ' 日，請再看一下' };
        return {};
      case 'phone': return /^09\d{8}$/.test(digits(a)) ? {} : { err: digits(a) ? '手機號碼要 09 開頭、10 個數字，請再看一下' : '請寫手機號碼' };
      case 'email':
        var e = email();
        if (!e) return { err: '請寫 Email' };
        if (!/^[^@]+@[^@]+\.[^@]+$/.test(e)) return { err: 'Email 要有「@」和「.」，請再看一下' };
        return emailOdd(e) ? { warn: '這個 Email 好像有打錯的地方（例如 gmail.com 拼錯）。請再看一次；確定沒錯，再按一次「' + nextLabel() + '」。', sig: e } : {};
      case 'addr':
        if (!a || !a.city) return { err: '請選縣市' };
        if (!a.dist) return { err: '請選區（鄉、鎮）' };
        return clean(a.detail) ? {} : { err: '請寫路、巷、號（幾樓）' };
      case 'years': return a ? {} : { err: '請選一個' };
      case 'company': return clean(a) ? {} : { err: '請寫公司或店的名字；記不清楚寫大概就好' };
      case 'from':
        if (!a || !a.y) return { err: '請選哪一年開始' };
        return a.m ? {} : { err: '請選幾月；不記得就選「不記得」' };
      case 'to':
        if (!a || !a.y) return { err: '請選做到哪一年' };
        if (!a.m) return { err: '請選幾月；不記得就選「不記得」' };
        // 離開工作要半年以上才符合補助（切結書「退出職場已逾一百八十日」）：點錯成最近的年月就擋（Tomi 11/19 指定要擋，要離現在 8 個月以上：「6 個月太緊繃了…至少要 8 個月」）
        var endYM = ymOut(a, 12).split('-');
        if (NOW_Y * 12 + NOW_M - (+endYM[0] * 12 + +endYM[1]) < 8) return { err: '做到的時間離現在不到 8 個月。請再看一下，是不是選錯年或月了？' };
        var s = state.a.from;
        if (s && s.y && s.m && ymOut(a, 12) < ymOut(s, 1)) return { warn: '結束的時間比開始還早，請再看一下。確定沒錯，再按一次「' + nextLabel() + '」。', sig: JSON.stringify([a, s]) };
        return {};
      case 'pcSkills': return Array.isArray(a) && a.length ? {} : { err: '請至少選一個' };
    }
    if (q.type === 'single') return a && optOf(q, a) ? {} : { err: '請選一個' };
    return {};
  }
  function done(q) {   // 確認頁按「改」之後：還沒走過、或必填還空著的題要補
    if (!state.seen[q.id]) return false;
    return !check(q).err;
  }

  // ---------- 送出的答案（規格第 3 節的鍵） ----------
  function answers() {
    var a = state.a, out = {
      '姓名': clean(a.name), '身分證字號': idNo(),
      '生日': (+a.birth.y + 1911) + '-' + pad(a.birth.m) + '-' + pad(a.birth.d),

      '最後工作': null,
      '想做': a.want,
      '電腦': a.pc === '會' ? BY.pcSkills.opts.filter(function (o) { return isSel(BY.pcSkills, o); }).map(outT) : [],
      '汽機車': outT(optOf(BY.vehicle, a.vehicle)), '駕照': outT(optOf(BY.license, a.license)), '退休身分': outT(optOf(BY.retire, a.retire))
    };
    if (worked()) out['最後工作'] = { '類別': outT(optOf(BY.jobKind, a.jobKind)), '公司': clean(a.company), '職稱': clean(a.jobTitle), '內容': clean(a.jobDesc),
      '起': ymOut(a.from, 1), '迄': ymOut(a.to, 12) };

  }
  function display(q) {   // 確認頁上的答案
    var a = state.a[q.id];
    switch (q.type) {
      case 'birth': return '民國 ' + a.y + ' 年 ' + a.m + ' 月 ' + a.d + ' 日';
      case 'addr': return a.city + a.dist + clean(a.detail);
      case 'years': return yearsLabel(a);
      case 'ym': return rocText(a);
      case 'end': return rocText(a);
      case 'multi': return q.opts.filter(function (o) { return isSel(q, o); }).map(function (o) { return o.t; }).join('、');
      case 'single': var o = optOf(q, a); return o.t + (o.n ? '（' + o.n + '）' : '');
    }
    if (q.id === 'idno') return idNo();
    if (q.id === 'phone') return digits(a);
    if (q.id === 'email') return email();
    return clean(a) || '（沒有寫）';
  }
  function yearsLabel(v) { return v === 'none' ? '沒有工作過' : v === 'lt1' ? '未滿 1 年' : v + ' 年'; }

  // ---------- 畫面 ----------
  var app = document.getElementById('app');
  function banner() {
    if (!API) return '<p class="tm">測試模式：資料不會送出</p>';
    return LOCAL ? '<p class="tm">練習畫面：資料只送到這台電腦的練習後台</p>' : '';
  }
  function render(focus) {
    shownAt = Date.now();
    var p = state.pos, h;
    if (!REGION) h = '<h1>這個連結不完整，請工作人員重新給一次</h1>';
    else if (p === 'start') h = startHTML();
    else if (p === 'review') h = reviewHTML();
    else if (p === 'done') h = doneHTML();
    else if (p === 'redo') h = redoHTML();
    else h = questionHTML(BY[p]);
    app.innerHTML = (p === 'done' ? '' : banner()) + h;
    if (focus !== false) {
      var t = app.querySelector('.qt, h1, .num');
      if (t) { t.setAttribute('tabindex', '-1'); t.focus({ preventScroll: true }); }
      window.scrollTo(0, 0);
    }
  }
  function startHTML() {
    var started = Object.keys(state.a).length > 0;
    // 開頭頁只有標題和按鈕（Tomi 11/19：「求職登記然後開始，這樣就好了」，地區、輔助文字都拿掉）
    return '<h1>求職登記</h1>' +
      '<button type="button" class="btn" data-act="go">' + (started ? '接著填' : '開始') + '</button>';
  }
  function nextLabel() { return state.ret ? '改好了' : '下一題'; }
  function topHTML(label, pct) {
    return '<div class="top"><button type="button" class="back" data-act="back">‹ 上一題</button>' +
      '<span class="count">' + label + '</span></div>' +
      '<div class="bar" aria-hidden="true"><span style="width:' + pct + '%"></span></div>';
  }
  function selectHTML(id, label, list, val, srLabel) {   // list：[[值, 字]…]
    var h = '<label class="flabel' + (srLabel ? ' sr' : '') + '" for="' + id + '">' + esc(label) + '</label><select class="field" id="' + id + '"><option value="">請選</option>';
    list.forEach(function (x) { h += '<option value="' + esc(x[0]) + '"' + (String(val || '') === String(x[0]) ? ' selected' : '') + '>' + esc(x[1]) + '</option>'; });
    return h + '</select>';
  }
  function monthsUpTo(rocY) { return range(1, +rocY === ROC_NOW ? NOW_M : 12).map(function (m) { return [m, m + ' 月']; }); }
  function ymFields(prefix, v, fromY) {
    var years = range(fromY, ROC_NOW).reverse().map(function (y) { return [y, '民國 ' + y + ' 年（' + (y + 1911) + '）']; });
    return '<div class="ym">' + selectHTML(prefix + 'Y', '哪一年', years, v.y) +

  }
  function questionHTML(q) {
    var list = shown(), i = list.indexOf(q), a = state.a[q.id], h;
    h = topHTML('第 ' + (i + 1) + ' 題／共 ' + list.length + ' 題', Math.round(i / list.length * 100)) +
      '<h2 class="qt">' + esc(q.title) + '</h2>' + (q.hint ? '<p class="hint">' + esc(q.hint) + '</p>' : '');
    var nextBtn = true;
    if (q.type === 'text') {
      h += '<label class="flabel sr" for="txt">' + esc(q.title) + '</label>' + (q.lines
        ? '<textarea class="field" id="txt" rows="4" maxlength="200">' + esc(a || '') + '</textarea>'
        : '<input class="field" id="txt" ' + (q.tel ? 'type="tel" inputmode="tel" autocomplete="tel" maxlength="20"'
          : q.email ? 'type="email" inputmode="email" autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="100"'
          : q.id === 'idno' ? 'type="text" autocapitalize="characters" autocorrect="off" spellcheck="false" autocomplete="off" maxlength="14"'
          : q.id === 'name' ? 'type="text" autocomplete="name" maxlength="50"' : 'type="text" maxlength="100"') +
        ' value="' + esc(a || '') + '">');
    } else if (q.type === 'birth') {
      var b = a || {};
      h += '<div class="row3"><div>' + selectHTML('bY', '民國幾年', range(20, ROC_NOW - 15).map(function (y) { return [y, y + ' 年']; }), b.y) + '</div>' +
        '<div>' + selectHTML('bM', '幾月', range(1, 12).map(function (m) { return [m, m + ' 月']; }), b.m) + '</div>' +
        '<div>' + selectHTML('bD', '幾日', range(1, daysIn(b.y, b.m)).map(function (d) { return [d, d + ' 日']; }), b.d) + '</div></div>';
    } else if (q.type === 'addr') {
      var ad = a || {}, mine = REGIONS[REGION].cities;
      var opt = function (c) { return '<option value="' + c + '"' + (ad.city === c ? ' selected' : '') + '>' + c + '</option>'; };
      h += '<label class="flabel" for="aC">縣市</label><select class="field" id="aC"><option value="">請選</option>' +
        '<optgroup label="這一區">' + mine.map(opt).join('') + '</optgroup><optgroup label="其他縣市">' +
        AREAS.map(function (x) { return x[0]; }).filter(function (c) { return mine.indexOf(c) < 0; }).map(opt).join('') + '</optgroup></select>';
      if (ad.city) h += selectHTML('aD', '區（鄉、鎮）', DISTS[ad.city].map(function (d) { return [d, d]; }), ad.dist);
      h += '<label class="flabel" for="aT">路、巷、號、樓</label><input class="field" id="aT" type="text" autocomplete="off" maxlength="100" placeholder="例如：光復路一段100號3樓" value="' + esc(ad.detail || '') + '">';
    } else if (q.type === 'years') {
      h += selectHTML('yrs', q.title, [['none', '沒有工作過'], ['lt1', '未滿 1 年']].concat(range(1, 50).map(function (n) { return [n, n + ' 年']; })), a, true);
    } else if (q.type === 'ym') {

      var e = a || {}, st = state.a.from || {};
      // 沒有「現在還在做」（Tomi 11/19：來上課的都是待業中，這個選項不合理）
      h += ymFields('e', e.now ? {} : e, +st.y || birthRoc() + 12);
    } else {
      h += '<div class="opts ' + q.type + '" role="' + (q.type === 'single' ? 'radiogroup' : 'group') + '" aria-label="' + esc(q.title) + '">';
      q.opts.forEach(function (o, k) {
        h += '<button type="button" class="opt" role="' + (q.type === 'single' ? 'radio' : 'checkbox') + '" aria-checked="' + isSel(q, o) + '" data-opt="' + k + '">' +
          '<span class="mark">' + CHECK + '</span><span class="t">' + esc(o.t) + (o.n ? ' <span class="note">（' + esc(o.n) + '）</span>' : '') + '</span></button>';
      });
      h += '</div>';
      nextBtn = q.type === 'multi' || !!a;   // 單選：點了自動下一題；回來改的時候才有按鈕
    }
    if (err) h += '<div class="box err" role="alert"><p>' + esc(err) + '</p></div>';
    if (warn) h += '<div class="box warn" role="alert"><p>' + esc(warn) + '</p></div>';
    if (nextBtn) {
      var skip = q.type === 'text' && !q.req && !clean(a) && !state.ret;
      h += '<button type="button" class="btn' + (skip ? ' btn2' : '') + '" data-act="next" id="nextBtn">' + (skip ? '跳過' : nextLabel()) + '</button>';
    }
    return h;
  }
  function birthRoc() { return state.a.birth && +state.a.birth.y ? +state.a.birth.y : 20; }
  function reviewHTML() {
    var h = topHTML('最後一步', 100) + '<h2 class="qt">確認資料</h2><p class="hint">請一題一題看過，不對的按「改」。</p><ul class="rv">';
    shown().forEach(function (q) {
      var ok = !check(q).err;
      h += '<li><div class="rt"><div class="rq">' + esc(q.title) + '</div><div class="ra">' + (ok ? esc(display(q)) : '<span style="color:var(--err)">還沒填</span>') + '</div></div>' +

    h += '</ul>';
    if (err) h += '<div class="box err" role="alert"><p>' + esc(err) + '</p></div>';
    h += '<button type="button" class="btn" data-act="send"' + (sending ? ' aria-disabled="true"' : '') + '>' + (sending ? '正在送出，請稍等…' : '都對了，送出') + '</button>';
    return h;
  }
  function doneHTML() {
    return '<div class="donewrap"><p class="num" aria-label="號碼 ' + esc(state.num.split('').join(' ')) + '">' + esc(state.num) + '</p>' +
      '<p class="numtxt">輪到你的時候，<br>把這組號碼給工作人員看</p>' +
      '<button type="button" class="linkbtn" data-act="redo">重新填一份</button></div>';
  }
  function redoHTML() {
    return '<h1>要重新填一份嗎？</h1><p class="lead">手機上的號碼 ' + esc(state.num) + ' 會清掉，要從頭再填一次。</p>' +
      '<button type="button" class="btn" data-act="keep">不要，回到號碼</button>' +
      '<button type="button" class="btn btn2" data-act="wipe">確定，重新填一份</button>';
  }

  // ---------- 動作 ----------
  function go(pos) { err = ''; warn = ''; state.pos = pos; save(); render(); }
  function keep() {   // 把畫面上打的、選的字存起來
    var q = BY[state.pos], v = function (id) { var el = document.getElementById(id); return el ? el.value : undefined; };
    if (!q) return;
    if (q.type === 'text') { if (v('txt') !== undefined) state.a[q.id] = v('txt'); }
    else if (q.type === 'birth') state.a.birth = { y: v('bY'), m: v('bM'), d: v('bD') };
    else if (q.type === 'addr') { var o = state.a.addr || {}; state.a.addr = { city: v('aC'), dist: v('aC') === o.city ? (v('aD') || '') : '', detail: v('aT') }; }
    else if (q.type === 'years') state.a.years = v('yrs');
    else if (q.type === 'ym') state.a.from = { y: v('sY'), m: v('sM') };
    else if (q.type === 'end') state.a.to = { y: v('eY'), m: v('eM') };
  }
  function after(q) {   // 下一個要去哪：照順序下一題；從確認頁進來的，去還沒補的那一題、都好了回確認頁
    var list = shown(), i;
    if (state.ret) {
      for (i = 0; i < list.length; i++) if (!done(list[i])) return list[i].id;
      state.ret = false;
      return 'review';
    }
    i = list.indexOf(q);
    return i >= 0 && i < list.length - 1 ? list[i + 1].id : 'review';
  }
  function next() {
    var q = BY[state.pos];
    keep();
    var c = check(q);
    if (c.err) { err = c.err; warn = ''; save(); render(false); focusField(); return; }
    if (c.warn && state.warned[q.id] !== c.sig) { state.warned[q.id] = c.sig; err = ''; warn = c.warn; save(); render(false); return; }
    state.seen[q.id] = true;
    go(after(q));
  }
  function back() {
    keep();
    var list = shown(), i = state.pos === 'review' ? list.length : list.indexOf(BY[state.pos]);
    go(i <= 0 ? 'start' : list[i - 1].id);
  }
  function focusField() { var f = app.querySelector('#txt, select.field, input.field'); if (f && !f.value) f.focus(); }
  function pick(q, k) {
    var o = q.opts[k];
    err = ''; warn = '';
    if (q.type === 'single') {
      state.a[q.id] = o.t; save(); render(false);
      setTimeout(function () { if (state.pos === q.id) next(); }, 250);   // 點了自動下一題（先讓她看到勾起來）
      return;
    }
    var v = Array.isArray(state.a[q.id]) ? state.a[q.id].slice() : [], at = v.indexOf(o.t);
    if (at >= 0) v.splice(at, 1); else v.push(o.t);
    state.a[q.id] = v; save(); render(false);
  }
  function send() {
    if (sending) return;
    var bad = shown().filter(function (q) { return check(q).err; })[0];
    if (bad) { state.ret = true; state.pos = bad.id; err = check(bad).err; save(); render(); return; }
    sending = true; err = ''; render(false);
    var body = { '分署': REGION, '答案': answers() };
    var p;
    if (!API) { console.log('測試模式：要送的資料', body); p = Promise.resolve({ ok: true, '號碼': '0000' }); }   // eslint-disable-line no-console
    else {
      var ctl = typeof AbortController === 'function' ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctl) ctl.abort(); }, WAIT_MS);
      p = fetch(API + '/api/jobs/intake', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
        signal: ctl ? ctl.signal : undefined })
        .then(function (r) { return r.json().catch(function () { return { ok: false }; }); })
        .finally(function () { clearTimeout(timer); });
    }
    p.then(function (res) {
      sending = false;
      var num = res && String(res['號碼'] || '');
      if (!res || !res.ok || !/^\d{4}$/.test(num)) {
        err = String((res && (res['代碼'] ? res['錯誤'] : res['訊息'])) || '現在送不出去').replace(/[。．.！!\s]+$/, '') + '。資料還在手機裡，可以按「改」修正，或再按一次「都對了，送出」。';
        render(false); return;
      }
      state.num = num; state.pos = 'done'; save(); render();
    }, function () {
      sending = false;
      err = '網路好像斷了，資料沒有送出去，但還留在手機裡。請確認手機有網路（Wi-Fi 或行動數據），再按一次「都對了，送出」。';
      render(false);
    });
  }

  app.addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b || Date.now() - shownAt < GUARD_MS) return;
    var act = b.getAttribute('data-act'), k = b.getAttribute('data-opt'), ed = b.getAttribute('data-edit');
    if (k !== null && BY[state.pos]) { pick(BY[state.pos], +k); return; }
    if (ed) { state.ret = true; go(ed); return; }
    if (act === 'go') { state.ret = false; var first = shown().filter(function (q) { return !state.seen[q.id]; })[0]; go(first ? first.id : 'review'); }
    else if (act === 'back') back();
    else if (act === 'next') next();
    else if (act === 'send') send();
    else if (act === 'redo') go('redo');
    else if (act === 'keep') go('done');
    else if (act === 'wipe') { state = blank(); go('start'); }
  });
  app.addEventListener('input', function (ev) {
    keep(); save();
    var q = BY[state.pos], b = document.getElementById('nextBtn');
    if (q && q.type === 'text' && !q.req && b && !state.ret) { var has = !!clean(state.a[q.id]); b.textContent = has ? '下一題' : '跳過'; b.classList.toggle('btn2', !has); }
    if (ev.target.tagName === 'SELECT') {   // 換了年、月、縣市：日、月、區的清單跟著換
      var id = ev.target.id;
      if (id === 'eY' || id === 'eM') { if (state.a.to) delete state.a.to.now; }
      if (id === 'sY' && state.a.from && +state.a.from.y === ROC_NOW && +state.a.from.m > NOW_M) state.a.from.m = '';
      if (id === 'eY' && state.a.to && +state.a.to.y === ROC_NOW && +state.a.to.m > NOW_M) state.a.to.m = '';
      if (id === 'bY' || id === 'bM' || id === 'aC' || id === 'sY' || id === 'eY' || id === 'eM') {
        save(); render(false);
        var el = document.getElementById(id === 'aC' ? 'aD' : id); if (el) el.focus();
      } else if (id === 'yrs' || id === 'eM') { save(); }
    }
  });
  app.addEventListener('keydown', function (ev) {   // 一行的打字題按 Enter＝下一題
    if (ev.key === 'Enter' && ev.target.tagName === 'INPUT') { ev.preventDefault(); next(); }
  });
  if (state.pos !== 'start' && state.pos !== 'review' && state.pos !== 'done' && state.pos !== 'redo' && !(BY[state.pos] && shown().indexOf(BY[state.pos]) >= 0)) state.pos = 'start';
  if (state.pos === 'redo') state.pos = 'done';
  if (state.pos === 'done' && !/^\d{4}$/.test(state.num || '')) state.pos = 'start';
  render();
  // 先叫醒雲端（雲端閒置會睡著，第一個請求要等它開機約 10 秒；同 ../line/index.html）
  if (REGION && API && !LOCAL && state.pos !== 'done') { try { fetch(API + '/health', { mode: 'no-cors', cache: 'no-store' }).catch(function () {}); } catch (e) { /* 略過 */ } }
})();
</script>
</body>
</html>
