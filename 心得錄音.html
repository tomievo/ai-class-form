<!--
  心得錄音網頁（2026-10-17；規格：docs/規格_現場報名雲端版.md 第 12 節）
  - 學員：掃小卡上的 QR（網址 心得錄音.html#t=<她的代碼>）→ 先出現她的全名、按「是我」→ 一題一畫面，用講的回答 4 題
  - 現場人員：網址加 #現場 → 輸入店裡的通關碼（記在這台手機）→ 選梯次 → 點名字 → 同樣的畫面幫她錄
  - 錄音（MediaRecorder：iPhone Safari 是 audio/mp4、Android Chrome 是 audio/webm）每段最長 5 分鐘；
    錄好先存在這台手機的 IndexedDB，傳上去、雲端轉成文字存好了才刪；傳不上去留著，「再試一次」，重新整理也不會掉
  - 不載任何外部資源：只用系統字型，CSS／JS 全部在這個檔案裡；畫面上不出現主辦人的名字

<style>
:root{
  --ink:#111111;--ink2:#2b2b2b;--line:#595959;--bg:#ffffff;--soft:#efefec;
  --pri:#0b4f9c;--pri-dk:#083b75;--pri-bg:#e3edfa;--rec:#b00000;--rec-dk:#7d0000;
  --err:#a00000;--err-bg:#fff0f0;--warn:#7a4a00;--warn-bg:#fff4d8;--ok:#1b6a2e;--ok-bg:#ecf7ee;
  color-scheme:light
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Heiti TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;font-size:22px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
button,input,textarea{font:inherit;color:inherit;margin:0}
button{-webkit-appearance:none;appearance:none;cursor:pointer;touch-action:manipulation}
h1{font-size:32px;line-height:1.35;font-weight:800;margin:32px 0 20px}
.nw{white-space:nowrap}
.lead{font-size:24px;margin:0 0 14px}
.hint{font-size:22px;color:var(--ink2);margin:0 0 8px}
.small{font-size:20px;color:var(--ink2);margin:16px 0 0}
.tm{margin:12px 0 0;padding:8px 12px;border:3px dashed var(--ink2);border-radius:12px;background:var(--warn-bg);font-size:20px;font-weight:800;text-align:center}
.who{margin:14px 0 0;font-size:22px;font-weight:800;color:var(--ink2)}

/* 上方：上一題＋第幾題 */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 0 8px}
.back{min-height:64px;padding:8px 18px 8px 12px;border:3px solid var(--ink2);border-radius:14px;background:#fff;color:var(--ink);font-size:22px;font-weight:700}
.back:active{background:var(--soft)}
.count{font-size:22px;font-weight:800;padding:6px 0 6px 12px}
.bar{height:14px;border:2px solid var(--ink2);border-radius:8px;background:#fff;overflow:hidden}
.bar span{display:block;height:100%;background:var(--pri)}

/* 名字、題目 */
.hello{font-size:44px;line-height:1.3;font-weight:800;margin:40px 0 6px;overflow-wrap:anywhere}
.ask{font-size:30px;font-weight:800;margin:0 0 8px}
.qt{font-size:32px;line-height:1.4;font-weight:800;margin:24px 0 8px}
.qt:focus{outline:none}
.qs{font-size:24px;line-height:1.45;font-weight:700;margin:10px 0 0}
.tip{font-size:24px;line-height:1.45;font-weight:700;color:var(--ink2);margin:0 0 16px}
.qs+.tip{font-size:22px;margin:4px 0 0}

/* 提醒框（有粗框和文字，不只靠顏色） */
.box{margin:14px 0;padding:14px 16px;border:3px solid;border-radius:14px;font-size:22px;font-weight:700;line-height:1.5}
.box p{margin:0}
.box p+p{margin-top:8px}
.err{border-color:var(--err);background:var(--err-bg);color:var(--err)}
.warn{border-color:var(--warn);background:var(--warn-bg);color:var(--ink)}
.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
.got{margin:20px 0;padding:18px 16px;border:5px solid var(--ok);border-radius:16px;background:var(--ok-bg);font-size:34px;font-weight:800;text-align:center}
.got small{display:block;font-size:22px;font-weight:700}
.big{font-size:30px;line-height:1.4;font-weight:800}

/* 按鈕 */
.btn{display:block;width:100%;min-height:72px;margin:20px 0 0;padding:14px 18px;border:3px solid var(--pri);border-radius:14px;background:var(--pri);color:#fff;font-size:26px;font-weight:800;line-height:1.3;text-align:center;text-decoration:none}
.btn:active{background:var(--pri-dk)}
.btn2{background:#fff;color:var(--pri-dk)}
.btn2:active{background:var(--pri-bg)}
.btn svg{width:34px;height:34px;margin-right:10px;vertical-align:-6px}
.rec{min-height:112px;border-color:var(--rec);background:var(--rec);font-size:32px}
.rec:active{background:var(--rec-dk)}
.stop{min-height:112px;border-color:var(--ink);background:var(--ink);font-size:32px}
.stop:active{background:#000}
.more{background:#fff;border-color:var(--rec);color:var(--rec)}
.more:active{background:var(--err-bg)}
.foot{margin:36px 0 0;text-align:center}
.linkbtn{min-height:56px;padding:8px 16px;border:0;background:none;color:var(--ink2);font-size:22px;text-decoration:underline}

/* 錄音中：會動的紅點＋計時 */
.recbox{margin:26px 0 0;padding:20px 16px;border:5px solid var(--rec);border-radius:18px;text-align:center}
.recnow{display:flex;align-items:center;justify-content:center;gap:14px;font-size:30px;font-weight:800;color:var(--rec)}
.dot{width:30px;height:30px;border-radius:50%;background:var(--rec);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.45);opacity:.45}}
.clock{margin:8px 0 0;font-size:60px;line-height:1.2;font-weight:800;font-variant-numeric:tabular-nums}
.left{margin:4px 0 0;font-size:22px;font-weight:800}
.left.soon{color:var(--rec)}
.goal{margin:2px 0 0;font-size:24px;font-weight:800}
.goal.met{color:var(--ok)}

/* 等候 */
.spin{width:72px;height:72px;margin:28px auto;border:8px solid var(--pri-bg);border-top-color:var(--pri);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:4s}.dot{animation-duration:3s}}

/* 現場人員：通關碼、梯次、名單 */

.field{display:block;width:100%;min-height:72px;padding:14px 16px;border:3px solid var(--ink2);border-radius:14px;background:#fff;color:var(--ink);font-size:36px;letter-spacing:.3em;-webkit-appearance:none;appearance:none}
.field:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri)}
.list{list-style:none;margin:12px 0 0;padding:0}
.row{display:block;width:100%;min-height:80px;margin:0 0 14px;padding:12px 16px;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);text-align:left}
.row:active{background:var(--soft)}
/* 名單一位一格：上面點名字錄音，下面「寫成心得」 */
.prow{margin:0 0 16px;border:3px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.pick{display:block;width:100%;min-height:80px;padding:12px 16px;border:0;background:#fff;color:var(--ink);text-align:left}
.pick:active{background:var(--soft)}
.wbtn{display:block;width:calc(100% - 24px);min-height:64px;margin:0 12px 12px;padding:8px 14px;border:3px solid var(--pri);border-radius:12px;background:var(--pri);color:#fff;font-size:22px;font-weight:800}
.wbtn:active{background:var(--pri-dk)}
.wbtn.again{background:#fff;color:var(--pri-dk)}
.wbtn[aria-disabled="true"]{background:#e6e6e6;border-color:#7a7a7a;border-style:dashed;color:#333;cursor:not-allowed}
/* 心得全文（現場可以直接改字） */
.essay{display:block;width:100%;min-height:360px;padding:14px 16px;border:3px solid var(--ink2);border-radius:14px;background:#fff;color:var(--ink);font-size:22px;line-height:1.7;resize:vertical;-webkit-appearance:none;appearance:none}
.essay:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri)}
.box ul{margin:6px 0 0;padding-left:1.3em}
.box li{margin:4px 0}
.alt{display:block;width:100%;min-height:56px;margin:12px 0 0;padding:12px 8px;color:var(--pri-dk);font-size:22px;font-weight:700;text-align:center;text-decoration:underline}
.pframe{position:fixed;right:0;bottom:0;width:2px;height:2px;border:0;opacity:0;pointer-events:none}
.rn{display:block;font-size:30px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.rs{display:block;font-size:22px;font-weight:700}
.rs.done{color:var(--ok)}
.rp{display:inline-block;margin-top:4px;padding:0 8px;border:2px solid var(--warn);border-radius:8px;background:var(--warn-bg);font-size:19px;font-weight:800}
.rc{display:inline-block;margin:4px 10px 0 0;font-size:20px;font-weight:700}
.ry{display:table;margin:2px 0 4px;padding:0 8px;border:2px solid var(--warn);border-radius:8px;background:var(--warn-bg);font-size:19px;font-weight:800}
.bar2{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin:24px 0 0}
.bar2 h1{margin:0}
.bar2 .btn{width:auto;margin:0;padding:8px 22px;min-height:64px;font-size:22px}
.ticks{list-style:none;margin:10px 0 0;padding:0;font-size:24px;font-weight:700}
.ticks li{margin:6px 0}
</style>
</head>

          else if (res.ok && j.ok === true) end({ ok: true, status: res.status, data: j });
          else end({ code: str(j['代碼']) || 'internal', status: res.status, msg: str(j['錯誤']), data: j });

  function startEssay(n) {
    var p = (cls['學員'] || []).filter(function (x) { return Number(x['編號']) === n; })[0];
    if (!p || missingText(p['已錄'] || {})) return;   // 4 題還沒錄完：按鈕是灰的
    dropPdf();
    essayNo = n;
    essay = { '編號': n, '姓名': str(p['姓名']), '講的字數': totalChars(p) };
    askRewrite = false;
    if (p['心得印好了']) { loadEssay(); return; }
    if (essay['講的字數'] < ENOUGH_CHARS) { show('few'); return; }
    writeEssay();
  }
  function writeEssay() {
    dropPdf();
    askRewrite = false;
    show('writing');
    call('POST', '/api/voice/write', JSON.stringify({ '編號': essayNo }), WAIT_MS.write, function (r) {
      if (!r.ok) {
        if (r.code === 'store_code') { askCode('bad', r); return; }
        note = { title: '心得還沒寫好', text: errText(r), again: !!RETRY[r.code], act: 'write' };
        show('msg');
        return;
      }
      var d = r.data;
      essay = { '編號': essayNo, '姓名': essay['姓名'], '講的字數': essay['講的字數'], '心得': str(d['心得']), '原文': str(d['心得']),
        '字數': d['字數'], '提醒': d['提醒'] || [], '句子': d['句子'] || [], '寫的時間': str(d['寫的時間']), '印好': false };
      show('essay');
    });
  }
  // 印過的：拿上次印的那份（看、再印；不用再叫 AI）。雲端說沒有（例：被刪了）就重寫一份
  function loadEssay() {
    loadingText = '讀取心得…';
    show('loading');
    call('GET', '/api/voice/essay?編號=' + essayNo, null, WAIT_MS.essay, function (r) {
      if (!r.ok) {
        if (r.code === 'store_code') { askCode('bad', r); return; }
        note = { title: '心得還沒拿到', text: errText(r), again: !!RETRY[r.code], act: 'essayLoad' };
        show('msg');
        return;
      }
      var c = r.data['心得內容'];
      if (!c || !str(c['心得'])) { writeEssay(); return; }
      essay = { '編號': essayNo, '姓名': essay['姓名'], '講的字數': essay['講的字數'], '心得': str(c['心得']), '原文': str(c['原文'] || c['心得']),
        '字數': c['字數'], '提醒': c['提醒'] || [], '句子': c['句子'] || [], '寫的時間': str(c['寫的時間']), '印好': true };
      show('essay');
    });
  }
  // 列印：用畫面上的字（現場可能改過）排成 PDF、存進雲端 → 電腦叫出列印視窗；手機、平板用新分頁打開。PDF 只放記憶體
  function printEssay() {
    if (printing) return;
    var t = document.getElementById('essayText'), m = document.getElementById('msg');
    var text = str(t ? t.value : essay['心得']);
    if (!text.replace(/\s/g, '')) { if (m) m.innerHTML = '<div class="box err"><p>心得是空的，請按「重寫」。</p></div>'; return; }
    essay['心得'] = text;
    printing = true;
    var b = document.getElementById('printBtn');
    if (b) b.textContent = '準備中，請稍等…';
    if (m) m.innerHTML = '';
    var body = { '編號': essayNo, '心得': text, '原文': essay['原文'], '提醒': essay['提醒'], '句子': essay['句子'], '寫的時間': essay['寫的時間'] };
    call('POST', '/api/voice/print', JSON.stringify(body), WAIT_MS.print, function (r) {
      printing = false;
      if (view !== 'essay') return;
      if (!r.ok) {
        if (r.code === 'store_code') { askCode('bad', r); return; }
        render();
        var m2 = document.getElementById('msg');
        if (m2) m2.innerHTML = '<div class="box err"><p>' + escBr('還沒有印：' + errText(r)) + '</p>' +
          (RETRY[r.code] ? '<button type="button" class="btn" data-act="printEssay">再試一次</button>' : '') + '</div>';
        return;
      }
      dropPdf();
      var blob = b64Blob(r.data.base64, 'application/pdf');
      essay.url = blob ? URL.createObjectURL(blob) : '';
      essay['印好'] = true;
      essay['頁數'] = r.data['頁數'];
      essay['已存雲端'] = r.data['已存雲端'];
      if (r.data['提醒'] && r.data['提醒'].length) essay['提醒'] = essay['提醒'].concat(r.data['提醒']);
      render();
      if (essay.url && !TOUCH) printUrl(essay.url);
    });
  }
  function b64Blob(b64, mime) {
    try {
      var s = atob(b64), a = new Uint8Array(s.length);
      for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
      return new Blob([a], { type: mime });
    } catch (e) { return null; }
  }
  // 隱藏框載入 PDF，載好叫出列印視窗；不能顯示 PDF、出錯、8 秒沒載好 → 新分頁打開（同 index.html）
  function printUrl(url) {
    var old = document.getElementById('pframe');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    if (navigator.pdfViewerEnabled === false) { openTab(url); return; }
    var fr = document.createElement('iframe'), done = false;
    var timer = setTimeout(function () { if (!done) { done = true; openTab(url); } }, 8000);
    fr.id = 'pframe';
    fr.className = 'pframe';
    fr.title = '列印用';
    fr.setAttribute('aria-hidden', 'true');
    fr.tabIndex = -1;
    fr.onload = function () {
      if (done) return;
      done = true;
      clearTimeout(timer);
      setTimeout(function () { try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (e) { openTab(url); } }, 300);
    };
    fr.src = url;
    document.body.appendChild(fr);
  }
  function openTab(url) {
    var w = null;
    try { w = window.open(url, '_blank'); } catch (e) { /* 被擋 */ }
    var m = document.getElementById('msg');
    if (!w && m) m.innerHTML = '<div class="box warn"><p>列印視窗叫不出來：請按上面的「用新分頁打開心得 PDF」，在新分頁按列印。</p></div>';
  }

  // ---------- 學員：問雲端這張卡是誰 ----------
  function loadWho(path) {
    loadingText = '請稍等…';
    show('loading');
    call('GET', path, null, WAIT_MS.who, function (r) {
      if (!r.ok) {
        if (mode === 'staff' && r.code === 'store_code') { askCode('bad', r); return; }
        note = { text: errText(r), again: !!RETRY[r.code], act: 'who' };
        show('msg');
        return;
      }
      var d = r.data, qs = Array.isArray(d['題目']) && d['題目'].length === 4 ? d['題目'] : TEST_QS;
      person = { '編號': Number(d['編號']), '姓名': str(d['姓名']), '梯次': str(d['梯次']), '題目': qs, '已錄': d['已錄'] || {} };
      idbList(personKey(person), function (list) { pending = list; show('confirm'); });
    });
  }
  function whoPath() { return mode === 'staff' ? '/api/voice/who?編號=' + encodeURIComponent(person['編號']) : '/api/voice/who?t=' + encodeURIComponent(token); }

  // 按了「是我」：這支手機有還沒傳上去的錄音就先傳；之後到第一題還沒講的（4 題都有了就到「全部收到」）
  function begin() {
    if (pending.length) { sendAll(function () { flash = 'sent'; goNext(); }); return; }
    goNext();
  }
  function goNext() {
    var n = firstMissing();
    if (!n) { show('all'); return; }
    q = n;
    show('question');
  }

  // ---------- 錄音 ----------
  function pickMime() {
    if (typeof MediaRecorder.isTypeSupported !== 'function') return '';
    for (var i = 0; i < MIMES.length; i++) { try { if (MediaRecorder.isTypeSupported(MIMES[i])) return MIMES[i]; } catch (e) { /* 略過 */ } }
    return '';
  }
  function micProblem(kind) {
    var t = {
      line: '在 LINE 裡面不能錄音。\n請用手機的相機掃小卡上的 QR code。',
      denied: '手機沒有讓這個網頁用麥克風。',
      busy: '找不到麥克風，或麥克風正在被別的程式用。',
      old: '這支手機的瀏覽器不能錄音。'
    };
    note = { text: t[kind] || t.old, kind: kind };
    show('mic');
  }
  function startRec() {
    if (rec) return;
    if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function' || typeof MediaRecorder !== 'function') {
      micProblem(IN_LINE ? 'line' : 'old');
      return;
    }
    rec = { chunks: [], starting: true };
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }).then(function (stream) {
      var mime = pickMime(), mr = null;
      try { mr = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 64000 } : { audioBitsPerSecond: 64000 }); }
      catch (e) { try { mr = new MediaRecorder(stream); } catch (e2) { mr = null; } }
      if (!mr) { stream.getTracks().forEach(function (t) { t.stop(); }); rec = null; micProblem('old'); return; }
      rec = { stream: stream, mr: mr, chunks: [], mime: mime, t0: Date.now(), timer: 0, lock: null, done: false };
      mr.ondataavailable = function (e) { if (e.data && e.data.size) rec.chunks.push(e.data); };
      mr.onstop = function () { finishRec(); };
      mr.onerror = function () { stopRec(); };
      try { mr.start(); } catch (e) { stream.getTracks().forEach(function (t) { t.stop(); }); rec = null; micProblem('old'); return; }
      show('recording');
      rec.timer = setInterval(tick, 250);
      try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (l) { if (rec) rec.lock = l; else l.release(); }, function () { /* 不支援 */ }); } catch (e) { /* 不支援 */ }
    }).catch(function (e) {
      rec = null;
      var n = e && e.name;
      micProblem(IN_LINE ? 'line' : n === 'NotAllowedError' || n === 'SecurityError' ? 'denied' : n === 'NotFoundError' || n === 'NotReadableError' || n === 'AbortError' ? 'busy' : 'old');
    });
  }
  function tick() {
    if (!rec || !rec.t0) return;
    var sec = (Date.now() - rec.t0) / 1000, left = MAX_SEC - sec;
    var c = document.getElementById('clock'), l = document.getElementById('left'), g = document.getElementById('goal');
    if (c) c.textContent = clock(sec);
    if (g && sec >= GOAL_SEC && g.className !== 'goal met') { g.textContent = '每一題講 1 分鐘以上最好 ✓'; g.className = 'goal met'; }   // 只是目標，不擋
    if (l) {
      l.textContent = left <= SOON_SEC ? '還可以講 ' + Math.max(0, Math.ceil(left)) + ' 秒' : '最多 5 分鐘';
      l.className = 'left' + (left <= SOON_SEC ? ' soon' : '');
    }
    if (left <= 0) stopRec();   // 5 分鐘到了自動停，照常存
  }
  function stopRec() {
    if (!rec || !rec.mr || rec.done) return;
    rec.done = true;
    clearInterval(rec.timer);
    try { if (rec.mr.state !== 'inactive') rec.mr.stop(); else finishRec(); } catch (e) { finishRec(); }
  }
  // 停好了：錄音先存進這台手機，再傳上去
  function finishRec() {
    if (!rec || rec.finished) return;
    var r = rec;
    r.finished = true;
    rec = null;
    clearInterval(r.timer);
    try { r.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) { /* 略過 */ }
    try { if (r.lock) r.lock.release(); } catch (e) { /* 略過 */ }
    var sec = (Date.now() - r.t0) / 1000;
    var mime = str((r.chunks[0] && r.chunks[0].type) || r.mr.mimeType || r.mime || 'audio/webm');
    var blob = new Blob(r.chunks, { type: mime });
    if (sec < MIN_SEC || !blob.size) {
      flash = '好像還沒講就停了。\n請再按一次「按這裡開始講」，講完再按「講完了」。';
      show('question');
      return;
    }
    var fr = new FileReader();
    fr.onload = function () {
      var clip = { id: newId(), key: personKey(person), t: mode === 'staff' ? '' : token, n: person['編號'], name: person['姓名'],
        q: q, mime: mime, buf: fr.result, sec: Math.round(sec), at: Date.now() };
      pending.push(clip);
      idbPut(clip);
      sendAll(function () { flash = 'got'; show('question'); });
    };
    fr.onerror = function () { flash = '錄音存不起來，請再講一次。'; show('question'); };
    fr.readAsArrayBuffer(blob);
  }

  // ---------- 傳上去：一段一段傳（雲端轉成文字、存進她的紀錄）；全部好了才 after() ----------
  var sending = false;
  function sendAll(after) {
    if (sending) return;
    if (!pending.length) { after(); return; }
    sending = true;
    show('sending');
    var clip = pending[0];
    var fr = new FileReader();
    fr.onload = function () {
      var b64 = String(fr.result).split(',')[1] || '';
      var body = { '題': clip.q, mime: clip.mime, base64: b64, id: clip.id, '秒數': clip.sec };
      if (clip.t) body.t = clip.t; else body['編號'] = clip.n;
      call('POST', '/api/voice/clip', JSON.stringify(body), WAIT_MS.clip, function (r) {
        sending = false;
        if (r.ok) {
          pending.shift();
          idbDel(clip.id);
          if (r.data['已錄']) person['已錄'] = r.data['已錄'];
          sendAll(after);
          return;
        }
        if (mode === 'staff' && r.code === 'store_code') { askCode('bad', r); return; }   // 通關碼換了：錄音留著，重新輸入
        if (RETRY[r.code]) { note = { text: errText(r), again: true, after: after }; show('fail'); return; }
        // 重試也沒用（沒聽到聲音、格式收不了、這一題夠了、卡過期…）：這一段丟掉，請她回到題目
        pending.shift();
        idbDel(clip.id);
        q = clip.q;
        note = { text: errText(r), again: false };
        show('fail');
      });
    };
    fr.onerror = function () { sending = false; pending.shift(); idbDel(clip.id); note = { text: '這一段錄音讀不出來，請再講一次。', again: false }; show('fail'); };
    fr.readAsDataURL(new Blob([clip.buf], { type: clip.mime }));
  }

  // ---------- 現場人員：通關碼 → 梯次 → 名單 ----------
  function askCode(why, r) {
    // 雲端打錯太多次先全部擋（15 分鐘）：記住的通關碼可能是對的，不清掉，只說原因（KNOWN_ISSUES 技術 41 的教訓）
    if (why === 'bad' && r && /太多次/.test(str(r.msg))) { note = { text: r.msg, again: false }; show('msg'); return; }
    codeWhy = why;
    if (why === 'bad') {
      storeCode = '';
      saveLocal(CODE_KEY, '');
      note = { text: /現場通關碼不對/.test(str(r && r.msg)) || !(r && r.msg) ? '通關碼不對，請重新輸入。\n這裡要用店裡電腦的通關碼（學員手機的不行）。' : r.msg };
    }
    show('code');
  }
  function onCodeOk() {
    var f = document.getElementById('f_code'), v = half(f ? f.value : '').replace(/\s+/g, ''), m = document.getElementById('msg');
    if (!/^\d{6}$/.test(v)) { if (m) m.innerHTML = '<div class="box err"><p>通關碼是 6 位數字，請再看一下。</p></div>'; return; }
    storeCode = v;
    saveLocal(CODE_KEY, v);
    loadBatches();
  }
  function loadBatches() {
    loadingText = '讀取梯次…';
    show('loading');
    call('GET', '/api/batches', null, WAIT_MS.batches, function (r) {
      if (!r.ok) {
        if (r.code === 'store_code') { askCode('bad', r); return; }
        note = { text: errText(r), again: !!RETRY[r.code], act: 'batches' };
        show('msg');
        return;
      }
      // 今天上課的排最前面：離今天越近越前面
      var today = new Date(); today.setHours(0, 0, 0, 0);
      function far(b) {
        var m = /^(\d{2,3})\/(\d{1,2})\/(\d{1,2})$/.exec(str(b['開課日']));
        return m ? Math.abs(new Date(Number(m[1]) + 1911, Number(m[2]) - 1, Number(m[3])) - today) : Infinity;
      }
      batches = (Array.isArray(r.data['梯次']) ? r.data['梯次'] : []).filter(function (b) { return b && b['梯次']; })
        .sort(function (a, b) { return far(a) - far(b); });
      show('batches');
    });
  }
  function loadClass(b) {
    clsBatch = b;
    saveLocal(BATCH_KEY, b);
    loadingText = '讀取名單…';
    show('loading');
    call('GET', '/api/voice/class?梯次=' + encodeURIComponent(b), null, WAIT_MS.cls, function (r) {
      if (!r.ok) {
        if (r.code === 'store_code') { askCode('bad', r); return; }
        note = { text: errText(r), again: !!RETRY[r.code], act: 'reload' };
        show('msg');
        return;
      }
      cls = r.data;
      cls.waits = {};
      idbList('', function (list) {   // 這支手機上還沒傳的（按人數）：名單上標出來，點她的名字就會先傳
        list.forEach(function (c) { if (c.key && c.key.indexOf('n:') === 0) cls.waits[c.key.slice(2)] = (cls.waits[c.key.slice(2)] || 0) + 1; });
        show('class');
      });
    });
  }
  function openList() {
    person = null; pending = [];
    dropPdf(); essay = null; askRewrite = false;
    if (clsBatch) loadClass(clsBatch); else loadBatches();
  }

  // ---------- 按鈕 ----------
  app.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || Date.now() - shownAt < GUARD_MS || el.getAttribute('aria-disabled') === 'true') return;
    var act = el.getAttribute('data-act');
    if (act === 'yes') begin();
    else if (act === 'notme') { if (mode === 'staff') openList(); else show('notme'); }
    else if (act === 'confirm') show('confirm');
    else if (act === 'start') startRec();
    else if (act === 'stop') stopRec();
    else if (act === 'next') {
      if (q < 4) { q++; show('question'); }
      else if (allDone()) show('all');
      else { q = firstMissing(); flash = '還有第 ' + q + ' 題還沒講。'; show('question'); }
    }
    else if (act === 'prev') { if (q > 1) { q--; show('question'); } else show('confirm'); }
    else if (act === 'review') { q = 1; show('question'); }
    else if (act === 'back2q') show(person ? 'question' : 'confirm');
    else if (act === 'resend') sendAll(note.after);
    else if (act === 'drop') {   // 傳不上去的那一段不要了：丟掉，回到那一題重新講
      var c = pending.shift();
      if (c) { idbDel(c.id); q = c.q; }
      if (pending.length) sendAll(goNext); else show('question');
    }
    else if (act === 'again') show('question');
    else if (act === 'who') loadWho(whoPath());
    else if (act === 'staff') { location.hash = '#' + STAFF_HASH; }
    else if (act === 'codeOk') onCodeOk();
    else if (act === 'batches') { clsBatch = ''; saveLocal(BATCH_KEY, ''); loadBatches(); }
    else if (act === 'batch') loadClass(el.getAttribute('data-b'));
    else if (act === 'reload') loadClass(clsBatch);
    else if (act === 'list') openList();
    else if (act === 'pick') { person = { '編號': Number(el.getAttribute('data-n')) }; loadWho(whoPath()); }
    else if (act === 'essay') startEssay(Number(el.getAttribute('data-n')));
    else if (act === 'fewMore') { person = { '編號': essayNo }; essay = null; loadWho(whoPath()); }   // 先補充：到她的錄音
    else if (act === 'fewWrite' || act === 'write' || act === 'rewriteYes') writeEssay();
    else if (act === 'essayLoad') loadEssay();
    else if (act === 'printEssay') printEssay();
    else if (act === 'rewrite') {   // 改過字又要重寫：先問一下（改的字會不見）
      if (essay && str(essay['心得']).replace(/\s/g, '') !== str(essay['原文']).replace(/\s/g, '')) { askRewrite = true; render(); }
      else writeEssay();
    }
    else if (act === 'rewriteNo') { askRewrite = false; render(); }
  });
  // 心得全文改字：記著（重畫、列印都用畫面上的字），字數跟著變、框跟著長高
  app.addEventListener('input', function (e) {
    if (!e.target || e.target.id !== 'essayText' || !essay) return;
    essay['心得'] = e.target.value;
    var c = document.getElementById('essayCount');
    if (c) c.textContent = countText(e.target.value);
    growEssay();
  });
  app.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.keyCode === 13) && e.target && e.target.id === 'f_code' && !e.isComposing) { e.preventDefault(); onCodeOk(); }
  });
  // 錄音中切到別的 App、螢幕關掉：先停下來，錄到的照常存（iPhone 背景會停麥克風）
  document.addEventListener('visibilitychange', function () { if (document.hidden && rec && rec.mr) stopRec(); });
  // 錄音中、傳送中按到重新整理、關掉：先問一下
  window.addEventListener('beforeunload', function (e) { if (rec || sending || view === 'writing' || printing) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('hashchange', function () { if (!rec && !sending && view !== 'writing') location.reload(); });

  // ---------- 開始 ----------
  // LINE 裡打開（用 LINE 掃 QR）：多半不能用麥克風 → 加 openExternalBrowser=1 請 LINE 改用手機的瀏覽器開（只試一次，不會一直跳）
  if (IN_LINE && !/[?&]openExternalBrowser=1/.test(location.search)) {
    try { location.replace(location.pathname + (location.search ? location.search + '&' : '?') + 'openExternalBrowser=1' + location.hash); return; } catch (e) { /* 照常開 */ }
  }
  var hash = location.hash.slice(1);
  try { hash = decodeURIComponent(hash); } catch (e) { /* 看不懂就照原樣 */ }
  var m = /(?:^|&)t=([A-Za-z0-9_-]+)/.exec(hash);
  if (m) { mode = 'student'; token = m[1]; loadWho(whoPath()); }
  else if (hash === STAFF_HASH) {
    mode = 'staff';
    storeCode = loadLocal(CODE_KEY);
    clsBatch = loadLocal(BATCH_KEY);
    if (!storeCode) askCode('first');
    else openList();
  } else show('nocode');
})();
</script>
